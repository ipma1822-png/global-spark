<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장기지 모바일 HOME · GB-37 v3.53.0</title><link rel="stylesheet" href="assets/css/style.css?v=3530"><style>:root{--bg:#071126;--panel:#0e1930;--card:#0a1428;--line:#ffffff15;--gold:#ff9f1c;--muted:#9fb2ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#173c66,var(--bg) 42%);color:#fff;padding-bottom:84px}.wrap{max-width:680px;margin:auto;padding:12px}.head,.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{color:#fff;text-decoration:none}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766;font-size:12px}.panel,.login{margin-top:11px;padding:15px;border-radius:19px;background:var(--panel);border:1px solid var(--line)}.hero h1{font-size:28px;margin:7px 0}.muted,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:13px;border-radius:15px;background:var(--card);border:1px solid var(--line)}.stat b{display:block;font-size:24px;margin-top:3px}.urgent{border-color:#ff9f1c88;background:#ff9f1c10}.danger{border-color:#ff6b6b88;background:#ff6b6b10}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action{display:block;padding:15px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:#fff;text-decoration:none;min-height:94px}.action strong{display:block;font-size:16px}.action b{display:block;font-size:25px;margin-top:6px;color:#ffd27a}.action.hot{border-color:#ff9f1c88}.health{display:grid;grid-template-columns:1fr 1fr;gap:9px}.healthbox{padding:14px;border-radius:16px;background:var(--card)}.healthbox b{font-size:28px;display:block}.campaigns{display:grid;gap:8px}.campaign{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.campaign h3{margin:7px 0}.btn,button{border:0;border-radius:11px;padding:10px 12px;background:var(--gold);color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.login input{width:100%;margin-top:8px;padding:12px;border-radius:11px;border:1px solid #ffffff1c;background:#091326;color:#fff}.login button{width:100%;margin-top:8px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#071126e8;backdrop-filter:blur(12px);border-top:1px solid #ffffff17;z-index:20}.bottom a{padding:9px 4px;border-radius:11px;text-align:center;color:#fff;text-decoration:none;font-size:11px}.bottom b{display:block;font-size:19px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #ffffff22;border-radius:14px}@media(max-width:390px){.wrap{padding:8px}.panel{padding:12px}.action{padding:12px}.hero h1{font-size:24px}}</style></head><body><main class="wrap"><header class="head"><a class="brand" href="index.html">🔥 <b>GLOBAL SPARK</b></a><span class="ver">GB-37 · v3.53.0</span></header><section class="panel hero"><small>GROWTH BASE MOBILE HOME</small><h1 id="centerName">성장기지 모바일 HOME</h1><p id="centerMeta" class="muted">오늘 필요한 운영부터 빠르게 확인합니다.</p><div class="line"><span id="role" class="tag">권한 확인 중</span><button id="refresh" class="secondary">새로고침</button></div></section><section id="loginBox" class="login"><b>성장기지 지도자 로그인</b><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button><p id="msg" class="muted"></p></section><section class="panel"><h2>오늘 먼저 할 일</h2><div id="today" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>바로 실행</h2><div id="actions" class="actions"></div></section><section class="panel"><h2>성장기지 상태</h2><div id="health" class="health"></div><p id="recommend" class="muted"></p></section><section id="campaigns" class="panel"><div class="line"><h2>글로벌 캠페인</h2><small id="campaignSummary"></small></div><div id="campaignList" class="campaigns"></div></section><section class="panel"><h2>공식 성장기지</h2><div id="official"></div></section></main><nav id="bottom" class="bottom"><a id="navHome" href="#"><b>🏠</b>HOME</a><a id="navSpark" href="#"><b>🔥</b>SPARK</a><a id="navApprove" href="#"><b>✅</b>승인</a><a href="my-centers.html"><b>🏫</b>내 센터</a></nav><script src="assets/js/config.js?v=3530"></script><script src="assets/js/spark-data.js?v=3530"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let code=new URLSearchParams(location.search).get('center')||'';let current=null;function n(v){return Number(v||0).toLocaleString()}function onboardingPercent(ob){const p=ob&&ob.progress;return p&&typeof p==='object'?Number(p.percent||0):Number(p||0)}async function resolveCenter(){if(code)return code;const rows=await SparkData.getMyCenters();if(!rows.length)throw new Error('NO_CENTER');code=rows[0].center_code;history.replaceState(null,'','?center='+encodeURIComponent(code));return code}function draw(d){current=d;const c=d.center||{},t=d.today||{},g=d.growth||{},cp=d.campaigns||{};$('loginBox').hidden=true;$('centerName').textContent=c.name||'성장기지 모바일 HOME';$('centerMeta').textContent=[c.center_code,c.region_name,c.designation_status==='official'?(c.designation_code||'공식 성장기지'):'운영 성장기지'].filter(Boolean).join(' · ');$('role').textContent=c.role||'STAFF';const today=[['승인대기',t.pending_submissions,'approvals'],['오늘 SPARK',t.today_activities,''],['진행 업무',t.open_tasks,''],['기한초과',t.overdue_tasks,'overdue']];$('today').innerHTML=today.map(x=>`<div class="stat ${x[2]==='approvals'&&Number(x[1])>0?'urgent':''} ${x[2]==='overdue'&&Number(x[1])>0?'danger':''}"><small>${x[0]}</small><b>${n(x[1])}</b></div>`).join('');$('actions').innerHTML=(d.quick_actions||[]).map(a=>`<a class="action ${a.key==='approvals'&&Number(a.count)>0?'hot':''}" href="${a.href.startsWith('#')?a.href:a.href}"><strong>${({approvals:'✅',members:'🔥',group:'👥',campaigns:'🌍',level:'🏅',health:'💓',onboarding:'🚀'}[a.key]||'•')} ${esc(a.label)}</strong>${a.count==null?'':`<b>${n(a.count)}</b>`}<small>${({approvals:'아이·부모 직접기록 확인',members:'개인 SPARK·회원 관리',group:'여러 명에게 한 번에',campaigns:'진행 캠페인 참여',level:'성장기지 운영 LEVEL',health:'운영 상태와 개선',onboarding:'공식지정 초기 7단계'}[a.key]||'')}</small></a>`).join('');$('health').innerHTML=`<div class="healthbox"><small>운영건강도</small><b>${g.health_score==null?'-':n(g.health_score)}</b><span>${esc(g.health_grade||'평가 전')}</span></div><div class="healthbox"><small>LEVEL</small><b>${g.level_no==null?'-':n(g.level_no)}</b><span>${esc(g.level_name||'평가 전')}</span></div>`;$('recommend').textContent=g.health_recommendation||`활성회원 ${n(g.active_members)}명 · 최근 7일 SPARK ${n(t.week_activities)}건`;$('campaignSummary').textContent=`진행 ${n(cp.active_campaigns)} · 참여 ${n(cp.joined_campaigns)}`;drawCampaigns(cp.items||[]);const ob=d.onboarding;$('official').innerHTML=c.designation_status==='official'?`<p><span class="tag">✓ OFFICIAL</span> ${esc(c.designation_code||'')}</p><p class="muted">${ob?`온보딩 진행 ${n(onboardingPercent(ob))}%`:'공식 성장기지 운영 중'}</p><a class="btn secondary" href="center-certificate.html?center=${encodeURIComponent(code)}">공식인증서 확인</a>`:'<p class="muted">현재 공식지정 전 운영 성장기지입니다. 기존 회원·활동·SPARK 운영은 그대로 사용할 수 있습니다.</p>';$('navHome').href='center-mobile-home.html?center='+encodeURIComponent(code);$('navSpark').href='center.html?center='+encodeURIComponent(code);$('navApprove').href='center-approvals.html?center='+encodeURIComponent(code)}function drawCampaigns(rows){$('campaignList').innerHTML=rows.length?rows.map(x=>`<article class="campaign"><span class="tag">${esc(x.flame_code||'SPARK')}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'')}</p><div class="line"><small>${x.enrollment_status==='active'?'참여 중':'미참여'}</small><button data-campaign="${esc(x.id)}" data-state="${esc(x.enrollment_status)}">${x.enrollment_status==='active'?'참여 취소':'성장기지 참여'}</button></div></article>`).join(''):'<div class="empty">현재 진행 중인 글로벌 캠페인이 없습니다.</div>';document.querySelectorAll('[data-campaign]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await SparkData.rpc('spark_center_campaign_join',{p_center_code:code,p_campaign_id:b.dataset.campaign,p_action:b.dataset.state==='active'?'withdraw':'join'});await load()}catch(e){alert('캠페인 참여 권한 또는 상태를 확인해 주세요.')}finally{b.disabled=false}})}async function load(){try{await resolveCenter();const d=await SparkData.rpc('spark_center_mobile_home',{p_center_code:code});draw(d)}catch(e){console.error(e);$('msg').textContent=e.message==='NO_CENTER'?'연결된 성장기지가 없습니다.':'로그인 또는 성장기지 권한을 확인해 주세요.'}}$('refresh').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
