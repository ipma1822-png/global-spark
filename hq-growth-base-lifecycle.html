<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLOBAL SPARK · 성장기지 수명주기 · GB-27 v3.43.0</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#eef2ff}main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{padding:8px 12px;border-radius:999px;background:#1e293b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.card,.row{background:#111827;border:1px solid #273449;border-radius:18px;padding:16px}.n{font-size:28px;font-weight:800}.muted{color:#9ca3af}.rows{display:grid;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{border:0;border-radius:12px;padding:10px 12px;background:#1f2937;color:white;text-decoration:none;cursor:pointer}.danger{background:#7f1d1d}.warn{background:#92400e}.good{background:#166534}input{width:100%;box-sizing:border-box;background:#0f172a;color:white;border:1px solid #334155;border-radius:10px;padding:9px;margin-top:8px}
  </style>
</head>
<body><main>
  <div class="top"><div><h1>공식 성장기지 수명주기</h1><div class="muted">GB-27 · v3.43.0 · HQ 전용</div></div><a href="command-center.html">← COMMAND CENTER</a></div>
  <div id="login" class="card">HQ 로그인이 필요합니다.<div class="actions"><input id="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button></div></div>
  <section id="app" hidden>
    <div class="grid"><div class="card"><div class="muted">공식</div><div id="official" class="n">0</div></div><div class="card"><div class="muted">정지</div><div id="suspended" class="n">0</div></div><div class="card"><div class="muted">취소</div><div id="revoked" class="n">0</div></div><div class="card"><div class="muted">종료</div><div id="closed" class="n">0</div></div></div>
    <div id="rows" class="rows"></div>
  </section>
</main>
<script src="assets/js/config.js?v=3430"></script><script src="assets/js/spark-data.js?v=3430"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function load(){const {data,error}=await SparkData.client.rpc('spark_hq_growth_base_lifecycle');if(error){alert(error.message);return}document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;const s=data.summary||{};for(const k of ['official','suspended','revoked','closed'])document.getElementById(k).textContent=s[k]||0;const rows=data.centers||[];document.getElementById('rows').innerHTML=rows.length?rows.map(c=>`<div class="row"><b>${esc(c.name)}</b> <span class="badge">${esc(c.designation_status)}</span><div class="muted">${esc(c.center_code)} · ${esc(c.designation_code||'공식번호 없음')} · 인증서 ${esc(c.certificate_status||'-')}</div><div class="muted">최근 이벤트: ${esc(c.latest_event||'-')} ${c.latest_event_at?new Date(c.latest_event_at).toLocaleString('ko-KR'):''}</div><input id="note-${esc(c.center_code)}" placeholder="조치 사유/메모"><div class="actions">${c.designation_status==='official'?`<button class="warn" onclick="act('${esc(c.center_code)}','suspend')">일시정지</button>`:''}${c.designation_status==='suspended'?`<button class="good" onclick="act('${esc(c.center_code)}','restore')">복원</button>`:''}${['official','suspended'].includes(c.designation_status)?`<button class="danger" onclick="act('${esc(c.center_code)}','revoke')">공식지정 취소</button><button class="danger" onclick="act('${esc(c.center_code)}','close')">성장기지 종료</button>`:''}</div></div>`).join(''):'<div class="card">현재 수명주기 관리 대상 공식 성장기지가 없습니다.</div>'}
async function act(code,action){const note=document.getElementById('note-'+code)?.value||'';if(!confirm(`${code}에 ${action} 조치를 적용할까요?`))return;const {error}=await SparkData.client.rpc('spark_hq_growth_base_lifecycle_action',{p_center_code:code,p_action:action,p_note:note});if(error){alert(error.message);return}load()}
window.act=act;document.getElementById('loginBtn').onclick=async()=>{const {error}=await SparkData.signIn(document.getElementById('email').value,document.getElementById('password').value);if(error)alert(error.message);else load()};SparkData.client.auth.getSession().then(({data})=>{if(data.session)load()});
</script></body></html>
