<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 공식 성장기지 온보딩 · GB-22 v3.38.0</title><link rel="stylesheet" href="assets/css/style.css?v=3380"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:980px;margin:auto;padding:18px}.head,.tools,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.step{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.muted,small{color:#9fb2ce}.bar{height:16px;background:#081326;border-radius:999px;overflow:hidden;border:1px solid #ffffff15}.bar>div{height:100%;background:linear-gradient(90deg,#ff9f1c,#ffd166);width:0}.grid{display:grid;gap:10px}.step.done{border-color:#52d27377}.step h3{margin:.2em 0}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#172743;font-weight:900}.done .num{background:#45c96b;color:#071126}.login input{padding:10px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff}.code{font-size:1.1rem;color:#ffd27a}@media(max-width:560px){.row{align-items:flex-start}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b> · GROWTH BASE</a><span class="ver">GB-22 · v3.38.0</span></header><section class="panel"><small>OFFICIAL GROWTH BASE ONBOARDING</small><h1>공식 성장기지 시작 체크리스트</h1><p class="muted">공식 지정 이후 실제 운영이 시작될 때까지 필요한 준비를 순서대로 확인합니다. 실제 데이터가 생기면 자동으로 완료되며, 운영 확인이 필요한 항목만 직접 확인합니다.</p><div class="tools"><a class="btn secondary" href="command-center.html">🌍 COMMAND CENTER</a><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>성장기지 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div class="row"><div><small>공식 성장기지</small><h2 id="name">-</h2><div id="designation" class="code"></div></div><div><b id="pct" style="font-size:34px">0%</b><small>온보딩 완료</small></div></div><div class="bar"><div id="bar"></div></div><p id="progress" class="muted"></p></section><section id="steps" class="grid"></section></main><script src="assets/js/config.js?v=3380"></script><script src="assets/js/spark-data.js?v=3380"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qs=new URLSearchParams(location.search);let code=qs.get('center')||'';let data=null;function draw(){const c=data.center||{},p=data.progress||{},steps=data.steps||[];$('name').textContent=c.name||'-';$('designation').textContent=c.designation_code||'';$('pct').textContent=(p.percent||0)+'%';$('bar').style.width=(p.percent||0)+'%';$('progress').textContent=`${p.done||0} / ${p.total||7} 단계 완료`;$('steps').innerHTML=steps.map((s,i)=>`<article class="step ${s.done?'done':''}"><div class="row"><div style="display:flex;gap:12px"><div class="num">${s.done?'✓':i+1}</div><div><small>${s.done?'완료':'진행 필요'}</small><h3>${esc(s.title)}</h3>${typeof s.count==='number'?`<small>현재 ${s.count}건</small>`:''}</div></div><div>${s.href?`<a class="btn secondary" href="${esc(s.href)}">열기</a>`:''}${s.manual&&!s.done?` <button data-step="${esc(s.key)}">확인 완료</button>`:''}</div></div></article>`).join('')}async function load(){if(!code){$('msg').textContent='URL에 ?center=성장기지코드가 필요합니다.';return}try{data=await SparkData.rpc('spark_center_onboarding_status',{p_center_code:code});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent=String(e?.message||e).includes('CENTER_NOT_OFFICIAL')?'공식 지정된 성장기지만 온보딩할 수 있습니다.':'로그인 또는 해당 성장기지 권한을 확인해 주세요.'}}$('steps').onclick=async e=>{const b=e.target.closest('button[data-step]');if(!b)return;if(!confirm('이 준비항목을 확인 완료로 표시할까요?'))return;try{data=await SparkData.rpc('spark_center_onboarding_confirm',{p_center_code:code,p_step:b.dataset.step});draw()}catch(err){alert('확인 저장에 실패했습니다.')}};$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
