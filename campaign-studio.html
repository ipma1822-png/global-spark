<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 캠페인 제작실</title><link rel="stylesheet" href="assets/css/style.css?v=3710"><style>body{background:#071126;color:#fff}.wrap{max-width:900px;margin:auto;padding:16px}.panel{padding:18px;margin:12px 0;border-radius:20px;background:#0e1930}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#091326;color:#fff}button{background:#ff9f1c;color:#071126;font-weight:900}.card{padding:14px;margin:8px 0;border-radius:14px;background:#091326}.muted{color:#9fb2ce}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff">🔥 GLOBAL SPARK</a><section class="panel"><small>GS-19 · v3.71.0</small><h1>🌍 글로벌 캠페인 제작실</h1><p class="muted">본부가 기간형·5대 불꽃 집중 캠페인을 만들고 공개·종료하며 참여성과를 확인합니다.</p></section><section class="panel" id="login"><div class="grid"><input id="email" type="email" placeholder="HQ 이메일"><input id="pw" type="password" placeholder="비밀번호"></div><button id="sign" style="margin-top:8px">본부 로그인</button><p id="msg" class="muted"></p></section><section class="panel" id="studio" hidden><h2>새 캠페인</h2><div class="grid"><input id="title" placeholder="캠페인 제목"><select id="flame"><option value="GOOD">❤️ 착한 불꽃</option><option value="SAFE">🛡️ 안전 불꽃</option><option value="EARTH">🌱 환경 불꽃</option><option value="CHALLENGE">🚀 도전 불꽃</option><option value="CITIZEN">🤝 함께 불꽃</option></select><input id="start" type="datetime-local"><input id="end" type="datetime-local"></div><textarea id="desc" rows="4" placeholder="누구나 이해할 수 있는 캠페인 설명" style="margin-top:8px"></textarea><button id="save" style="margin-top:8px">캠페인 저장</button></section><section class="panel" id="listBox" hidden><h2>캠페인 운영</h2><div id="list"></div></section></main><script src="assets/js/config.js?v=3710"></script><script src="assets/js/spark-data.js?v=3710"></script><script>(()=>{const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const rows=await SparkData.rpc('spark_hq_campaigns',{});$('login').hidden=true;$('studio').hidden=false;$('listBox').hidden=false;$('list').innerHTML=(rows||[]).length?(rows||[]).map(c=>`<article class="card"><small>${esc(c.flame_code)} · ${esc(c.status)}</small><h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p><p class="muted">${new Date(c.starts_at).toLocaleString('ko-KR')} ~ ${new Date(c.ends_at).toLocaleString('ko-KR')}</p><div class="grid"><button data-id="${c.id}" data-status="published">공개</button><button data-id="${c.id}" data-status="closed">종료</button></div></article>`).join(''):'<p class="muted">아직 캠페인이 없습니다.</p>'}catch(e){$('msg').textContent='HQ 권한을 확인해 주세요.'}}$('sign').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await load()}catch(e){$('msg').textContent='로그인 또는 HQ 권한을 확인해 주세요.'}};$('save').onclick=async()=>{if(!$('title').value.trim()||!$('start').value||!$('end').value)return alert('제목과 기간을 입력해 주세요.');if(new Date($('end').value)<=new Date($('start').value))return alert('종료일은 시작일 이후여야 합니다.');try{await SparkData.rpc('spark_hq_save_campaign',{p_id:null,p_title:$('title').value.trim(),p_description:$('desc').value.trim(),p_flame_code:$('flame').value,p_starts_at:new Date($('start').value).toISOString(),p_ends_at:new Date($('end').value).toISOString()});$('title').value='';$('desc').value='';await load()}catch(e){alert('캠페인을 저장하지 못했습니다. HQ 권한을 확인해 주세요.')}};$('list').onclick=async e=>{const b=e.target.closest('[data-id]');if(!b)return;if(!confirm(b.dataset.status==='published'?'이 캠페인을 공개할까요?':'이 캠페인을 종료할까요?'))return;try{await SparkData.rpc('spark_hq_set_campaign_status',{p_id:b.dataset.id,p_status:b.dataset.status});await load()}catch(e){alert('상태를 변경하지 못했습니다.')}};if(SparkData.isSignedIn())load()})();</script></body></html>
