<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 공식 성장기지 인증서 · GB-07 v3.23.0</title><link rel="stylesheet" href="assets/css/style.css?v=3230"><style>body{background:#071126;color:#fff;margin:0}.wrap{max-width:920px;margin:auto;padding:18px}.head,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.ver{padding:7px 10px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a;font-size:12px}.panel{margin-top:14px;padding:18px;border:1px solid #ffffff18;border-radius:22px;background:#101a30}.certificate{padding:28px;border:2px solid #ffb34788;border-radius:24px;background:#0b1528;text-align:center}.certificate h2{font-size:clamp(26px,5vw,44px);margin:10px 0}.seal{font-size:52px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;text-align:left}.meta div{padding:13px;background:#ffffff08;border-radius:14px}.meta small,.meta b{display:block}.meta small{color:#9fb2cb}.qr{width:180px;height:180px;background:#fff;padding:8px;border-radius:14px;margin:22px auto 8px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;text-decoration:none}.primary{background:#ff9f1c;color:#071126}.secondary{background:#17243b;color:#fff}.notice{color:#b9c9df;line-height:1.7}@media(max-width:620px){.meta{grid-template-columns:1fr}}@media print{body{background:#fff;color:#111}.head,.actions,.panel.notice-panel{display:none}.panel{border:0;background:#fff}.certificate{border:3px solid #222;background:#fff}}</style></head><body><main class="wrap"><header class="head"><div><small>🔥 GLOBAL SPARK · OFFICIAL CERTIFICATE</small><h1>공식 성장기지 인증서</h1></div><div class="ver">GB-07 · v3.23.0</div></header><section class="panel notice-panel"><p class="notice">본부가 공식 승인한 성장기지만 인증서와 QR 공식조회가 활성화됩니다. QR은 공개 공식조회 주소만 담으며 아이·연락처 등 개인정보는 포함하지 않습니다.</p></section><section class="panel"><div id="view">공식 인증정보를 불러오는 중…</div></section><div class="actions" style="margin-top:12px"><a class="btn secondary" href="my-centers.html">← 내 성장기지</a><button id="printBtn" class="btn primary">인증서 인쇄</button></div></main><script src="assets/js/config.js?v=3230"></script><script src="assets/js/spark-data.js?v=3230"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),center=new URLSearchParams(location.search).get('center')||'';async function load(){if(!center){$('view').textContent='성장기지 코드가 없습니다.';return}try{const raw=await SparkData.rpc('spark_center_certificate_info',{p_center_code:center}),d=Array.isArray(raw)?raw[0]:raw;if(d.designation_status!=='official'||!d.designation_code){$('view').innerHTML=`<div class="certificate"><div class="seal">🔥</div><h2>${esc(d.center_name||center)}</h2><p>아직 GLOBAL SPARK 공식지정 인증이 완료되지 않았습니다.</p><div class="meta"><div><small>운영용 센터코드</small><b>${esc(d.center_code||center)}</b></div><div><small>공식지정 상태</small><b>${esc(d.designation_status||'unassigned')}</b></div></div></div>`;return}const verify=new URL('growth-base.html',location.href);verify.searchParams.set('code',d.designation_code);const qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(verify.href);$('view').innerHTML=`<div class="certificate"><div class="seal">🔥</div><small>GLOBAL SPARK OFFICIAL GROWTH BASE</small><h2>${esc(d.center_name)}</h2><p>위 기관을 GLOBAL SPARK 공식 성장기지로 지정합니다.</p><div class="meta"><div><small>공식지정번호</small><b>${esc(d.designation_code)}</b></div><div><small>공식인증서 번호</small><b>${esc(d.certificate_no||'발급 대기')}</b></div><div><small>국가 · 지역</small><b>${esc(d.country_code||'')} · ${esc(d.region_name||'')}</b></div><div><small>지정일</small><b>${d.designated_at?new Date(d.designated_at).toLocaleDateString('ko-KR'):'-'}</b></div></div><img class="qr" src="${qr}" alt="공식 성장기지 조회 QR"><p><b>QR을 스캔하면 GLOBAL SPARK 공식조회 화면에서 현재 인증상태를 확인할 수 있습니다.</b></p></div>`}catch(e){console.error(e);$('view').textContent='인증정보를 불러오지 못했습니다. 지도자 로그인과 권한을 확인해 주세요.'}}$('printBtn').onclick=()=>window.print();load()})();</script></body></html>
