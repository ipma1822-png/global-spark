<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 30일 파일럿</title><link rel="stylesheet" href="assets/css/style.css?v=3700"><style>:root{--bg:#071126;--panel:#0e1930;--card:#091326;--line:#ffffff16;--gold:#ff9f1c;--muted:#9fb2ce;--ok:#55d87b;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173c66,var(--bg) 42%);color:#fff}.wrap{max-width:820px;margin:auto;padding:14px 14px 90px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{color:#fff;text-decoration:none}.panel{margin-top:12px;padding:17px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}.hero{border-color:#ffb34755;background:radial-gradient(circle at 10% 0,#ff9f1c20,transparent 42%),var(--panel)}.muted,small{color:var(--muted)}.btn,button{display:inline-block;padding:11px 14px;border:0;border-radius:11px;background:var(--gold);color:#071126;font-weight:950;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid var(--line)}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input,.select{padding:12px;border-radius:11px;background:var(--card);color:#fff;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:14px;border-radius:15px;background:var(--card);border:1px solid var(--line)}.stat b{display:block;font-size:25px;margin-top:3px}.bar{height:14px;border-radius:999px;background:#071126;overflow:hidden;border:1px solid var(--line)}.bar>div{height:100%;background:linear-gradient(90deg,#ffd166,#ff9f1c);width:0}.timeline{display:grid;gap:10px}.mile{padding:15px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.mile.done{border-color:#55d87b66;background:#55d87b0b}.mile.overdue{border-color:#ff6b6b66;background:#ff6b6b0b}.day{display:inline-grid;place-items:center;width:52px;height:32px;border-radius:999px;background:#172743;font-weight:950}.status{font-weight:950}.ok{color:#8ff0b1}.bad{color:#ffaaaa}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #ffffff20;border-radius:14px}.version{display:none}@media(max-width:620px){.login,.stats{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><main class="wrap"><header class="head"><a class="brand" href="index.html">🔥 <b>GLOBAL SPARK</b></a><a class="btn secondary" href="my-centers.html">내 성장기지</a></header><section class="panel hero"><small>GS-18 · 30-DAY PILOT</small><h1>공식 성장기지<br>첫 30일 운영판</h1><p class="muted">처음 30일 동안 꼭 필요한 다섯 가지 운영 이정표를 자동으로 확인합니다. 이미 완료된 항목은 다시 입력하지 않습니다.</p></section><section class="panel" id="loginBox"><h2>지도자 로그인</h2><div class="login"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel" id="choose" hidden><div class="row"><div><small>성장기지 선택</small><h2 style="margin:.2em 0">30일 파일럿</h2></div><select id="center" class="select"></select></div></section><section id="dash" hidden><section class="panel"><div class="row"><div><small id="designation">공식 성장기지</small><h2 id="name">-</h2><p id="days" class="muted"></p></div><div style="text-align:right"><small>진행률</small><b id="pct" style="display:block;font-size:34px">0%</b></div></div><div class="bar"><div id="bar"></div></div><div class="stats" style="margin-top:12px"><div class="stat"><small>현재 단계</small><b id="stage">-</b></div><div class="stat"><small>지연 항목</small><b id="overdue">0</b></div><div class="stat"><small>운영상태</small><b id="support">-</b></div></div><p id="recommend" class="muted"></p></section><section class="panel"><h2>D+1 → D+30 이정표</h2><div id="timeline" class="timeline"></div></section><section class="panel"><h2>지금 바로 할 수 있는 운영</h2><div class="actions"><a id="home" class="btn" href="#">📱 모바일 HOME</a><a id="invite" class="btn secondary" href="#">👥 참여자 초대</a><a id="spark" class="btn secondary" href="#">🔥 SPARK 지급</a><a id="approve" class="btn secondary" href="#">✅ 빠른 승인</a><a id="level" class="btn secondary" href="#">🏅 LEVEL 확인</a><a id="manual" class="btn secondary" href="#">📘 운영 매뉴얼</a></div></section></section><div class="version">GS-18 · v3.70.0</div></main><script src="assets/js/config.js?v=3700"></script><script src="assets/js/spark-data.js?v=3700"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let centers=[];function stageLabel(s){return({day1:'D+1',day3:'D+3',day7:'D+7',day14:'D+14',day30:'D+30',completed:'완료'}[s]||s||'-')}function supportLabel(s){return({completed:'완료',risk:'위험',attention:'확인 필요',on_track:'정상'}[s]||s||'-')}function hrefs(code){$('home').href='center-mobile-home.html?center='+encodeURIComponent(code);$('invite').href='center-invite.html?center='+encodeURIComponent(code);$('spark').href='center.html?center='+encodeURIComponent(code);$('approve').href='center-approvals.html?center='+encodeURIComponent(code);$('level').href='center-level.html?center='+encodeURIComponent(code);$('manual').href='growth-base-manual.html?center='+encodeURIComponent(code)}async function loadCenters(){centers=await SparkData.getMyCenters();$('loginBox').hidden=true;$('choose').hidden=false;$('center').innerHTML=centers.length?centers.map(c=>`<option value="${esc(c.center_code)}">${esc(c.name)} · ${esc(c.center_code)}</option>`).join(''):'<option value="">연결된 성장기지가 없습니다</option>';const wanted=new URLSearchParams(location.search).get('center');if(wanted&&centers.some(c=>c.center_code===wanted))$('center').value=wanted;if($('center').value)await load()}async function load(){const code=$('center').value;if(!code)return;$('msg').textContent='';try{const d=await SparkData.rpc('spark_center_30day_support',{p_center_code:code});$('dash').hidden=false;$('name').textContent=d.center_name||code;$('designation').textContent='공식지정번호 · '+(d.designation_code||'-');$('days').textContent=`지정 후 ${Number(d.days_since_designation||0)}일 · ${d.designated_at?new Date(d.designated_at).toLocaleDateString('ko-KR')+' 지정':''}`;$('pct').textContent=Number(d.progress_percent||0)+'%';$('bar').style.width=Number(d.progress_percent||0)+'%';$('stage').textContent=stageLabel(d.current_stage);$('overdue').textContent=Number(d.overdue_count||0);$('support').textContent=supportLabel(d.support_status);$('recommend').textContent=d.recommendation||'';$('timeline').innerHTML=(d.milestones||[]).map(m=>`<article class="mile ${m.completed?'done':''} ${m.overdue?'overdue':''}"><div class="row"><div><span class="day">D+${Number(m.day)}</span><h3>${esc(m.title)}</h3></div><div class="status ${m.completed?'ok':m.overdue?'bad':''}">${m.completed?'✓ 완료':m.overdue?'⚠ 지연':'진행 전'}</div></div></article>`).join('');hrefs(code);history.replaceState(null,'','?center='+encodeURIComponent(code))}catch(e){console.error(e);$('dash').hidden=true;const m=String(e?.message||e);$('msg').textContent=m.includes('CENTER_NOT_OFFICIAL')?'이 기능은 본부가 공식 지정한 성장기지의 첫 30일 운영에 사용됩니다. 현재 성장기지는 공식 지정 전입니다.':'30일 운영정보를 불러오지 못했습니다.'}}$('center').onchange=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await loadCenters()}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())loadCenters().catch(()=>{$('msg').textContent='성장기지 정보를 확인해 주세요.'})})();</script></body></html>
