<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 정기 운영평가·재인증 · GB-26 v3.42.0</title><link rel="stylesheet" href="assets/css/style.css?v=3420"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.panel,.card,.login{margin-top:14px;padding:16px;border-radius:18px;background:#0e1930;border:1px solid #ffffff15}.head,.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.ver,.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#172743}.ver{color:#ffd27a}.grid{display:grid;gap:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#0a1428;padding:12px;border-radius:14px}.stat b{display:block;font-size:24px}.muted,small{color:#9fb2ce}.btn,button{padding:9px 11px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900}.secondary{background:#172743;color:#fff}.normal{border-left:4px solid #4dd4ac}.watch{border-left:4px solid #ffd166}.support_needed{border-left:4px solid #ff9f1c}.review_needed,.insufficient_data{border-left:4px solid #ff6b6b}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ 정기 운영평가</div><span class="ver">GB-26 · v3.42.0</span></header><section class="panel"><h1>정기 운영평가 · 재인증</h1><p class="muted">공식 지정 후 30일이 지난 성장기지를 90일 주기로 평가합니다. 재인증은 자동 승인되지 않으며 HQ 최종 판단으로만 확정됩니다.</p></section><section id="loginBox" class="login"><b>HQ 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div class="head"><h2>📊 평가 현황</h2><button id="reload" class="secondary">새로고침</button></div><div id="stats" class="stats"></div></section><section class="panel"><h2>🏫 성장기지 평가 목록</h2><div id="rows" class="grid"></div></section></main><script src="assets/js/config.js?v=3420"></script><script src="assets/js/spark-data.js?v=3420"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const labels={normal:'정상',watch:'주의',support_needed:'지원필요',review_needed:'재검토',insufficient_data:'자료부족',pending:'판정대기',renewed:'재인증',support_required:'지원필수',held:'보류'};async function action(id,a){const note=prompt(a==='renew'?'재인증 메모(선택)':a==='require_support'?'지원 필요 사유':'보류 사유')||'';try{await SparkData.rpc('spark_hq_recertification_action',{p_evaluation_id:id,p_action:a,p_note:note});await load()}catch(e){alert(e.message||'처리하지 못했습니다.')}}function draw(d){const rows=d.rows||[];const counts={normal:0,watch:0,support_needed:0,review_needed:0,insufficient_data:0};rows.forEach(r=>counts[r.evaluation_status]=(counts[r.evaluation_status]||0)+1);$('stats').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="stat"><small>${labels[k]}</small><b>${v}</b></div>`).join('');$('rows').innerHTML=rows.map(r=>`<article class="card ${esc(r.evaluation_status)}"><div class="head"><div><b>${esc(r.center_name)}</b><small>${esc(r.designation_code||r.center_code)} · ${r.cycle_no}차 평가</small></div><div><span class="tag">${labels[r.evaluation_status]||r.evaluation_status}</span> <span class="tag">${labels[r.recertification_status]||r.recertification_status}</span></div></div><p>${esc(r.recommendation||'')}</p><small>건강도 ${r.health_score??'-'}점 · 미해결 알림 ${r.open_alerts} · 긴급 ${r.critical_alerts} · 기한초과 업무 ${r.overdue_tasks} · 30일 활동 ${r.activities_30d}</small><div class="actions" style="margin-top:12px"><small>${esc(r.period_start)} ~ ${esc(r.period_end)}</small><div><button onclick="window.gb26('${r.id}','renew')">재인증</button> <button class="secondary" onclick="window.gb26('${r.id}','require_support')">지원필수</button> <button class="secondary" onclick="window.gb26('${r.id}','hold')">보류</button></div></div></article>`).join('')||'<p class="muted">아직 정기평가 대상 성장기지가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_hq_periodic_center_evaluations',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){$('msg').textContent='HQ 권한으로 로그인해 주세요.'}}window.gb26=action;$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
