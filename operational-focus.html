<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 오늘의 운영포커스 · GB-15 v3.31.0</title><link rel="stylesheet" href="assets/css/style.css?v=3310"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.task{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.grid{display:grid;gap:10px}.task.due_soon{border-color:#ffd16688}.task.overdue,.task.escalated_24h{border-color:#ff9f1c99}.task.escalated_72h{border-color:#ff5c5ccc;box-shadow:0 0 0 1px #ff5c5c33}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button.active{outline:2px solid #fff}.badge0{color:#ffe09c}.badge1{color:#ffc078}.badge2{color:#ff9f68}.badge3{color:#ff7777}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · OPERATIONS</div><div class="ver">GB-15 · v3.31.0</div></header><section class="panel"><small>DEADLINE & ESCALATION FOCUS</small><h1>오늘의 운영 포커스</h1><p class="muted">마감 24시간 이내·기한초과·24시간 초과·72시간 초과 업무를 자동 분류합니다. 자동화는 담당자를 바꾸거나 업무를 완료하지 않고, 상위관리자에게 확인 우선순위만 올립니다.</p><div class="tools"><div><a class="btn secondary" href="operational-tasks.html">📋 운영업무</a> <a class="btn secondary" href="daily-briefing.html">☀️ 브리핑</a> <a class="btn secondary" href="operational-alerts.html">🚨 알림센터</a></div><button id="reload">지금 다시 확인</button></div></section><section id="loginBox" class="login"><b>관리자 / 담당자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><div class="head"><h2>🎯 우선 처리 업무</h2><div class="filters" id="filters"><button class="secondary active" data-f="all">전체</button><button class="secondary" data-f="mine">내 담당</button><button class="secondary" data-f="due_soon">마감임박</button><button class="secondary" data-f="overdue">기한초과</button><button class="secondary" data-f="escalated">에스컬레이션</button></div></div><div id="tasks" class="grid"></div></section></main><script src="assets/js/config.js?v=3310"></script><script src="assets/js/spark-data.js?v=3310"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={summary:{},tasks:[]},filter='all';const labels={normal:'일반',today:'오늘',due_soon:'24시간 이내',overdue:'기한초과',escalated_24h:'24시간 초과',escalated_72h:'72시간 초과'};function fmt(d){return d?new Date(d).toLocaleString():'기한 없음'}function draw(){const s=data.summary||{};$('stats').innerHTML=[['내 담당',s.mine],['오늘 마감',s.today],['마감임박',s.due_soon],['기한초과',s.overdue],['상위보고',s.escalated],['긴급업무',s.critical]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');let rows=data.tasks||[];if(filter==='mine')rows=rows.filter(x=>x.mine);if(filter==='due_soon')rows=rows.filter(x=>x.focus_state==='due_soon');if(filter==='overdue')rows=rows.filter(x=>['overdue','escalated_24h','escalated_72h'].includes(x.focus_state));if(filter==='escalated')rows=rows.filter(x=>Number(x.escalation_level)>=2);$('tasks').innerHTML=rows.map(t=>`<article class="task ${esc(t.focus_state)}"><div class="head"><div><span class="tag badge${Number(t.escalation_level||0)}">${esc(labels[t.focus_state]||t.focus_state)}</span> <span class="tag">${esc(t.priority)}</span> <b>${esc(t.center_name)}</b></div><small>${esc(t.country_code)} ${esc(t.region_name||'')}</small></div><h3>${esc(t.title)}</h3><p>${esc(t.description||'')}</p><small>담당 ${esc(t.assignee_email)} · 기한 ${esc(fmt(t.due_at))}${t.audience?' · 확인대상 '+esc(t.audience):''}</small><div style="margin-top:10px"><a class="btn secondary" href="operational-tasks.html">업무 처리하기 →</a></div></article>`).join('')||'<p class="muted">현재 조건에 해당하는 운영업무가 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_operational_focus_center',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='로그인 또는 운영업무 권한을 확인해 주세요.'}}$('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));draw()};$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
