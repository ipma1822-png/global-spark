<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 성장기지 가입</title><link rel="stylesheet" href="assets/css/style.css?v=3600"><style>body{background:#071126;color:#fff}.wrap{max-width:700px;margin:auto;padding:18px}.panel{margin:14px 0;padding:18px;border-radius:20px;background:#0e1930}.muted{color:#9fb2ce}.row{display:grid;gap:9px}.row input,.row select{padding:12px;border-radius:10px;background:#091326;color:#fff;border:1px solid #ffffff20}.btn,button{padding:12px 14px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><section class="panel"><small>GROWTH BASE INVITATION</small><h1 id="title">성장기지 초대 확인 중…</h1><p id="info" class="muted"></p></section><section class="panel"><h2>학부모 · 보호자 로그인</h2><p class="muted">먼저 GLOBAL SPARK 개인 참여 계정과 자녀 연결이 필요합니다.</p><div class="row"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p><p><a class="btn" href="personal-start.html">처음이면 개인 참여 가입</a> <a class="btn" href="family.html">자녀 먼저 연결</a></p></section><section class="panel" id="childBox" hidden><h2>가입할 아이 선택</h2><div id="children"></div></section></main><script src="assets/js/config.js?v=3600"></script><script src="assets/js/spark-data.js?v=3600"></script><script>(()=>{const $=x=>document.getElementById(x),token=new URLSearchParams(location.search).get('invite')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function invite(){try{const r=await SparkData.publicRpc('spark_public_center_invite',{p_token:token});if(!r.valid)throw 0;$('title').textContent='🔥 '+r.center_name+'에서 초대했습니다';$('info').textContent=(r.region_name||'')+' · GLOBAL SPARK 성장기지 회원으로 참여할 아이를 선택해 주세요.'}catch(_){$('title').textContent='사용할 수 없는 초대링크입니다';$('info').textContent='성장기지에 새 초대링크를 요청해 주세요.'}}async function children(){try{const a=await SparkData.rpc('spark_my_family_children',{});$('childBox').hidden=false;$('children').innerHTML=a.length?a.filter(x=>x.status==='active').map(x=>`<div style="padding:14px;margin-top:9px;background:#091326;border-radius:12px"><b>${esc(x.display_name)}</b> · ${esc(x.age_group)} <button data-id="${x.id}">이 아이 가입 신청</button></div>`).join(''):'<p class="muted">연결된 자녀가 없습니다. 먼저 자녀를 연결해 주세요.</p>'}catch(_){$('msg').textContent='자녀 정보를 불러오지 못했습니다.'}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);$('msg').textContent='로그인되었습니다.';await children()}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};$('children').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;try{const r=await SparkData.rpc('spark_center_join_request',{p_token:token,p_child_id:b.dataset.id});$('childBox').innerHTML='<h2>✅ 가입 신청 완료</h2><p>성장기지 지도자가 확인하면 회원 연결이 완료됩니다.</p>'}catch(e){$('msg').textContent='가입 신청을 처리하지 못했습니다. 개인 참여 프로필과 자녀 연결을 확인해 주세요.'}};invite();if(SparkData.isSignedIn())children()})();</script></body></html>
