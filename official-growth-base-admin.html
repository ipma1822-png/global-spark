<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 공식 성장기지 지정센터 · GB-21 v3.37.0</title><link rel="stylesheet" href="assets/css/style.css?v=3370"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1120px;margin:auto;padding:18px}.head,.tools,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{padding:12px;border-radius:14px;background:#0a1428}.stat b{display:block;font-size:24px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.danger{background:#5b2931;color:#fff}.grid{display:grid;gap:10px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.meta div{padding:9px;border-radius:10px;background:#0a1428}.note{padding:10px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff;min-width:240px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.meta{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b> · HQ</a><span class="ver">GB-21 · v3.37.0</span></header><section class="panel"><small>OFFICIAL GROWTH BASE PIPELINE</small><h1>공식 성장기지 지정센터</h1><p class="muted">신청 접수부터 HQ 검토, 공식 지정번호, 인증서, 공개조회까지 하나의 흐름으로 관리합니다.</p><div class="tools"><div><a class="btn secondary" href="command-center.html">🌍 COMMAND CENTER</a> <a class="btn secondary" href="world-network.html">🌐 세계 네트워크</a></div><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>HQ 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><div class="head"><h2>🏫 공식 성장기지 신청</h2><select id="filter"><option value="all">전체</option><option value="received">접수</option><option value="reviewing">검토중</option><option value="approved">승인</option><option value="rejected">거절</option></select></div><div id="apps" class="grid"></div></section></main><script src="assets/js/config.js?v=3370"></script><script src="assets/js/spark-data.js?v=3370"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={received:'접수',reviewing:'검토중',approved:'승인',rejected:'거절'};let data={summary:{},applications:[]};function draw(){const s=data.summary||{};$('stats').innerHTML=[['접수',s.received],['검토중',s.reviewing],['승인',s.approved],['거절',s.rejected],['공식 성장기지',s.official_centers],['활성 인증서',s.certificates]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');const f=$('filter').value,rows=(data.applications||[]).filter(a=>f==='all'||a.status===f);$('apps').innerHTML=rows.map(a=>`<article class="card"><div class="head"><div><span class="tag">${esc(labels[a.status]||a.status)}</span> <b>${esc(a.organization_name||'기관명 없음')}</b><small>${esc(a.request_code)}</small></div><small>${new Date(a.created_at).toLocaleString()}</small></div><div class="meta"><div><small>신청자</small><br>${esc(a.applicant_name)}</div><div><small>국가·지역</small><br>${esc(a.country_code||'-')} · ${esc(a.region_name||'-')}</div><div><small>연락</small><br>${esc(a.contact_email||a.contact_phone||'-')}</div><div><small>공식번호</small><br>${esc(a.designation_code||'미발급')}</div></div>${a.message?`<p>${esc(a.message)}</p>`:''}${a.certificate_no?`<p><b>🏅 인증서 ${esc(a.certificate_no)}</b> · ${esc(a.certificate_status||'')}</p>`:''}<div class="actions"><input class="note" placeholder="본부 검토 메모" value="${esc(a.review_note||'')}">${!a.center_id?`<button class="secondary review" data-id="${a.id}">검토중</button><button class="approve" data-id="${a.id}">공식 지정 승인</button><button class="danger reject" data-id="${a.id}">거절</button>`:`<a class="btn secondary" href="growth-base.html?code=${encodeURIComponent(a.designation_code||'')}">공식조회</a><a class="btn secondary" href="center-certificate.html?center=${encodeURIComponent(a.center_code||'')}">인증서</a>`}</div></article>`).join('')||'<p class="muted">해당 신청이 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_hq_official_growth_base_pipeline',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='HQ 관리자 권한을 확인해 주세요.'}}$('apps').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const card=b.closest('.card'),note=card.querySelector('.note').value.trim(),id=b.dataset.id;try{if(b.classList.contains('approve')){if(!confirm('이 신청을 공식 성장기지로 지정하고 공식번호·인증서를 발급할까요?'))return;const r=await SparkData.rpc('spark_hq_approve_official_center_application',{p_application_id:id,p_note:note||null});alert('공식 지정 완료 · '+r.designation_code+' · 인증서 '+(r.certificate?.certificate_no||''));}else{const action=b.classList.contains('reject')?'rejected':'reviewing';await SparkData.rpc('spark_hq_review_official_center_application',{p_application_id:id,p_action:action,p_note:note||null});}await load()}catch(err){console.error(err);alert('처리에 실패했습니다. 신청 상태와 HQ 권한을 확인해 주세요.')}};$('filter').onchange=draw;$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
