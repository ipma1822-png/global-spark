<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 국가·지역 관리자 · GB-10 v3.26.0</title><link rel="stylesheet" href="assets/css/style.css?v=3260"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1050px;margin:auto;padding:18px}.head,.form,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel,.login{margin-top:15px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.form input,.form select,.login input{padding:11px;border-radius:11px;border:1px solid #ffffff1a;background:#091326;color:#fff}.form input{flex:1;min-width:150px}.btn,.login button{padding:11px 14px;border:0;border-radius:11px;background:#ff9f1c;color:#071126;font-weight:900;cursor:pointer;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.list{display:grid;gap:9px;margin-top:12px}.row{padding:13px;border-radius:14px;background:#0a1428;border:1px solid #ffffff12}.muted,.row small{color:#9fb2ce}.tag{padding:4px 7px;border-radius:999px;background:#172743;font-size:11px}.off{opacity:.55}@media(max-width:600px){.form>*{width:100%}.row{align-items:flex-start}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ</div><div class="ver">GB-10 · v3.26.0</div></header><section class="panel"><small>NETWORK AUTHORITY</small><h1>국가·지역 관리자 지정</h1><p class="muted">HQ만 관리자 권한을 부여·중지할 수 있습니다. 국가관리자는 한 국가 전체, 지역관리자는 지정 국가의 한 지역만 관제합니다.</p><div class="form"><a class="btn secondary" href="hq-growth-network.html">← 세계 성장기지 관제</a><a class="btn secondary" href="network-command.html">국가·지역 관제 화면</a></div></section><section id="loginBox" class="login"><b>본부 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>관리자 지정</h2><div class="form"><input id="targetEmail" type="email" placeholder="등록된 로그인 이메일"><select id="role"><option value="country_admin">국가관리자</option><option value="region_admin">지역관리자</option></select><input id="country" maxlength="2" placeholder="국가코드 예: KR"><input id="region" placeholder="지역 예: 울산"><button id="assign" class="btn">권한 지정</button></div><p class="muted">지역관리자는 지역 입력이 필수입니다. 국가관리자를 선택하면 지역값은 사용하지 않습니다.</p><p id="assignMsg" class="muted"></p></section><section class="panel"><div class="head"><h2>현재 권한목록</h2><button id="refresh" class="btn secondary">새로고침</button></div><div id="list" class="list"><p class="muted">로그인 후 표시됩니다.</p></div></section></main><script src="assets/js/config.js?v=3260"></script><script src="assets/js/spark-data.js?v=3260"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];function draw(){ $('list').innerHTML=rows.length?rows.map(x=>`<article class="row ${x.active?'':'off'}"><div><b>${esc(x.email)}</b><small>${x.role==='country_admin'?'국가관리자':'지역관리자'} · ${esc(x.country_code)}${x.region_name?' / '+esc(x.region_name):''}</small></div><div><span class="tag">${x.active?'활성':'중지'}</span> <button class="btn secondary toggle" data-id="${x.id}" data-active="${x.active?'0':'1'}">${x.active?'중지':'재활성'}</button></div></article>`).join(''):'<p class="muted">지정된 국가·지역 관리자가 없습니다.</p>'}async function load(){try{rows=await SparkData.rpc('spark_hq_network_admins',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='HQ 관리자 권한을 확인해 주세요.'}}$('role').onchange=()=>{$('region').disabled=$('role').value==='country_admin'};$('role').onchange();$('assign').onclick=async()=>{const email=$('targetEmail').value.trim(),role=$('role').value,country=$('country').value.trim().toUpperCase(),region=$('region').value.trim();if(!email||country.length!==2){$('assignMsg').textContent='이메일과 2자리 국가코드를 확인해 주세요.';return}if(role==='region_admin'&&!region){$('assignMsg').textContent='지역관리자는 지역명이 필요합니다.';return}if(!confirm(`${email} 계정에 ${role==='country_admin'?country+' 국가관리자':country+' / '+region+' 지역관리자'} 권한을 지정할까요?`))return;try{await SparkData.rpc('spark_hq_assign_network_admin',{p_email:email,p_role:role,p_country_code:country,p_region_name:region||null});$('assignMsg').textContent='✅ 관리자 권한 지정 완료';await load()}catch(e){console.error(e);$('assignMsg').textContent=String(e.message||e).includes('USER_NOT_FOUND')?'해당 이메일의 GLOBAL SPARK 로그인 계정을 찾지 못했습니다.':'권한 지정에 실패했습니다.'}};$('list').onclick=async e=>{const b=e.target.closest('.toggle');if(!b)return;const active=b.dataset.active==='1';if(!confirm(active?'이 관리자 권한을 다시 활성화할까요?':'이 관리자 권한을 중지할까요?'))return;try{await SparkData.rpc('spark_hq_set_network_admin_status',{p_id:b.dataset.id,p_active:active});await load()}catch(err){console.error(err);$('assignMsg').textContent='상태 변경에 실패했습니다.'}};$('refresh').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 HQ 권한을 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
