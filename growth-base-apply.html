<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 공식 성장기지 신청 · GB-21 v3.37.0</title><link rel="stylesheet" href="assets/css/style.css?v=3370"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{margin-top:14px;padding:18px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step,.field{padding:12px;border-radius:14px;background:#0a1428}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:13px;color:#b7c6db}.form input,.form select,.form textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff}.full{grid-column:1/-1}.form textarea{min-height:110px}.btn,button{padding:11px 14px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.result{margin-top:12px;padding:14px;border-radius:14px;background:#0a1428}@media(max-width:700px){.flow{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><span class="ver">GB-21 · v3.37.0</span></header><section class="panel"><small>OFFICIAL GROWTH BASE APPLICATION</small><h1>공식 성장기지 신청</h1><p class="muted">태권도장·학원·교회·학교·지역센터 등은 GLOBAL SPARK 본부 심사를 거쳐 공식 성장기지로 지정될 수 있습니다.</p><div class="flow"><div class="step"><b>1. 신청</b><small>온라인 공식접수</small></div><div class="step"><b>2. HQ 검토</b><small>접수·심사</small></div><div class="step"><b>3. 공식 지정</b><small>GS 국가번호 발급</small></div><div class="step"><b>4. 인증서</b><small>공식 인증서 발급</small></div><div class="step"><b>5. 공개검증</b><small>세계 네트워크 등재</small></div></div></section><section class="panel"><form id="form" class="form"><label>신청자 성명<input name="applicant_name" required></label><label>성장기지명<input name="organization_name" required placeholder="기관·도장·학원명"></label><label>국가코드<select name="country_code"><option value="KR">대한민국 KR</option><option value="US">미국 US</option><option value="JP">일본 JP</option><option value="PH">필리핀 PH</option><option value="VN">베트남 VN</option><option value="OTHER">기타</option></select></label><label>지역<input name="region_name" placeholder="예: 울산 / Manila"></label><label>전화번호<input name="contact_phone"></label><label>이메일<input name="contact_email" type="email"></label><label class="full">운영계획·신청내용<textarea name="message" placeholder="참여 목적, 예상 참여인원, 운영계획 등을 적어 주세요."></textarea></label><div class="full"><small>전화번호 또는 이메일 중 하나 이상이 필요합니다. 승인 전에는 공식 성장기지로 표시되지 않습니다.</small><br><br><button id="submit" type="submit">🔥 공식 성장기지 신청</button> <a class="btn secondary" href="growth-base-status.html">접수상태 조회</a><div id="result" class="result" hidden></div></div></form></section></main><script src="assets/js/config.js?v=3370"></script><script>(()=>{const f=document.getElementById('form'),out=document.getElementById('result'),btn=document.getElementById('submit');async function rpc(name,payload){const c=window.SPARK_CONFIG,r=await fetch(c.supabaseUrl+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(payload)}),t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j=t}if(!r.ok)throw new Error(typeof j==='string'?j:(j.message||'신청 실패'));return j}f.onsubmit=async e=>{e.preventDefault();const x=new FormData(f);if(!x.get('contact_phone')&&!x.get('contact_email')){out.hidden=false;out.textContent='전화번호 또는 이메일을 입력해 주세요.';return}btn.disabled=true;try{const r=await rpc('spark_submit_hq_application',{p_application_type:'center',p_applicant_name:x.get('applicant_name'),p_organization_name:x.get('organization_name'),p_country_code:x.get('country_code'),p_region_name:x.get('region_name')||null,p_contact_phone:x.get('contact_phone')||null,p_contact_email:x.get('contact_email')||null,p_message:x.get('message')||null});out.hidden=false;out.innerHTML='<b>공식 접수 완료</b><br>접수번호 <strong>'+r.request_code+'</strong><br><small>이 번호와 신청 때 사용한 연락처로 진행상태를 조회할 수 있습니다.</small>';f.reset()}catch(err){out.hidden=false;out.textContent='접수하지 못했습니다. 입력 내용을 확인해 주세요.'}finally{btn.disabled=false}}})();</script></body></html>
