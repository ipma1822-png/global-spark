<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 초기 30일 운영지원 · GB-25 v3.41.0</title><link rel="stylesheet" href="assets/css/style.css?v=3410"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:25px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.grid{display:grid;gap:10px}.bar{height:9px;border-radius:999px;background:#172743;overflow:hidden}.bar i{display:block;height:100%;background:#ff9f1c}.milestones{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.mile{padding:9px;border-radius:10px;background:#0a1428}.done{outline:1px solid #61d09566}.overdue{outline:1px solid #ff6b6b99}.status-risk{border-color:#ff6b6b99}.status-attention{border-color:#ffd16688}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.milestones{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.milestones{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b> · HQ</a><span class="ver">GB-25 · v3.41.0</span></header><section class="panel"><small>FIRST 30 DAYS SUPPORT PROGRAM</small><h1>신규 공식 성장기지 초기 30일 운영지원</h1><p class="muted">공식 지정 후 1일·3일·7일·14일·30일 마일스톤을 실제 운영데이터로 자동 판정합니다.</p><div class="tools"><div><a class="btn secondary" href="hq-onboarding-watch.html">🚨 온보딩 관제</a> <a class="btn secondary" href="hq-onboarding-support.html">🛠 지원업무</a> <a class="btn secondary" href="command-center.html">🌍 COMMAND CENTER</a></div><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>HQ 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📊 30일 안착 현황</h2><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🏫 성장기지별 진행상태</h2><div id="rows" class="grid"></div></section></main><script src="assets/js/config.js?v=3410"></script><script src="assets/js/spark-data.js?v=3410"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(d){const rows=d.centers||[],count=x=>rows.filter(r=>r.support_status===x).length;$('stats').innerHTML=[['공식 성장기지',rows.length],['정상진행',count('on_track')],['주의',count('attention')],['위험',count('risk')],['30일 완료',count('completed')]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('rows').innerHTML=rows.map(r=>`<article class="card status-${esc(r.support_status)}"><div class="head"><div><b>${esc(r.center_name)}</b><small>${esc(r.designation_code||r.center_code)} · 지정 후 ${Number(r.days_since_designation||0)}일</small></div><div><span class="tag">${esc(r.current_stage)}</span> <b>${Number(r.progress_percent||0)}%</b></div></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(r.progress_percent||0)))}%"></i></div><div class="milestones">${(r.milestones||[]).map(m=>`<div class="mile ${m.completed?'done':''} ${m.overdue?'overdue':''}"><b>D+${m.day}</b><small>${esc(m.title)}</small><div>${m.completed?'✅ 완료':m.overdue?'⚠️ 지연':'⏳ 예정'}</div></div>`).join('')}</div><p>${esc(r.recommendation||'')}</p><small>지연 ${Number(r.overdue_count||0)}건 · 상태 ${esc(r.support_status)}</small></article>`).join('')||'<p class="muted">현재 초기 30일 지원 대상인 공식 성장기지가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_hq_30day_support',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){console.error(e);$('msg').textContent='HQ 관리자 권한을 확인해 주세요.'}}$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
