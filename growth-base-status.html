<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장기지 신청상태 조회 · GB-21 v3.37.0</title><link rel="stylesheet" href="assets/css/style.css?v=3370"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.panel{margin-top:14px;padding:18px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.form{display:grid;gap:10px}.form input{padding:12px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff}.btn,button{padding:11px 14px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff}.result{margin-top:14px;padding:16px;border-radius:14px;background:#0a1428}.official{border:1px solid #77e49b77}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><span class="ver">GB-21 · v3.37.0</span></header><section class="panel"><small>APPLICATION STATUS</small><h1>공식 성장기지 신청상태 조회</h1><p class="muted">접수번호와 신청 때 입력한 이메일 또는 전화번호를 함께 입력해 주세요.</p><div class="form"><input id="code" placeholder="접수번호 예: GS-260905-XXXXXXXX"><input id="contact" placeholder="이메일 또는 전화번호"><button id="lookup">조회하기</button><a class="btn secondary" href="growth-base-apply.html">새 성장기지 신청</a></div><div id="result" class="result" hidden></div></section></main><script src="assets/js/config.js?v=3370"></script><script>(()=>{const out=document.getElementById('result'),labels={received:'접수완료',reviewing:'본부 검토중',approved:'공식 지정 승인',rejected:'승인되지 않음'};async function run(){const c=window.SPARK_CONFIG,code=document.getElementById('code').value.trim(),contact=document.getElementById('contact').value.trim();if(!code||!contact){out.hidden=false;out.textContent='접수번호와 연락처를 입력해 주세요.';return}const r=await fetch(c.supabaseUrl+'/rest/v1/rpc/spark_public_application_status',{method:'POST',headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({p_request_code:code,p_contact:contact})}),j=await r.json().catch(()=>({}));out.hidden=false;if(!r.ok||!j.found){out.textContent='일치하는 성장기지 신청을 찾지 못했습니다.';return}out.classList.toggle('official',!!j.official);out.innerHTML='<b>'+String(j.organization_name||'성장기지')+'</b><br><span class="tag">'+(labels[j.status]||j.status)+'</span><p>접수번호 '+j.request_code+'</p>'+(j.designation_code?'<p><b>공식 성장기지 번호 '+j.designation_code+'</b><br>인증서 '+(j.certificate_no||'발급 확인 중')+'</p><a class="btn" href="growth-base.html?code='+encodeURIComponent(j.designation_code)+'">공식 조회 열기</a>':'<small>승인 완료 전에는 공식번호·인증서·세계 네트워크에 표시되지 않습니다.</small>')}document.getElementById('lookup').onclick=()=>run().catch(()=>{out.hidden=false;out.textContent='조회 중 오류가 발생했습니다.'})})();</script></body></html>
