<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장기지 신청상태</title><link rel="stylesheet" href="assets/css/style.css?v=3580"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px 16px 90px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head a{color:#fff;text-decoration:none}.hero{padding:32px 0 12px}.ey{color:#ffd16a;font-size:12px;font-weight:950;letter-spacing:.14em}.hero h1{font-size:clamp(34px,8vw,54px);line-height:1.06;margin:10px 0}.muted,small{color:#aebfd4;line-height:1.7}.panel{margin-top:14px;padding:20px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.form{display:grid;gap:10px}.form label{font-size:13px;color:#c7d4e3;font-weight:800}.form input{width:100%;box-sizing:border-box;margin-top:6px;padding:13px;border-radius:12px;border:1px solid #ffffff1f;background:#091326;color:#fff;font:inherit}.btn,button{display:inline-block;padding:13px 15px;border:0;border-radius:12px;background:linear-gradient(90deg,#ffb347,#ff7a45);color:#071126;font-weight:950;text-decoration:none;cursor:pointer}.secondary{background:#172743;color:#fff;border:1px solid #ffffff20}.result{margin-top:14px;padding:18px;border-radius:16px;background:#07182c;border:1px solid #ffffff16;line-height:1.7}.official{border-color:#78e5a166}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#172743;color:#d4e0ee;font-size:12px}.statusline{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.statusline div{padding:10px;border-radius:12px;background:#091326;color:#8298b2;font-size:12px;text-align:center}.statusline .on{background:#20395b;color:#fff;border:1px solid #ffd16a66}.recent{display:none;margin-top:10px;padding:13px;border-radius:14px;background:#091326}.version{display:none}@media(max-width:620px){.panel{padding:16px}.statusline{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html">🔥 <b>GLOBAL SPARK</b></a><a class="btn secondary" href="growth-base-apply.html">새 신청</a></header><section class="hero"><div class="ey">APPLICATION STATUS · GS-06</div><h1>성장기지 신청상태<br>확인하기</h1><p class="muted">접수번호와 신청 때 사용한 이메일 또는 전화번호를 입력하면 현재 진행상태를 확인할 수 있습니다.</p></section><section class="panel"><div class="recent" id="recent"></div><div class="form"><label>접수번호<input id="code" autocomplete="off" placeholder="예: GS-260905-XXXXXXXX"></label><label>이메일 또는 전화번호<input id="contact" autocomplete="email" placeholder="신청 때 입력한 연락처"></label><button id="lookup">조회하기</button></div><div id="result" class="result" hidden></div></section><div class="version">GS-06 · v3.58.0</div></main><script src="assets/js/config.js?v=3580"></script><script>(()=>{const out=document.getElementById('result'),codeEl=document.getElementById('code'),contactEl=document.getElementById('contact'),recent=document.getElementById('recent'),KEY='globalSparkGrowthBaseApplication.gs06',labels={received:'접수완료',reviewing:'본부 검토중',approved:'공식 지정 승인',rejected:'승인되지 않음'};function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function loadRecent(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(!r?.request_code)return;recent.style.display='block';recent.innerHTML='<b>이 기기에 저장된 최근 신청</b><br><small>'+esc(r.organization_name||'성장기지')+' · '+esc(r.request_code)+'</small><br><br><button class="secondary" id="useRecent">최근 신청 불러오기</button>';document.getElementById('useRecent').onclick=()=>{codeEl.value=r.request_code||'';contactEl.value=r.contact||'';run()}}catch(_){}}function qs(){const p=new URLSearchParams(location.search);const code=p.get('code'),contact=p.get('contact');if(code)codeEl.value=code;if(contact)contactEl.value=contact;if(code&&contact)setTimeout(()=>run(),100)}async function run(){const c=window.SPARK_CONFIG,code=codeEl.value.trim(),contact=contactEl.value.trim();if(!code||!contact){out.hidden=false;out.className='result';out.textContent='접수번호와 신청 때 사용한 연락처를 모두 입력해 주세요.';return}document.getElementById('lookup').disabled=true;try{const r=await fetch(c.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/spark_public_application_status',{method:'POST',headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({p_request_code:code,p_contact:contact})}),j=await r.json().catch(()=>({}));out.hidden=false;if(!r.ok||!j.found){out.className='result';out.textContent='일치하는 신청을 찾지 못했습니다. 접수번호와 연락처가 신청 당시 정보와 같은지 확인해 주세요.';return}const s=j.status||'received',step=s==='approved'?4:s==='reviewing'?2:s==='rejected'?2:1;out.className='result'+(j.official?' official':'');out.innerHTML='<b>'+esc(j.organization_name||'성장기지')+'</b><br><span class="tag">'+esc(labels[s]||s)+'</span><div class="statusline"><div class="'+(step>=1?'on':'')+'">1. 접수</div><div class="'+(step>=2?'on':'')+'">2. HQ 검토</div><div class="'+(step>=3?'on':'')+'">3. 공식 지정</div><div class="'+(step>=4?'on':'')+'">4. 운영 시작</div></div><p>접수번호 <b>'+esc(j.request_code)+'</b></p>'+(j.designation_code?'<p><b>공식 성장기지 번호 '+esc(j.designation_code)+'</b><br>인증서 '+esc(j.certificate_no||'발급 확인 중')+'</p><a class="btn" href="growth-base.html?code='+encodeURIComponent(j.designation_code)+'">공식 성장기지 조회 열기</a>':(s==='rejected'?'<p class="muted">이번 신청은 승인되지 않았습니다. 필요하면 내용을 보완해 새로 신청해 주세요.</p>':'<p class="muted">아직 공식 지정 전입니다. 승인 전에는 공식번호·인증서·WORLD NETWORK에 표시되지 않습니다.</p>'))}catch(_){out.hidden=false;out.className='result';out.textContent='조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'}finally{document.getElementById('lookup').disabled=false}}document.getElementById('lookup').onclick=run;[codeEl,contactEl].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')run()}));loadRecent();qs()})();</script></body></html>
