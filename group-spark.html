<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 그룹 SPARK</title><link rel="stylesheet" href="assets/css/style.css?v=3630"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:820px;margin:auto;padding:14px}.panel{margin-top:12px;padding:16px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.muted,small{color:#9fb2ce}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:11px 13px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input,.tools input,.memo{padding:12px;border-radius:11px;border:1px solid #ffffff1c;background:#091326;color:#fff}.tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}.members{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.member{position:relative;padding:14px 10px;border-radius:14px;background:#091326;border:1px solid #ffffff15;cursor:pointer;min-height:56px}.member.on{border-color:#ffb347;background:#ff9f1c12;box-shadow:0 0 0 1px #ffb347 inset}.member input{position:absolute;right:9px;top:9px;width:20px;height:20px;accent-color:#ff9f1c}.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.rule{background:#172743;color:#fff;text-align:left}.rule.on{background:#ff9f1c;color:#071126}.memo{width:100%;box-sizing:border-box;min-height:82px}.fire{width:100%;font-size:18px;padding:16px;margin-top:12px}.status{margin-top:10px;padding:12px;border-radius:12px;background:#091326;line-height:1.6}.count{font-size:26px;color:#ffd27a;font-weight:950}.version{display:none}@media(max-width:620px){.members{grid-template-columns:repeat(2,1fr)}.login,.tools{grid-template-columns:1fr}.rules{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><a id="back" class="btn secondary" href="my-centers.html">성장기지 HOME</a></div><section class="panel"><small>GS-11 · GROUP SPARK</small><h1>여러 아이에게 한 번에 SPARK</h1><p class="muted">수업·행사·공동활동에서 같은 좋은 행동을 한 아이들을 선택하고 한 번에 기록합니다. 한 번에 최대 100명까지 가능합니다.</p></section><section class="panel" id="loginBox"><b>지도자 로그인</b><div class="login"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="loginMsg" class="muted"></p></section><section class="panel" id="main" hidden><div class="row"><div><small>선택된 아이</small><div id="count" class="count">0명</div></div><button id="refresh" class="secondary">새로고침</button></div><h2>1. 아이 선택</h2><div class="tools"><input id="search" type="search" placeholder="아이 이름 검색"><button id="all" class="secondary">☑ 보이는 아이 전체</button><button id="clear" class="secondary">선택 해제</button></div><div id="members" class="members"></div><h2>2. 좋은 행동 선택</h2><div id="rules" class="rules"></div><h2>3. 메모 <small>(선택)</small></h2><textarea id="memo" class="memo" maxlength="200" placeholder="예: 수업 후 모두 함께 정리정돈을 잘했어요."></textarea><button id="fire" class="fire">🔥 선택한 아이들에게 그룹 SPARK</button><div id="status" class="status">아이와 좋은 행동을 선택해 주세요.</div></section><div class="version">GS-11 · v3.63.0</div></main><script src="assets/js/config.js?v=3630"></script><script src="assets/js/spark-data.js?v=3630"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let code=new URLSearchParams(location.search).get('center')||'',rows=[],rules=[],picked=new Set(),activity='';async function resolve(){if(code)return;const c=await SparkData.getMyCenters();if(!c.length)throw new Error('NO_CENTER');code=c[0].center_code;history.replaceState(null,'','?center='+encodeURIComponent(code))}function visible(){const q=$('search').value.trim().toLowerCase();return rows.filter(x=>x.active&&(!q||x.display_name.toLowerCase().includes(q)||x.member_code.toLowerCase().includes(q)))}function drawMembers(){$('members').innerHTML=visible().map(x=>`<label class="member ${picked.has(String(x.id))?'on':''}" data-id="${x.id}"><b>${esc(x.display_name)}</b><br><small>${esc(x.member_code)}</small><input type="checkbox" ${picked.has(String(x.id))?'checked':''}></label>`).join('')||'<p class="muted">표시할 회원이 없습니다.</p>';$('count').textContent=picked.size+'명'}function drawRules(){$('rules').innerHTML=rules.map(r=>`<button class="rule ${activity===r.activity_type?'on':''}" data-type="${esc(r.activity_type)}"><b>${esc(r.label_ko)}</b><br><small>1인 +${Number(r.xp||0)} XP</small></button>`).join('')}async function load(){try{await resolve();[rows,rules]=await Promise.all([SparkData.centerGetMembers(code),SparkData.centerGetRules()]);$('loginBox').hidden=true;$('main').hidden=false;$('back').href='center-mobile-home.html?center='+encodeURIComponent(code);drawMembers();drawRules();$('status').textContent=`활성회원 ${rows.filter(x=>x.active).length}명 · 최대 100명 선택 가능`}catch(e){$('loginMsg').textContent=e.message==='NO_CENTER'?'연결된 성장기지가 없습니다.':'로그인 또는 성장기지 권한을 확인해 주세요.'}}$('members').onchange=e=>{const box=e.target.closest('.member');if(!box)return;const id=box.dataset.id;e.target.checked?picked.add(id):picked.delete(id);if(picked.size>100){picked.delete(id);e.target.checked=false;alert('한 번에 최대 100명까지 선택할 수 있습니다.')}drawMembers()};$('rules').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;activity=b.dataset.type;drawRules()};$('search').oninput=drawMembers;$('all').onclick=()=>{visible().slice(0,100).forEach(x=>picked.add(String(x.id)));drawMembers()};$('clear').onclick=()=>{picked.clear();drawMembers()};$('refresh').onclick=load;$('fire').onclick=async()=>{const ids=[...picked];if(!ids.length)return $('status').textContent='먼저 아이를 선택해 주세요.';if(!activity)return $('status').textContent='좋은 행동을 하나 선택해 주세요.';const r=rules.find(x=>x.activity_type===activity),preview=ids.slice(0,8).map(id=>rows.find(x=>String(x.id)===id)?.display_name).filter(Boolean).join(', ')+(ids.length>8?` 외 ${ids.length-8}명`:'');if(!confirm(`${ids.length}명에게 “${r?.label_ko||activity}”를 그룹 SPARK로 기록할까요?\n\n${preview}`))return;$('fire').disabled=true;try{const out=await SparkData.rpc('spark_center_bulk_register_activity',{p_center_code:code,p_member_ids:ids,p_activity_type:activity,p_memo:$('memo').value.trim()}),j=Array.isArray(out)?out[0]:out;$('status').innerHTML=`<b>✅ 그룹 SPARK 완료</b><br>${Number(j.member_count||ids.length)}명 · 1인 +${Number(j.xp_each||0)} XP · 총 ${Number(j.total_awarded||0)} XP`;picked.clear();$('memo').value='';drawMembers()}catch(e){const m=String(e?.message||e);$('status').textContent=m.includes('TOO_MANY_MEMBERS')?'한 번에 최대 100명까지 가능합니다.':m.includes('BATCH_MEMBER_INVALID')?'선택한 회원 중 사용할 수 없는 회원이 있습니다. 새로고침 후 다시 선택해 주세요.':'그룹 SPARK 등록에 실패했습니다.'}finally{$('fire').disabled=false}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await load()}catch(_){$('loginMsg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
