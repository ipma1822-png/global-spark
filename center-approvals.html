<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 빠른 승인</title><link rel="stylesheet" href="assets/css/style.css?v=3620"><style>:root{--bg:#071126;--panel:#0e1930;--card:#091326;--line:#ffffff18;--gold:#ff9f1c;--muted:#9fb2ce;--green:#55d87b}*{box-sizing:border-box}body{background:var(--bg);color:#fff;margin:0;padding-bottom:86px}.wrap{max-width:760px;margin:auto;padding:12px}.head,.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.brand{color:#fff;text-decoration:none}.panel,.login{margin-top:11px;padding:15px;border:1px solid var(--line);border-radius:19px;background:var(--panel)}.muted,small{color:var(--muted)}.hero h1{margin:7px 0;font-size:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border-radius:14px;background:var(--card);text-align:center}.stat b{display:block;font-size:25px}.toolbar{position:sticky;top:0;z-index:10;margin-top:10px;padding:10px;border-radius:16px;background:#071126ee;backdrop-filter:blur(12px);border:1px solid #ffffff14}.toolbar .row{justify-content:flex-start}.btn,button{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.approve{background:var(--gold);color:#071126}.approveAll{background:var(--green);color:#071126}.reject,.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.filter{display:flex;gap:6px;margin-top:8px}.filter button{flex:1}.filter .on{background:#ffd166;color:#071126}.picked{font-weight:900;color:#ffd27a}.list{display:grid;gap:9px;margin-top:10px}.card{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.card.selected{border-color:#ffb34788;background:#ff9f1c0b}.top{display:flex;justify-content:space-between;gap:10px}.who{display:flex;gap:9px}.pick{width:21px;height:21px;accent-color:var(--gold)}.memo{margin:10px 0;padding:10px;border-radius:12px;background:#ffffff08;line-height:1.5}.actions{display:grid;grid-template-columns:1fr auto;gap:7px}.oneApprove{font-size:16px;min-height:48px}.rejectTiny{padding:9px 11px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #ffffff22;border-radius:14px}.login input{width:100%;margin-top:8px;padding:12px;border-radius:11px;background:#091326;color:#fff;border:1px solid #ffffff20}.login button{width:100%;margin-top:8px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:8px;background:#071126ee;border-top:1px solid #ffffff17}.bottom a{text-align:center;color:#fff;text-decoration:none;padding:8px;border-radius:10px;font-size:12px}.bottom b{display:block;font-size:19px}.version{display:none}@media(max-width:560px){.wrap{padding:8px}.panel{padding:12px}.hero h1{font-size:25px}.top{display:block}.stats{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:1fr auto}}</style></head><body><main class="wrap"><header class="head"><a class="brand" href="index.html">🔥 <b>GLOBAL SPARK</b></a><a id="home" class="btn secondary" href="my-centers.html">성장기지 HOME</a></header><section class="panel hero"><small>GS-10 · FAST APPROVAL</small><h1>관장님은 확인만 하세요.</h1><p class="muted">아이와 부모가 직접 기록한 행동을 빠르게 확인합니다. 정상 기록은 한 번 터치 또는 여러 건 일괄승인하고, 이상한 기록만 거절하면 됩니다.</p><div class="stats"><div class="stat"><small>전체 대기</small><b id="pendingCount">0</b></div><div class="stat"><small>아이 기록</small><b id="kidCount">0</b></div><div class="stat"><small>부모 기록</small><b id="parentCount">0</b></div></div></section><section id="loginBox" class="login"><b>성장기지 지도자 로그인</b><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button><p id="loginMsg" class="muted"></p></section><section id="work" hidden><div class="toolbar"><div class="row"><button class="approveAll" id="approveVisible">✅ 보이는 기록 모두 승인</button><button class="secondary" id="selectVisible">☑ 선택</button><button class="secondary" id="clearSelection">해제</button><span class="picked" id="selectedCount">0건 선택</span></div><div class="filter"><button class="secondary on" data-filter="all">전체</button><button class="secondary" data-filter="kid">아이</button><button class="secondary" data-filter="parent">부모</button></div><div class="row" style="margin-top:8px"><button class="approve" id="bulkApprove">선택 승인</button><button class="reject" id="bulkReject">선택 거절</button><button class="secondary" id="refresh">새로고침</button></div><div id="status" class="muted" style="margin-top:7px"></div></div><div id="list" class="list"><div class="empty">불러오는 중…</div></div></section><div class="version">GS-10 · v3.62.0</div></main><nav class="bottom"><a id="navHome" href="my-centers.html"><b>🏠</b>HOME</a><a id="navSpark" href="#"><b>🔥</b>SPARK</a><a href="#"><b>✅</b>승인</a></nav><script src="assets/js/config.js?v=3620"></script><script src="assets/js/spark-data.js?v=3620"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),center=new URLSearchParams(location.search).get('center')||'',selected=new Set();let rows=[],filter='all';const fmt=v=>{try{return new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return''}};function visible(){return rows.filter(r=>filter==='all'||r.submitted_by_type===filter)}function sync(){[...selected].forEach(id=>{if(!rows.some(r=>String(r.id)===id))selected.delete(id)});$('selectedCount').textContent=`${selected.size}건 선택`;document.querySelectorAll('.card[data-id]').forEach(c=>{const on=selected.has(c.dataset.id);c.classList.toggle('selected',on);const cb=c.querySelector('.pick');if(cb)cb.checked=on})}function draw(){$('pendingCount').textContent=rows.length;$('kidCount').textContent=rows.filter(x=>x.submitted_by_type==='kid').length;$('parentCount').textContent=rows.filter(x=>x.submitted_by_type==='parent').length;const v=visible();$('list').innerHTML=v.length?v.map(r=>`<article class="card" data-id="${r.id}"><div class="top"><div class="who"><input class="pick" type="checkbox" aria-label="선택"><div><b>${esc(r.display_name)}</b><div class="muted">${r.submitted_by_type==='parent'?'👨‍👩‍👧 부모 기록':'🧒 아이 기록'} · ${fmt(r.submitted_at)}</div></div></div><div><b>${esc(r.label_ko)}</b><div class="muted">+${Number(r.xp||0)} XP</div></div></div><div class="memo">${esc(r.memo||'설명 없이 기록됨')}</div><div class="actions"><button class="approve oneApprove" data-action="approved">✅ 승인</button><button class="reject rejectTiny" data-action="rejected">거절</button></div></article>`).join(''):'<div class="empty">🎉 현재 확인할 기록이 없습니다.</div>';sync()}async function load(){if(!center){$('loginMsg').textContent='성장기지 코드가 없습니다.';return}try{rows=await SparkData.rpc('spark_center_pending_submissions',{p_center_code:center,p_limit:200})||[];$('loginBox').hidden=true;$('work').hidden=false;draw();$('status').textContent=rows.length?`${rows.length}건 확인 대기 중`:'대기 기록이 없습니다.'}catch(e){$('loginBox').hidden=false;$('work').hidden=true;$('loginMsg').textContent='로그인 또는 해당 성장기지 권한을 확인해 주세요.'}}async function bulk(action,ids){ids=ids||[...selected];if(!ids.length){$('status').textContent='처리할 기록을 선택해 주세요.';return}if(ids.length>100){$('status').textContent='한 번에 최대 100건까지 처리할 수 있습니다.';return}const word=action==='approved'?'승인':'거절';if(action==='rejected'&&!confirm(`${ids.length}건을 거절할까요?`))return;if(action==='approved'&&ids.length>1&&!confirm(`${ids.length}건을 한 번에 승인할까요?\n승인 즉시 실제 SPARK와 XP로 확정됩니다.`))return;try{await SparkData.rpc('spark_center_bulk_review_submissions',{p_center_code:center,p_submission_ids:ids,p_action:action,p_review_note:''});selected.clear();$('status').textContent=`${ids.length}건 ${word} 완료`;await load()}catch(e){$('status').textContent='처리에 실패했습니다. 새로고침 후 다시 확인해 주세요.'}}$('approveVisible').onclick=()=>bulk('approved',visible().slice(0,100).map(r=>r.id));$('selectVisible').onclick=()=>{visible().slice(0,100).forEach(r=>selected.add(String(r.id)));sync()};$('clearSelection').onclick=()=>{selected.clear();sync()};$('bulkApprove').onclick=()=>bulk('approved');$('bulkReject').onclick=()=>bulk('rejected');$('refresh').onclick=load;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));draw()});$('list').addEventListener('change',e=>{const cb=e.target.closest('.pick');if(!cb)return;const id=cb.closest('.card').dataset.id;cb.checked?selected.add(id):selected.delete(id);sync()});$('list').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const card=b.closest('.card'),action=b.dataset.action;if(action==='rejected'&&!confirm('이 기록을 거절할까요?'))return;card.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await SparkData.rpc('spark_center_review_submission',{p_submission_id:card.dataset.id,p_action:action,p_review_note:''});$('status').textContent=action==='approved'?`🔥 승인 완료 · +${Number(r?.xp||0)} XP`:'거절 완료';selected.delete(card.dataset.id);await load()}catch(_){$('status').textContent='처리에 실패했습니다.';card.querySelectorAll('button').forEach(x=>x.disabled=false)}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(_){$('loginMsg').textContent='로그인 정보를 확인해 주세요.'}};if(center){$('home').href='center-mobile-home.html?center='+encodeURIComponent(center);$('navHome').href='center-mobile-home.html?center='+encodeURIComponent(center);$('navSpark').href='center.html?center='+encodeURIComponent(center)}if(SparkData.isSignedIn())load()})();</script></body></html>
