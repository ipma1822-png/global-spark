<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPARK CENTER · 승인센터 · GB-04 v3.20.0</title><link rel="stylesheet" href="assets/css/style.css?v=3200"><style>body{background:#071126;color:#fff;margin:0}.wrap{max-width:1080px;margin:auto;padding:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.ver{padding:7px 10px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a;font-size:12px}.panel{margin-top:14px;padding:16px;border:1px solid #ffffff18;border-radius:20px;background:#101a30}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px;border-radius:14px;background:#0b1528}.stat small,.stat b{display:block}.stat b{font-size:25px}.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:12px;border:1px solid #ffb34733;border-radius:14px;background:#ff9f1c0b}.bulkbar select,.bulkbar input{padding:9px 10px;border-radius:10px;border:1px solid #ffffff20;background:#081225;color:#fff}.bulkbar input{flex:1;min-width:180px}.picked{color:#ffd27a;font-weight:900}.list{display:grid;gap:10px;margin-top:12px}.card{padding:14px;border:1px solid #ffffff18;border-radius:16px;background:#0c1629}.card.selected{border-color:#ffb34788;background:#ff9f1c0b}.top{display:flex;justify-content:space-between;gap:10px}.selectline{display:flex;gap:9px;align-items:flex-start}.selectline input{width:19px;height:19px;accent-color:#ff9f1c}.meta{color:#9fb2cb;font-size:12px}.memo{padding:10px;margin:10px 0;border-radius:12px;background:#ffffff08}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions input{flex:1;min-width:180px;padding:10px;border-radius:11px;border:1px solid #ffffff20;background:#081225;color:#fff}.approve,.reject,.secondary{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.approve{background:#ff9f1c;color:#081225}.reject{background:#27344c;color:#fff}.secondary{background:#17243b;color:#fff}.empty{color:#9fb2cb;padding:20px;text-align:center}@media(max-width:620px){.stats{grid-template-columns:1fr}.top{display:block}.bulkbar>*{width:100%}}</style></head><body><main class="wrap"><header class="head"><div><small>🔥 GLOBAL SPARK · OFFICIAL GROWTH BASE</small><h1>성장기지 승인센터</h1></div><div class="ver">GB-04 · v3.20.0</div></header><section class="panel"><p>아이와 부모가 보낸 성장행동을 확인합니다. <b>승인된 기록만 실제 SPARK와 XP로 확정됩니다.</b> 여러 건은 선택 후 한 번에 처리할 수 있습니다.</p><div class="stats"><div class="stat"><small>승인대기</small><b id="pendingCount">0</b></div><div class="stat"><small>아이 기록</small><b id="kidCount">0</b></div><div class="stat"><small>부모 기록</small><b id="parentCount">0</b></div></div></section><section class="panel"><div class="head"><div><small>APPROVAL QUEUE</small><h2>확인 대기 기록</h2></div><button class="secondary" id="refresh">새로고침</button></div><div class="bulkbar"><select id="actorFilter"><option value="all">아이+부모 전체</option><option value="kid">아이 기록만</option><option value="parent">부모 기록만</option></select><button class="secondary" id="selectVisible">☑ 보이는 기록 전체 선택</button><button class="secondary" id="clearSelection">선택 해제</button><span class="picked" id="selectedCount">0건 선택</span><input id="bulkNote" placeholder="일괄 확인 메모(선택)"><button class="approve" id="bulkApprove">🔥 선택 일괄 승인</button><button class="reject" id="bulkReject">선택 일괄 거절</button></div><div id="status" class="meta"></div><div id="list" class="list"><div class="empty">불러오는 중…</div></div></section><p><a class="secondary" id="back" href="my-centers.html">← 성장기지로 돌아가기</a></p></main><script src="assets/js/config.js?v=3200"></script><script src="assets/js/spark-data.js?v=3200"></script><script>(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),center=new URLSearchParams(location.search).get('center')||'',fmt=v=>new Date(v).toLocaleString('ko-KR'),selected=new Set();if(center)$('back').href='center.html?center='+encodeURIComponent(center);let rows=[];function visibleRows(){const f=$('actorFilter').value;return rows.filter(r=>f==='all'||r.submitted_by_type===f)}function syncSelection(){const visible=new Set(visibleRows().map(r=>String(r.id)));[...selected].forEach(id=>{if(!rows.some(r=>String(r.id)===id))selected.delete(id)});$('selectedCount').textContent=`${selected.size}건 선택`;document.querySelectorAll('.card[data-id]').forEach(card=>{const on=selected.has(card.dataset.id);card.classList.toggle('selected',on);const cb=card.querySelector('.pick');if(cb)cb.checked=on});$('selectVisible').textContent=visible.size?'☑ 보이는 기록 전체 선택':'선택할 기록 없음'}function draw(){$('pendingCount').textContent=rows.length;$('kidCount').textContent=rows.filter(x=>x.submitted_by_type==='kid').length;$('parentCount').textContent=rows.filter(x=>x.submitted_by_type==='parent').length;const view=visibleRows();$('list').innerHTML=view.length?view.map(r=>`<article class="card" data-id="${r.id}"><div class="top"><div class="selectline"><input class="pick" type="checkbox" aria-label="선택"><div><b>${esc(r.display_name)}</b><div class="meta">${r.submitted_by_type==='parent'?'👨‍👩‍👧 부모 기록':'🧒 아이 직접기록'} · ${fmt(r.submitted_at)}</div></div></div><div><b>${esc(r.label_ko)}</b><div class="meta">예정 +${Number(r.xp||0)} XP · ${esc(r.flame_code||'')}</div></div></div><div class="memo">${esc(r.memo||'메모 없음')}</div><div class="actions"><input class="note" placeholder="확인 메모(선택)"><button class="approve" data-action="approved">승인</button><button class="reject" data-action="rejected">거절</button></div></article>`).join(''):'<div class="empty">현재 조건에 맞는 승인대기 기록이 없습니다. 🎉</div>';syncSelection()}async function load(){if(!center){$('status').textContent='성장기지 코드가 없습니다.';return}try{rows=await SparkData.rpc('spark_center_pending_submissions',{p_center_code:center,p_limit:200})||[];draw();$('status').textContent=`${rows.length}건 확인대기`}catch(e){console.error(e);$('status').textContent='성장기지 로그인 또는 권한을 확인해 주세요.';$('list').innerHTML='<div class="empty">승인목록을 불러오지 못했습니다.</div>'}}async function bulk(action){const ids=[...selected];if(!ids.length){$('status').textContent='먼저 처리할 기록을 선택해 주세요.';return}if(ids.length>100){$('status').textContent='한 번에 최대 100건까지 처리할 수 있습니다.';return}const word=action==='approved'?'승인':'거절';if(!confirm(`${ids.length}건을 한 번에 ${word}할까요?${action==='approved'?'\n승인 즉시 실제 SPARK와 XP로 확정됩니다.':''}`))return;[$('bulkApprove'),$('bulkReject')].forEach(b=>b.disabled=true);try{const r=await SparkData.rpc('spark_center_bulk_review_submissions',{p_center_code:center,p_submission_ids:ids,p_action:action,p_review_note:$('bulkNote').value.trim()}),row=Array.isArray(r)?r[0]:r;$('status').textContent=`${Number(row?.processed||ids.length)}건 일괄 ${word} 완료`;selected.clear();$('bulkNote').value='';await load()}catch(e){console.error(e);const m=String(e?.message||e);$('status').textContent=m.includes('TOO_MANY_SUBMISSIONS')?'한 번에 최대 100건까지 처리할 수 있습니다.':m.includes('BATCH_SUBMISSION_INVALID')?'선택한 기록 중 이미 처리되었거나 다른 성장기지 기록이 있습니다. 새로고침 후 다시 선택해 주세요.':'일괄 처리에 실패했습니다.'}finally{[$('bulkApprove'),$('bulkReject')].forEach(b=>b.disabled=false)}}$('refresh').onclick=load;$('actorFilter').onchange=draw;$('selectVisible').onclick=()=>{visibleRows().slice(0,100).forEach(r=>selected.add(String(r.id)));syncSelection()};$('clearSelection').onclick=()=>{selected.clear();syncSelection()};$('bulkApprove').onclick=()=>bulk('approved');$('bulkReject').onclick=()=>bulk('rejected');$('list').addEventListener('change',e=>{const cb=e.target.closest('.pick');if(!cb)return;const id=cb.closest('.card').dataset.id;cb.checked?selected.add(id):selected.delete(id);syncSelection()});$('list').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const card=b.closest('.card'),note=card.querySelector('.note').value.trim(),action=b.dataset.action;if(!confirm(action==='approved'?'이 성장행동을 공식 SPARK로 승인할까요?':'이 기록을 거절할까요?'))return;card.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await SparkData.rpc('spark_center_review_submission',{p_submission_id:card.dataset.id,p_action:action,p_review_note:note});$('status').textContent=action==='approved'?`🔥 승인 완료 · +${Number(r?.xp||0)} XP`:'거절 처리 완료';selected.delete(card.dataset.id);await load()}catch(err){console.error(err);$('status').textContent='처리에 실패했습니다.';card.querySelectorAll('button').forEach(x=>x.disabled=false)}};await load()})();</script></body></html>
