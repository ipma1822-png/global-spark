<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 우리 아이 SPARK</title><link rel="stylesheet" href="assets/css/style.css?v=3610"><style>body{background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.panel{margin:14px 0;padding:18px;border-radius:20px;background:#0e1930}.muted{color:#9fb2ce}.row{display:grid;gap:9px}.row input,.row select,.row textarea{padding:12px;border-radius:10px;background:#091326;color:#fff;border:1px solid #ffffff20}.row textarea{min-height:90px}.btn,button{padding:12px 14px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{background:#172743;color:#fff;text-align:left}.chip.on{background:#ff9f1c;color:#071126}.recent>div{padding:12px;margin-top:8px;border-radius:12px;background:#091326}.ok{padding:14px;border-radius:14px;background:#1d6b3b55;border:1px solid #55d87b66}@media(max-width:550px){.chips{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><section class="panel"><small>GS-09 · v3.61.0</small><h1>오늘 우리 아이의 좋은 행동을 기록해 주세요</h1><p class="muted">부모님이 발견한 작은 행동 하나가 아이의 성장기록이 됩니다. 성장기지에 연결된 아이의 기록은 지도자 확인 후 실제 SPARK·XP에 반영됩니다.</p></section><section class="panel" id="loginBox"><h2>부모 · 보호자 로그인</h2><div class="row"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel" id="form" hidden><h2>1. 아이 선택</h2><select id="child"></select><p id="center" class="muted"></p><h2>2. 어떤 행동이었나요?</h2><div id="rules" class="chips"></div><h2>3. 한마디 남겨주세요 <small>(선택)</small></h2><textarea id="memo" maxlength="200" placeholder="예: 먼저 동생의 장난감을 정리해 주었어요."></textarea><br><button id="submit">🔥 SPARK 기록 보내기</button><p id="result"></p></section><section class="panel" id="recentBox" hidden><h2>최근 기록</h2><div id="recent" class="recent"></div></section></main><script src="assets/js/config.js?v=3610"></script><script src="assets/js/spark-data.js?v=3610"></script><script>(()=>{const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let home=null,activity='';async function load(){try{home=await SparkData.rpc('spark_family_activity_home',{});$('loginBox').hidden=true;$('form').hidden=false;const linked=(home.children||[]).filter(x=>x.linked);$('child').innerHTML=linked.length?linked.map(x=>`<option value="${x.child_id}">${esc(x.display_name)}</option>`).join(''):'<option value="">성장기지에 연결된 아이가 없습니다</option>';$('rules').innerHTML=(home.rules||[]).map(r=>`<button class="chip" data-type="${esc(r.activity_type)}">${esc(r.label)} · +${r.xp} XP</button>`).join('');showCenter();await recent()}catch(e){$('msg').textContent='개인 프로필과 자녀 연결을 먼저 확인해 주세요.'}}function showCenter(){const c=(home.children||[]).find(x=>x.child_id===$('child').value);$('center').textContent=c?.center_name?'연결 성장기지 · '+c.center_name:'성장기지 연결이 필요합니다.'}async function recent(){if(!$('child').value)return;$('recentBox').hidden=false;const a=await SparkData.rpc('spark_family_activity_recent',{p_child_id:$('child').value,p_limit:10});$('recent').innerHTML=a.length?a.map(x=>`<div><b>${esc(x.label)}</b> · ${x.status==='pending'?'확인 대기':x.status==='approved'?'승인됨':esc(x.status)}<br><small>${esc(x.memo||'')}</small></div>`).join(''):'<p class="muted">아직 기록이 없습니다.</p>'}$('rules').onclick=e=>{const b=e.target.closest('button[data-type]');if(!b)return;activity=b.dataset.type;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))};$('child').onchange=()=>{showCenter();recent()};$('submit').onclick=async()=>{if(!$('child').value)return $('result').textContent='성장기지에 연결된 아이를 선택해 주세요.';if(!activity)return $('result').textContent='행동 종류를 하나 선택해 주세요.';try{await SparkData.rpc('spark_family_activity_submit',{p_child_id:$('child').value,p_activity_type:activity,p_memo:$('memo').value.trim()});$('result').innerHTML='<div class="ok"><b>✅ 기록을 보냈습니다.</b><br>성장기지 지도자가 확인하면 실제 SPARK에 반영됩니다.</div>';$('memo').value='';await recent()}catch(e){$('result').textContent=String(e?.message||e).includes('DAILY_PENDING_LIMIT')?'오늘 보낼 수 있는 확인대기 기록 수를 모두 사용했습니다.':'기록을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.'}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await load()}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
