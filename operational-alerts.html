<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 운영위험 알림센터 · GB-14 v3.30.0</title><link rel="stylesheet" href="assets/css/style.css?v=3300"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel,.login{margin-top:15px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat,.alert{padding:14px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat b{display:block;font-size:26px}.muted,.stat small,.alert small{color:#9fb2ce}.alerts{display:grid;gap:10px}.alert.high{border-color:#ff9f1c88}.alert.critical{border-color:#ff5c5caa}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;background:#172743;margin-right:5px}.btn,.login button,.alert button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.alert-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.alert textarea{width:100%;min-height:62px;margin-top:9px;padding:10px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff;box-sizing:border-box}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · NETWORK</div><div class="ver">GB-14 · v3.30.0</div></header><section class="panel"><small>OPERATIONAL ALERT CENTER</small><h1>본부 운영위험 알림센터</h1><p class="muted">운영위험을 감지하고 확인·조치·해결 이력을 남깁니다. HQ·국가관리자·지역관리자는 자신의 권한범위만 볼 수 있습니다.</p><div class="tools"><div><a class="btn secondary" href="network-insights.html">← 성장분석</a> <a class="btn secondary" href="daily-briefing.html">☀️ 일일 브리핑</a> <a class="btn secondary" href="operational-tasks.html">📋 운영업무</a></div><button id="refreshSignals" class="btn">위험 다시 감지</button></div></section><section id="loginBox" class="login"><b>관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><div class="head"><h2>🚨 운영 알림</h2><select id="filter"><option value="active">미해결</option><option value="all">전체</option><option value="resolved">해결됨</option></select></div><div id="alerts" class="alerts"></div></section></main><script src="assets/js/config.js?v=3300"></script><script src="assets/js/spark-data.js?v=3300"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={summary:{},alerts:[]};function draw(){const s=data.summary||{};$('stats').innerHTML=[['미확인',s.open],['확인됨',s.acknowledged],['조치중',s.in_progress],['해결',s.resolved],['긴급',s.critical]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');const f=$('filter').value;const rows=(data.alerts||[]).filter(a=>f==='all'||(f==='active'&&!['resolved','dismissed'].includes(a.status))||(f==='resolved'&&a.status==='resolved'));$('alerts').innerHTML=rows.map(a=>`<article class="alert ${esc(a.severity)}"><div><span class="tag">${esc(a.severity)}</span><span class="tag">${esc(a.status)}</span><b>${esc(a.center_name)}</b> · ${esc(a.country_code)} ${esc(a.region_name||'')}</div><h3>${esc(a.title)}</h3><small>${a.signal_value!==null&&a.signal_value!==undefined?'신호값 '+esc(a.signal_value)+' · ':''}${new Date(a.detected_at).toLocaleString()}</small><textarea id="note-${a.id}" placeholder="조치 메모"></textarea><div class="alert-actions"><button onclick="act('${a.id}','acknowledge')">확인</button><button onclick="act('${a.id}','start_action')">조치 시작</button><button onclick="act('${a.id}','note')">메모</button><button onclick="act('${a.id}','resolve')">해결</button><button class="secondary" onclick="act('${a.id}','reopen')">재오픈</button><button class="secondary" onclick="historyView('${a.id}')">이력</button><a class="btn secondary" href="operational-tasks.html">업무 배정</a></div><div id="history-${a.id}" class="muted"></div></article>`).join('')||'<p class="muted">표시할 운영 알림이 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_operational_alert_center',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='HQ·국가관리자·지역관리자 권한을 확인해 주세요.'}}window.act=async(id,action)=>{const note=$('note-'+id).value.trim();if(action==='resolve'&&!note){alert('해결 메모를 입력해 주세요.');return}try{await SparkData.rpc('spark_operational_alert_action',{p_alert_id:id,p_action:action,p_note:note||null});await load()}catch(e){alert('조치 처리에 실패했습니다.')}};window.historyView=async id=>{try{const h=await SparkData.rpc('spark_operational_alert_history',{p_alert_id:id});$('history-'+id).innerHTML=(h||[]).map(x=>`<div>• ${esc(x.action_type)} · ${esc(x.note||'메모 없음')} · ${new Date(x.created_at).toLocaleString()}</div>`).join('')||'이력이 없습니다.'}catch(e){$('history-'+id).textContent='이력을 불러오지 못했습니다.'}};$('refreshSignals').onclick=async()=>{try{await SparkData.rpc('spark_refresh_operational_alerts',{});await load()}catch(e){alert('위험 감지에 실패했습니다.')}};$('filter').onchange=draw;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 운영권한을 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
