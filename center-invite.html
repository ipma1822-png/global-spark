<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 회원 초대</title><link rel="stylesheet" href="assets/css/style.css?v=3600"><style>body{background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.panel{margin:14px 0;padding:18px;border-radius:20px;background:#0e1930}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:180px;padding:11px;border-radius:10px;background:#091326;color:#fff;border:1px solid #ffffff20}.btn,button{padding:11px 14px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff}.link{word-break:break-all;padding:14px;border-radius:12px;background:#091326}.muted{color:#9fb2ce}</style></head><body><main class="wrap"><a href="my-centers.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><section class="panel"><small>GS-08 · v3.60.0</small><h1>회원 초대링크 만들기</h1><p class="muted">학부모에게 이 링크를 보내면 학부모가 직접 로그인하고 자녀를 선택해 성장기지 가입을 신청합니다. 지도자는 신청자만 확인·승인하면 됩니다.</p><div id="login" class="row"><input id="email" type="email" placeholder="지도자 이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button></div></section><section class="panel"><label>성장기지 코드<input id="center" placeholder="예: KMT-000001" style="width:100%;box-sizing:border-box;padding:11px;margin-top:7px;border-radius:10px;background:#091326;color:#fff;border:1px solid #ffffff20"></label><br><label>초대 이름(선택)<input id="label" placeholder="예: 2026 신입회원" style="width:100%;box-sizing:border-box;padding:11px;margin-top:7px;border-radius:10px;background:#091326;color:#fff;border:1px solid #ffffff20"></label><br><button id="make">🔗 초대링크 만들기</button><div id="out" hidden><h3>학부모에게 보내세요</h3><div id="url" class="link"></div><br><button id="copy">링크 복사</button> <a id="open" class="btn secondary" target="_blank">가입화면 확인</a></div><p id="msg" class="muted"></p></section><section class="panel"><h2>가입 신청 확인</h2><button id="load" class="secondary">신청자 불러오기</button><div id="requests"></div></section></main><script src="assets/js/config.js?v=3600"></script><script src="assets/js/spark-data.js?v=3600"></script><script>(()=>{const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('loginBtn').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);$('login').hidden=true;$('msg').textContent='로그인되었습니다.'}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};$('make').onclick=async()=>{try{const r=await SparkData.rpc('spark_center_invite_create',{p_center_code:$('center').value.trim(),p_label:$('label').value.trim()||null,p_expires_at:null}),u=new URL('join-growth-base.html',location.href);u.searchParams.set('invite',r.invite_token);$('url').textContent=u.href;$('open').href=u.href;$('out').hidden=false}catch(e){$('msg').textContent='성장기지 권한과 코드를 확인해 주세요.'}};$('copy').onclick=()=>navigator.clipboard.writeText($('url').textContent).then(()=>$('msg').textContent='초대링크를 복사했습니다.');async function load(){try{const a=await SparkData.rpc('spark_center_join_requests',{p_center_code:$('center').value.trim()});$('requests').innerHTML=a.length?a.map(x=>`<div style="padding:13px;margin-top:9px;background:#091326;border-radius:12px"><b>${esc(x.child_name)}</b> · ${esc(x.age_group)}<br><small>가입 신청 대기</small><br><button data-id="${x.request_id}" data-act="approve">승인</button> <button class="secondary" data-id="${x.request_id}" data-act="reject">거절</button></div>`).join(''):'<p class="muted">대기 중인 가입 신청이 없습니다.</p>'}catch(_){$('msg').textContent='신청목록을 불러오지 못했습니다.'}}$('load').onclick=load;$('requests').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;try{await SparkData.rpc('spark_center_review_join_request',{p_request_id:b.dataset.id,p_action:b.dataset.act});await load()}catch(_){$('msg').textContent='처리하지 못했습니다.'}};if(SparkData.isSignedIn())$('login').hidden=true})();</script></body></html>
