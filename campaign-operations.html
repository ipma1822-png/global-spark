<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 캠페인 운영 · GB-30 v3.46.0</title><link rel="stylesheet" href="assets/css/style.css?v=3460"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1200px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.grid{display:grid;gap:10px}.campaigns{display:flex;gap:8px;flex-wrap:wrap}.campaigns button{background:#172743;color:#fff;border:1px solid #ffffff18}.campaigns button.active{background:#ff9f1c;color:#071126}.joined{border-left:4px solid #4dd599}.not_joined{border-left:4px solid #6b7890}.withdrawn{border-left:4px solid #ff6b6b}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · 캠페인 운영</div><div class="ver">GB-30 · v3.46.0</div></header><section class="panel"><small>GLOBAL CAMPAIGN → COUNTRY / REGION → GROWTH BASE → MEMBER ACTION</small><h1>🌍 글로벌 캠페인 운영센터</h1><p class="muted">HQ·국가관리자·지역관리자가 자기 권역의 캠페인 전파, 성장기지 참여, 회원 실천, 활동 실적을 한 흐름에서 확인합니다.</p><div class="tools"><span id="role" class="tag">권한 확인 중</span><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>운영 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>캠페인 선택</h2><div id="campaigns" class="campaigns"></div></section><section class="panel"><h2>📊 권역 캠페인 현황</h2><div id="stats" class="stats"></div></section><section class="panel"><h2>🌐 국가별 확산</h2><div id="countries" class="grid"></div></section><section class="panel"><h2>🏫 성장기지 참여·실적</h2><div id="centers" class="grid"></div></section></main><script src="assets/js/config.js?v=3460"></script><script src="assets/js/spark-data.js?v=3460"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=null;function roleText(c){if(c.role==='hq')return'HQ · 전 세계';return(c.scopes||[]).map(x=>x.role==='country_admin'?`국가관리자 · ${x.country_code}`:`지역관리자 · ${x.country_code} / ${x.region_name}`).join(' · ')}async function context(){try{return await SparkData.rpc('spark_network_role_context',{})}catch(e){return{role:'scoped_admin',scopes:[]}}}function draw(d,ctx){$('role').textContent=roleText(ctx);$('campaigns').innerHTML=(d.campaigns||[]).map(c=>`<button data-id="${c.id}" class="${selected===c.id?'active':''}">${esc(c.title)} · ${esc(c.flame_code)} · ${esc(c.status)}</button>`).join('')||'<p class="muted">캠페인이 없습니다.</p>';document.querySelectorAll('#campaigns button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;load()});const s=d.summary||{};$('stats').innerHTML=[['캠페인',s.campaigns],['권역 성장기지',s.centers],['참여 성장기지',s.joined_centers],['참여 회원',s.participating_members],['캠페인 활동',s.actions]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('');$('countries').innerHTML=(d.countries||[]).map(x=>`<article class="card"><b>${esc(x.country_code)}</b><p>성장기지 ${x.centers||0}곳 · 참여 ${x.joined_centers||0}곳</p><small>참여회원 ${x.participating_members||0}명 · 활동 ${x.actions||0}건</small></article>`).join('')||'<p class="muted">국가별 데이터가 없습니다.</p>';$('centers').innerHTML=(d.centers||[]).map(x=>`<article class="card ${esc(x.center_campaign_status)}"><div class="head"><div><b>${esc(x.center_name)}</b><small>${esc(x.country_code)} · ${esc(x.region_name||'')} · ${esc(x.designation_status)}</small></div><span class="tag">${esc(x.center_campaign_status)}</span></div><p>참여회원 <b>${x.participating_members||0}</b>명 · 캠페인 활동 <b>${x.actions||0}</b>건</p><small>${x.last_action_at?'최근 활동 '+new Date(x.last_action_at).toLocaleString():'캠페인 활동 없음'}</small></article>`).join('')||'<p class="muted">성장기지 데이터가 없습니다.</p>'}async function load(){try{const [d,ctx]=await Promise.all([SparkData.rpc('spark_scoped_campaign_operations',{p_campaign_id:selected}),context()]);$('loginBox').hidden=true;draw(d,ctx)}catch(e){console.error(e);$('msg').textContent='HQ·국가관리자·지역관리자 권한을 확인해 주세요.'}}$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
