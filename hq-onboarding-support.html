<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 온보딩 지원업무 · GB-24 v3.40.0</title><link rel="stylesheet" href="assets/css/style.css?v=3400"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.panel,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.head{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a}.muted,small{color:#9fb2ce}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.grid{display:grid;gap:10px}.high{border-left:4px solid #ff6b6b}.medium{border-left:4px solid #ffd166}.low{border-left:4px solid #7cc4ff}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ 온보딩 지원</div><div class="ver">GB-24 · v3.40.0</div></header><section class="panel"><small>ONBOARDING SIGNAL → SUPPORT TASK</small><h1>자동 지원업무 관제</h1><p class="muted">GB-23 위험신호를 실제 운영업무로 연결합니다. 지역관리자 → 국가관리자 → HQ 순으로 담당자를 선택하고, 신호별 기한을 자동 설정합니다.</p><div class="head"><a class="btn" href="hq-onboarding-watch.html">위험신호 보기</a><a class="btn" href="operational-tasks.html">전체 운영업무</a></div></section><section id="loginBox" class="panel"><b>HQ 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📋 자동 생성된 지원업무</h2><div id="list" class="grid"><p class="muted">로그인이 필요합니다.</p></div></section></main><script src="assets/js/config.js?v=3400"></script><script src="assets/js/spark-data.js?v=3400"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await SparkData.rpc('spark_hq_onboarding_support_tasks',{});$('loginBox').hidden=true;$('list').innerHTML=(d||[]).map(x=>`<article class="card ${esc(x.severity)}"><div class="head"><div><span class="tag">${esc(x.severity)}</span> <b>${esc(x.center_name)}</b></div><span class="tag">${esc(x.task_status)}</span></div><h3>${esc(x.task_title)}</h3><p class="muted">${esc(x.signal_type)} · 담당 ${esc(x.assignee_email||'-')}</p><small>${x.due_at?'기한 '+new Date(x.due_at).toLocaleString():'기한 없음'}</small></article>`).join('')||'<p class="muted">현재 자동 지원업무가 없습니다.</p>'}catch(e){$('msg').textContent='HQ 권한을 확인해 주세요.'}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
