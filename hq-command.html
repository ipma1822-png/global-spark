<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>HQ COMMAND CENTER · PHASE 3-6 · v3.6.0</title><link rel="stylesheet" href="assets/css/style.css"><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#173f70,#09152c 36%,#071126);color:#fff}.wrap{max-width:1280px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center}.top a{color:#fff;text-decoration:none}.ver{margin-left:auto;border:1px solid #ffb34766;border-radius:999px;padding:7px 11px;color:#ffd28b}.hero,.panel,.login{margin-top:16px;padding:20px;border:1px solid #ffffff15;border-radius:22px;background:#0e1930}.hero h1{font-size:clamp(30px,5vw,58px);margin:5px 0}.hero p,.tiny{color:#aebfd7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{padding:15px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat small,.stat b{display:block}.stat b{font-size:27px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{padding:16px;border-radius:18px;background:#0a1428;border:1px solid #ffffff12}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0c}.row:last-child{border:0}.row span{color:#aebfd7;text-align:right}.login input{padding:12px;border-radius:12px;border:1px solid #ffffff20;background:#091326;color:#fff;margin:4px}.login button,.refresh{padding:12px 16px;border:0;border-radius:12px;background:#ff9f1c;font-weight:900}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">🔥 <b>GLOBAL SPARK</b></a><a href="hq-admin.html">본부 운영</a><span class="ver">PHASE 3-6 · v3.6.0</span></header><section class="hero"><small>GLOBAL HEADQUARTERS</small><h1>HQ COMMAND CENTER</h1><p>국가·지역·센터의 성장 흐름, 5대 불꽃, MISSION과 신규 센터를 본부에서 한눈에 확인합니다. 개인 경쟁순위가 아니라 세계의 선한 행동 흐름을 관리하는 상황실입니다.</p></section><section id="loginBox" class="login"><b>본부 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="tiny"></p></section><section class="panel"><div class="head"><div><small>WORLD GROWTH STATUS</small><h2>세계 성장현황</h2></div><button id="refresh" class="refresh">새로고침</button></div><div id="commandData"><p class="tiny">본부 관리자 로그인 후 표시됩니다.</p></div></section></main><script src="assets/js/config.js?v=360"></script><script src="assets/js/spark-data.js?v=360"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fl={GOOD:'🔥 착한',SAFE:'🛡️ 안전',EARTH:'🌿 환경',CHALLENGE:'⛰️ 도전',CITIZEN:'🤝 함께'};async function load(){try{const d=await SparkData.hqCommandDashboard(),s=d.summary||{},f=d.flames_7d||{};$('commandData').innerHTML=`<div class="stats">${[['국가',s.countries],['활성 센터',s.active_centers],['참여자',s.active_members],['오늘 활동',s.today_activities],['7일 활동',s.week_activities],['누적 XP',s.total_xp],['신규 센터',s.new_center_requests],['공개 MISSION',s.published_missions]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]||0}</b></div>`).join('')}</div><div class="grid"><article class="card"><h3>🌍 국가별 성장</h3>${(d.countries||[]).map(x=>`<div class="row"><b>${esc(x.country_code)}</b><span>${x.centers}센터 · ${x.members}명<br>7일 ${x.week_activities}회 · ${x.total_xp} XP</span></div>`).join('')||'데이터 없음'}</article><article class="card"><h3>🔥 최근 7일 5대 불꽃</h3>${Object.keys(fl).map(k=>`<div class="row"><b>${fl[k]}</b><span>${f[k]||0}회</span></div>`).join('')}</article><article class="card"><h3>🏫 센터별 현황</h3>${(d.centers||[]).slice(0,20).map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${esc(x.country_code||'--')} · ${x.members}명<br>오늘 ${x.today_activities} · 7일 ${x.week_activities} · ${x.total_xp} XP</span></div>`).join('')||'센터 없음'}</article><article class="card"><h3>🎯 MISSION 참여</h3>${(d.missions||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b><span>${fl[x.flame_code]||esc(x.flame_code)}<br>완료 ${x.completions}명</span></div>`).join('')||'운영중 MISSION 없음'}</article></div>`;$('loginBox').hidden=true}catch(e){console.error(e);$('msg').textContent='본부 관리자 권한을 확인해 주세요.'}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 본부 권한을 확인해 주세요.'}};$('refresh').onclick=load;if(SparkData.isSignedIn())load();</script></body></html>
