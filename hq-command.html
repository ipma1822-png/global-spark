<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>HQ COMMAND CENTER · PHASE 3-15 · v3.15.0</title><link rel="stylesheet" href="assets/css/style.css?v=3150"><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#173f70,#09152c 36%,#071126);color:#fff}.wrap{max-width:1280px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top a{color:#fff;text-decoration:none}.ver{margin-left:auto;border:1px solid #ffb34766;border-radius:999px;padding:7px 11px;color:#ffd28b}.hero,.panel,.login{margin-top:16px;padding:20px;border:1px solid #ffffff15;border-radius:22px;background:#0e1930}.hero h1{font-size:clamp(30px,5vw,58px);margin:5px 0}.hero p,.tiny{color:#aebfd7}.stats,.signals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat,.signal{padding:15px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat small,.stat b,.signal small,.signal b{display:block}.stat b,.signal b{font-size:27px;margin-top:4px}.signal.warn{border-color:#ffb34766;background:#ff9f1c12}.signal.good{border-color:#54df8860;background:#54df8810}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{padding:16px;border-radius:18px;background:#0a1428;border:1px solid #ffffff12}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0c}.row:last-child{border:0}.row span{color:#aebfd7;text-align:right}.login input{padding:12px;border-radius:12px;border:1px solid #ffffff20;background:#091326;color:#fff;margin:4px}.login button,.refresh,.chip{padding:12px 16px;border:0;border-radius:12px;background:#ff9f1c;font-weight:900;cursor:pointer}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.drill{margin-top:14px}.crumb{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{padding:8px 11px;background:#172743;color:#fff;border:1px solid #ffffff18}.chip.active{background:#ff9f1c;color:#071126}.center-card{padding:13px;margin-top:8px;border-radius:14px;background:#ffffff07;border:1px solid #ffffff0d}.center-card small{color:#9fb2ce}.campaign-card{border-color:#ffb34738;background:linear-gradient(135deg,#ff9f1c12,#0a1428)}.ops-title{margin-top:22px}.action-links{display:flex;gap:8px;flex-wrap:wrap}.action-links a{padding:9px 12px;border-radius:11px;background:#172743;color:#fff;text-decoration:none;border:1px solid #ffffff18}@media(max-width:800px){.stats,.signals{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.stats,.signals{grid-template-columns:1fr 1fr}.wrap{padding:10px}.ver{margin-left:0}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">🔥 <b>GLOBAL SPARK</b></a><a href="hq-admin.html">본부 운영</a><a href="spark-live.html">SPARK LIVE</a><span class="ver">PHASE 3-15 · v3.15.0</span></header><section class="hero"><small>GLOBAL HEADQUARTERS</small><h1>HQ COMMAND CENTER</h1><p>국가 → 지역 → 센터의 성장 흐름, 캠페인·MISSION·운영 신호를 한 화면에서 확인합니다. 개인 경쟁순위가 아니라 세계의 선한 행동이 멈추지 않도록 관리하는 본부 상황실입니다.</p></section><section id="loginBox" class="login"><b>본부 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="tiny"></p></section><section class="panel"><div class="head"><div><small>WORLD GROWTH & OPERATIONS</small><h2>세계 성장·운영 현황</h2></div><button id="refresh" class="refresh">새로고침</button></div><div id="commandData"><p class="tiny">본부 관리자 로그인 후 표시됩니다.</p></div></section></main><script src="assets/js/config.js?v=3150"></script><script src="assets/js/spark-data.js?v=3150"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fl={GOOD:'🔥 착한',SAFE:'🛡️ 안전',EARTH:'🌿 환경',CHALLENGE:'⛰️ 도전',CITIZEN:'🤝 함께'};let data=null,campaignStats=[],signals={},selectedCountry='ALL',selectedRegion='ALL';function regions(){return [...new Set((data.centers||[]).filter(x=>selectedCountry==='ALL'||(x.country_code||'--')===selectedCountry).map(x=>x.region_name||'지역 미지정'))].sort()}function drill(){const countries=(data.countries||[]).map(x=>x.country_code),rs=regions(),cs=(data.centers||[]).filter(x=>(selectedCountry==='ALL'||(x.country_code||'--')===selectedCountry)&&(selectedRegion==='ALL'||(x.region_name||'지역 미지정')===selectedRegion));return `<article class="card drill"><h3>🌐 국가 → 지역 → 센터</h3><div class="crumb"><button class="chip country ${selectedCountry==='ALL'?'active':''}" data-v="ALL">세계 전체</button>${countries.map(x=>`<button class="chip country ${selectedCountry===x?'active':''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${selectedCountry!=='ALL'?`<div class="crumb"><button class="chip region ${selectedRegion==='ALL'?'active':''}" data-v="ALL">전체 지역</button>${rs.map(x=>`<button class="chip region ${selectedRegion===x?'active':''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}<div>${cs.map(x=>`<div class="center-card"><b>🏫 ${esc(x.name)}</b><br><small>${esc(x.country_code||'--')} · ${esc(x.region_name||'지역 미지정')} · ${x.members}명 · 오늘 ${x.today_activities} · 7일 ${x.week_activities} · ${x.total_xp} XP</small></div>`).join('')||'<p class="tiny">해당 센터가 없습니다.</p>'}</div></article>`}function render(){const d=data,s=d.summary||{},f=d.flames_7d||{},sig=signals||{},needs=Number(sig.members_no_activity_7d||0)+Number(sig.centers_no_activity_7d||0)+Number(sig.new_center_requests||0);$('commandData').innerHTML=`<div class="stats">${[['국가',s.countries],['활성 센터',s.active_centers],['참여자',s.active_members],['오늘 활동',s.today_activities],['7일 활동',s.week_activities],['누적 XP',s.total_xp],['신규 센터',s.new_center_requests],['공개 MISSION',s.published_missions]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('')}</div><h2 class="ops-title">🚦 본부 운영 신호</h2><div class="signals"><div class="signal ${sig.centers_no_activity_7d?'warn':'good'}"><small>7일 활동 없는 센터</small><b>${sig.centers_no_activity_7d||0}</b></div><div class="signal ${sig.members_no_activity_7d?'warn':'good'}"><small>7일 활동 없는 참여자</small><b>${sig.members_no_activity_7d||0}</b></div><div class="signal"><small>오늘 아이 직접기록</small><b>${sig.self_activity_today||0}</b></div><div class="signal"><small>7일 캠페인 실제 실천</small><b>${sig.campaign_actions_7d||0}</b></div><div class="signal ${sig.new_center_requests?'warn':'good'}"><small>신규 센터 신청</small><b>${sig.new_center_requests||0}</b></div><div class="signal good"><small>진행 캠페인</small><b>${sig.active_campaigns||0}</b></div><div class="signal ${needs?'warn':'good'}"><small>확인할 운영 신호</small><b>${needs}</b></div><div class="signal good"><small>상태</small><b>${needs?'확인 필요':'정상'}</b></div></div><div class="action-links"><a href="hq-admin.html">⚙️ 본부 운영 관리</a><a href="spark-live.html">🌍 공개 LIVE 보기</a><a href="system-status.html">🩺 시스템 상태</a></div>${drill()}<article class="card campaign-card" style="margin-top:14px"><h3>🌍 글로벌 캠페인 참여·실천</h3>${campaignStats.length?campaignStats.map(x=>`<div class="row"><b>${fl[x.flame_code]||esc(x.flame_code)} · ${esc(x.title)}</b><span>${x.countries}개국 · ${x.centers}센터 · ${x.members}명 참여<br>실제 실천 ${x.actions||0}회</span></div>`).join(''):'<p class="tiny">아직 캠페인 참여 기록이 없습니다.</p>'}</article><div class="grid"><article class="card"><h3>🌍 국가별 성장</h3>${(d.countries||[]).map(x=>`<div class="row"><b>${esc(x.country_code)}</b><span>${x.centers}센터 · ${x.members}명<br>7일 ${x.week_activities}회 · ${x.total_xp} XP</span></div>`).join('')||'데이터 없음'}</article><article class="card"><h3>🔥 최근 7일 5대 불꽃</h3>${Object.keys(fl).map(k=>`<div class="row"><b>${fl[k]}</b><span>${f[k]||0}회</span></div>`).join('')}</article><article class="card"><h3>🏫 센터별 현황</h3>${(d.centers||[]).slice(0,20).map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${esc(x.country_code||'--')} · ${x.members}명<br>오늘 ${x.today_activities} · 7일 ${x.week_activities} · ${x.total_xp} XP</span></div>`).join('')||'센터 없음'}</article><article class="card"><h3>🎯 MISSION 참여</h3>${(d.missions||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b><span>${fl[x.flame_code]||esc(x.flame_code)}<br>완료 ${x.completions}명</span></div>`).join('')||'운영중 MISSION 없음'}</article></div>`}async function load(){try{[data,campaignStats,signals]=await Promise.all([SparkData.hqCommandDashboard(),SparkData.hqCampaignStats(),SparkData.rpc('spark_hq_operational_signals',{})]);render();$('loginBox').hidden=true}catch(e){console.error(e);$('msg').textContent='본부 관리자 권한을 확인해 주세요.'}}$('commandData').onclick=e=>{const c=e.target.closest('.country'),r=e.target.closest('.region');if(c){selectedCountry=c.dataset.v;selectedRegion='ALL';render()}else if(r){selectedRegion=r.dataset.v;render()}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 본부 권한을 확인해 주세요.'}};$('refresh').onclick=load;if(SparkData.isSignedIn())load();</script></body></html>
