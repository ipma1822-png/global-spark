<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 관리자 성과추세 · GB-17 v3.33.0</title><link rel="stylesheet" href="assets/css/style.css?v=3330"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button,select{padding:10px 12px;border:0;border-radius:10px;font-weight:900}.btn,button{background:#ff9f1c;color:#071126;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.grid{display:grid;gap:10px}.snap{padding:15px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.metric{padding:10px;border-radius:13px;background:#101d35}.metric b{display:block;font-size:20px}.rec{margin-top:10px;padding:11px;border-radius:12px;background:#15223c;color:#ffdca0}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.metrics{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · OPERATIONS</div><div class="ver">GB-17 · v3.33.0</div></header><section class="panel"><small>PERFORMANCE TREND CENTER</small><h1>관리자 주간·월간 성과추세</h1><p class="muted">완료율·첫 대응시간·완료시간·기한초과 흐름을 주간 또는 월간 스냅샷으로 비교합니다. 추천은 실제 지표에 따른 규칙 기반 개선안입니다.</p><div class="tools"><div><a class="btn secondary" href="admin-performance.html">📈 현재 성과</a> <a class="btn secondary" href="operational-focus.html">🎯 오늘의 포커스</a></div><select id="ptype"><option value="weekly">주간 추세</option><option value="monthly">월간 추세</option></select></div></section><section id="loginBox" class="login"><b>관리자 / 담당자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>👤 내 성과 추세</h2><div id="mine" class="grid"></div></section><section id="hqPanel" class="panel" hidden><h2>🌏 HQ 관리자별 추세</h2><div id="hq" class="grid"></div></section></main><script src="assets/js/config.js?v=3330"></script><script src="assets/js/spark-data.js?v=3330"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtH=v=>Number(v||0)<1?`${Math.round(Number(v||0)*60)}분`:`${Number(v||0).toFixed(1)}시간`;function card(s,label=''){const m=s.metrics||{};return `<article class="snap"><div class="head"><div>${label?`<b>${esc(label)}</b> `:''}<span class="tag">${esc(s.period_start)} ~ ${esc(s.period_end)}</span></div><small>${s.generated_at?new Date(s.generated_at).toLocaleString():''}</small></div><div class="metrics"><div class="metric"><small>업무</small><b>${m.total||0}</b></div><div class="metric"><small>완료율</small><b>${m.completion_rate||0}%</b></div><div class="metric"><small>기한초과</small><b>${m.overdue_open||0}</b></div><div class="metric"><small>첫 대응</small><b>${fmtH(m.avg_first_response_hours)}</b></div><div class="metric"><small>완료시간</small><b>${fmtH(m.avg_completion_hours)}</b></div></div><div class="rec">💡 ${esc(s.recommendation||'추천 없음')}</div></article>`}async function load(){const p=$('ptype').value;try{const me=await SparkData.rpc('spark_my_performance_trend',{p_type:p,p_limit:12});$('loginBox').hidden=true;$('mine').innerHTML=(me.snapshots||[]).map(s=>card(s)).join('')||'<p class="muted">아직 저장된 성과 스냅샷이 없습니다.</p>';try{const h=await SparkData.rpc('spark_hq_performance_trend',{p_type:p,p_limit:12});$('hqPanel').hidden=false;$('hq').innerHTML=(h.snapshots||[]).map(s=>card(s,s.email)).join('')||'<p class="muted">아직 저장된 관리자 성과 스냅샷이 없습니다.</p>'}catch(e){$('hqPanel').hidden=true}}catch(e){console.error(e);$('msg').textContent='로그인 정보를 확인해 주세요.'}}$('ptype').onchange=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
