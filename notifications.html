<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 알림</title><link rel="stylesheet" href="assets/css/style.css?v=3660"><style>body{background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:16px}.panel{padding:18px;margin:12px 0;border-radius:20px;background:#0e1930}.tabs{display:flex;gap:8px}.tabs button{flex:1}.item{display:block;color:#fff;text-decoration:none;padding:14px;margin:8px 0;border-radius:14px;background:#091326;border:1px solid #ffffff16}.item b{display:block}.item small,.muted{color:#9fb2ce}.btn,button,input{padding:11px;border-radius:10px;border:0}.btn,button{background:#ff9f1c;color:#071126;font-weight:900}.secondary{background:#172743;color:#fff}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input{background:#091326;color:#fff;border:1px solid #ffffff16}@media(max-width:550px){.login{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><section class="panel"><small>GS-14 · v3.66.0</small><h1>🔔 SPARK 알림</h1><p class="muted">부모님은 승인·배지·가입 결과를, 지도자는 승인대기·가입신청·운영 확인사항을 한곳에서 봅니다.</p></section><section class="panel" id="loginBox"><h2>로그인</h2><div class="login"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel" id="box" hidden><div class="tabs"><button id="family">👨‍👩‍👧 가족 알림</button><button id="center" class="secondary">🏫 성장기지 알림</button></div><div id="centerInput" hidden style="margin-top:10px"><input id="code" placeholder="성장기지 코드" style="width:65%"><button id="loadCenter">불러오기</button></div><div id="list"></div></section></main><script src="assets/js/config.js?v=3660"></script><script src="assets/js/spark-data.js?v=3660"></script><script>(()=>{const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(a){$('list').innerHTML=a.length?a.map(n=>`<a class="item" href="${n.href?esc(n.href):'#'}"><b>${n.kind==='badge'?'🏅':n.kind==='approval'||n.kind==='approval_pending'?'✅':n.kind==='join'||n.kind==='join_pending'?'👥':'⚠️'} ${esc(n.title)}</b>${esc(n.body)}<br><small>${new Date(n.ts).toLocaleString('ko-KR')}</small></a>`).join(''):'<p class="muted">새 알림이 없습니다.</p>'}async function family(){try{render(await SparkData.rpc('spark_family_notifications',{p_limit:30}))}catch(e){$('list').innerHTML='<p class="muted">가족 알림을 불러올 수 없습니다. 부모 프로필을 확인해 주세요.</p>'}}async function ready(){$('loginBox').hidden=true;$('box').hidden=false;await family()}$('family').onclick=()=>{$('centerInput').hidden=true;family()};$('center').onclick=()=>{$('centerInput').hidden=false;$('list').innerHTML='<p class="muted">운영 중인 성장기지 코드를 입력해 주세요.</p>'};$('loadCenter').onclick=async()=>{try{render(await SparkData.rpc('spark_center_notifications',{p_center_code:$('code').value.trim(),p_limit:50}))}catch(e){$('list').innerHTML='<p class="muted">성장기지 권한 또는 코드를 확인해 주세요.</p>'}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await ready()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())ready()})();</script></body></html>
