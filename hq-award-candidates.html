<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 우수 성장기지 포상후보 · GB-29 v3.45.0</title><link rel="stylesheet" href="assets/css/style.css?v=3450"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.grid{display:grid;gap:10px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:9px 11px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900}.secondary{background:#172743;color:#fff}.top{border-color:#ffd16699}.candidate{border-color:#7ee78788}.no{opacity:.8}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.metric{padding:8px;border-radius:10px;background:#0a1428;text-align:center}.metric b{display:block;font-size:18px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.stats,.metrics{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ 포상후보</div><span class="ver">GB-29 · v3.45.0</span></header><section class="panel"><small>EXCELLENCE & AWARD RECOMMENDATION</small><h1>🏆 우수 성장기지 · 포상 후보 자동추천</h1><p class="muted">공식지정 후 30일 이상 운영된 성장기지를 대상으로 운영건강도·LEVEL·참여율·5대 불꽃 균형·캠페인·관리자 실행력을 종합합니다. 자동추천은 후보 선별이며 최종 포상 결정은 HQ가 합니다.</p><div class="tools"><span>85+ 최우수후보 · 75+ 후보 · 65+ 관찰</span><button id="reload">다시 계산</button></div></section><section id="loginBox" class="login"><b>HQ 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>이번 달 후보현황</h2><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>성장기지 평가</h2><div id="list" class="grid"></div></section></main><script src="assets/js/config.js?v=3450"></script><script src="assets/js/spark-data.js?v=3450"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tier=t=>({top_candidate:'최우수 후보',candidate:'포상 후보',watchlist:'관찰 후보',not_recommended:'추천 제외'}[t]||t);function draw(d){const s=d.summary||{};$('stats').innerHTML=[['공식 성장기지',s.official_centers],['후보자격 충족',s.eligible],['최우수 후보',s.top_candidates],['포상 후보',s.candidates]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');const rows=d.centers||[];$('list').innerHTML=rows.map(c=>`<article class="card ${c.recommendation_tier==='top_candidate'?'top':c.recommendation_tier==='candidate'?'candidate':'no'}"><div class="head"><div><b>${esc(c.center_name)}</b><small>${esc(c.designation_code||'-')} · ${esc(c.country_code)} ${esc(c.region_name||'')}</small></div><div><span class="tag">${tier(c.recommendation_tier)}</span> <b>${Number(c.total_score||0)}점</b></div></div><p>${esc(c.eligibility_reason||'')}</p><div class="metrics"><div class="metric"><small>건강도 30%</small><b>${c.health_score||0}</b></div><div class="metric"><small>LEVEL 25%</small><b>${c.level_score||0}</b></div><div class="metric"><small>참여율 15%</small><b>${c.participation_rate||0}%</b></div><div class="metric"><small>5대 불꽃 15%</small><b>${c.five_flame_balance||0}</b></div><div class="metric"><small>캠페인 10%</small><b>${c.campaign_score||0}</b></div><div class="metric"><small>관리실행 5%</small><b>${c.admin_score||0}</b></div></div><div class="tools" style="margin-top:10px"><small>공식지정 ${c.days_designated||0}일 · 현재결정 ${esc(c.decision_status||'pending')}</small><div><button onclick="act('${c.candidate_id}','shortlist')">후보확정</button> <button onclick="act('${c.candidate_id}','award')">포상확정</button> <button class="secondary" onclick="act('${c.candidate_id}','not_select')">이번달 제외</button></div></div></article>`).join('')||'<p class="muted">현재 공식 성장기지가 없어 포상 후보가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_hq_award_candidates',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){console.error(e);$('msg').textContent='HQ 관리자 권한을 확인해 주세요.'}}window.act=async(id,a)=>{const note=prompt('HQ 메모(선택)')||'';try{await SparkData.rpc('spark_hq_award_candidate_action',{p_candidate_id:id,p_action:a,p_note:note});await load()}catch(e){alert(e.message||'처리할 수 없습니다.')}};$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
