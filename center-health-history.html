<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 운영건강도 추세 · GB-18 v3.34.0</title><link rel="stylesheet" href="assets/css/style.css?v=3340"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1000px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.row{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button,select{padding:10px 12px;border:0;border-radius:10px;font-weight:900}.btn,button{background:#ff9f1c;color:#071126;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.score{font-size:32px;font-weight:900}.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.bar{background:#0a1428;border-radius:12px;padding:10px}.bar b{display:block;font-size:18px}@media(max-width:650px){.bars{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="head"><div><a href="center-health.html" style="color:#fff;text-decoration:none">← 🔥 <b>운영건강도</b></a></div><div class="ver">GB-18 · v3.34.0</div></header><section class="panel"><small>HEALTH TREND</small><h1>성장기지 운영건강도 추세</h1><div class="tools"><b id="code">센터 확인 중</b><select id="days"><option value="30">30일</option><option value="90">90일</option><option value="180">180일</option><option value="365">365일</option></select></div></section><section id="loginBox" class="login"><b>관리자 / 성장기지 STAFF 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section id="history" class="panel"><p class="muted">저장된 일일 스냅샷을 불러옵니다.</p></section></main><script src="assets/js/config.js?v=3340"></script><script src="assets/js/spark-data.js?v=3340"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=new URLSearchParams(location.search).get('center')||'';$('code').textContent=code||'센터코드 없음';async function load(){if(!code){$('history').innerHTML='<p class="muted">센터코드가 없습니다.</p>';return}try{const d=await SparkData.rpc('spark_center_health_history',{p_center_code:code,p_days:Number($('days').value)});$('loginBox').hidden=true;const rows=d.history||[];$('history').innerHTML=rows.slice().reverse().map(x=>{const m=x.metrics||{};return `<article class="row"><div class="head"><div><b>${esc(x.date)}</b> <span class="tag">${esc(x.grade)}</span></div><span class="score">${Number(x.score||0)}</span></div><div class="bars"><div class="bar"><small>참여</small><b>${m.participation_score||0}</b></div><div class="bar"><small>지속성</small><b>${m.continuity_score||0}</b></div><div class="bar"><small>승인</small><b>${m.approval_score||0}</b></div><div class="bar"><small>LEVEL</small><b>${m.quality_component||0}</b></div><div class="bar"><small>관리자</small><b>${m.admin_score||0}</b></div></div><p>${esc(x.recommendation||'')}</p></article>`}).join('')||'<p class="muted">아직 저장된 운영건강도 스냅샷이 없습니다.</p>'}catch(e){console.error(e);$('msg').textContent='로그인 또는 센터 접근권한을 확인해 주세요.'}}$('days').onchange=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
