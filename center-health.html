<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장기지 운영건강도 · GB-19 v3.35.0</title><link rel="stylesheet" href="assets/css/style.css?v=3350"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.grid{display:grid;gap:10px}.score{font-size:40px;font-weight:900}.excellent{border-color:#8ef0b088}.healthy{border-color:#a5d8ff88}.watch{border-color:#ffd16699}.risk{border-color:#ff6b6b99}.pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pillar{background:#0a1428;border-radius:13px;padding:10px}.pillar b{display:block;font-size:20px}@media(max-width:900px){.stats,.pillars{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.stats,.pillars{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · OPERATIONS</div><div class="ver">GB-19 · v3.35.0</div></header><section class="panel"><small>CENTER OPERATIONAL HEALTH</small><h1>성장기지 종합 운영건강도</h1><p class="muted">회원 참여 35% · 활동 지속성 20% · 승인 처리 15% · LEVEL 운영품질 15% · 관리자 업무처리 15%를 종합해 성장기지의 현재 운영건강도를 계산합니다.</p><div class="tools"><div><a class="btn secondary" href="network-command.html">🌐 국가·지역 관제</a> <a class="btn secondary" href="network-insights.html">📊 성장분석</a> <a class="btn secondary" href="daily-briefing.html">☀️ 브리핑</a> <a class="btn secondary" href="center-improvement.html">🎯 개선계획</a></div><button id="reload">지금 다시 계산</button></div></section><section id="loginBox" class="login"><b>HQ / 국가 / 지역 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🏫 성장기지 운영건강도</h2><div id="centers" class="grid"></div></section></main><script src="assets/js/config.js?v=3350"></script><script src="assets/js/spark-data.js?v=3350"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={excellent:'우수',healthy:'건강',watch:'관찰',risk:'위험'};function draw(d){const s=d.summary||{};$('stats').innerHTML=[['전체 성장기지',s.centers],['우수',s.excellent],['건강',s.healthy],['관찰',s.watch],['위험',s.risk]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');$('centers').innerHTML=(d.centers||[]).map(c=>{const m=c.metrics||{};return `<article class="card ${esc(c.health_grade)}"><div class="head"><div><b>${esc(c.center_name)}</b><small>${esc(c.country_code)} · ${esc(c.region_name||'')}</small></div><div><span class="tag">${esc(names[c.health_grade]||c.health_grade)}</span> <span class="score">${Number(c.health_score||0)}</span></div></div><div class="pillars"><div class="pillar"><small>회원 참여</small><b>${m.participation_score||0}</b><small>${m.participants_7d||0}/${m.active_members||0}명 · ${m.participation_rate||0}%</small></div><div class="pillar"><small>활동 지속성</small><b>${m.continuity_score||0}</b><small>7일 활동 ${m.activities_7d||0}건</small></div><div class="pillar"><small>승인 처리</small><b>${m.approval_score||0}</b><small>대기 ${m.pending_count||0}건</small></div><div class="pillar"><small>LEVEL 품질</small><b>${m.quality_component||0}</b><small>${esc(m.quality_level||'평가 미저장')}</small></div><div class="pillar"><small>관리자 처리</small><b>${m.admin_score||0}</b><small>30일 업무 ${m.task_completed_30d||0}/${m.task_total_30d||0}</small></div></div><p>${esc(c.recommendation||'')}</p><div class="tools"><a class="btn secondary" href="center-health-history.html?center=${encodeURIComponent(c.center_code)}">추세 보기 →</a><button onclick="makePlan('${esc(c.center_code)}')">🎯 30일 개선계획 생성</button></div></article>`}).join('')||'<p class="muted">담당 범위에 성장기지가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_scoped_center_health',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){console.error(e);$('msg').textContent='로그인 또는 네트워크 관리자 권한을 확인해 주세요.'}}window.makePlan=async code=>{try{const r=await SparkData.rpc('spark_center_improvement_plan_create',{p_center_code:code,p_target_days:30});alert(`개선계획 생성: ${r.baseline_score}점 → 목표 ${r.target_score}점`);location.href='center-improvement.html'}catch(e){if(String(e.message||'').includes('ACTIVE_PLAN_ALREADY_EXISTS'))location.href='center-improvement.html';else alert(e.message||'개선계획을 만들지 못했습니다.')}};$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
