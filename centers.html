<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>SPARK CENTER 찾기 · v1.4.0</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.dir-wrap{max-width:1100px;margin:auto}.searchbar{display:flex;gap:10px;flex-wrap:wrap}.searchbar input{flex:1;min-width:220px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#0f172a;color:#fff}
.center-card{padding:18px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);display:grid;gap:8px}
.center-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.center-code{font-size:.8rem;opacity:.68}
.join-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.join-form input,.join-form select,.join-form textarea{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0f172a;color:#fff}.join-form textarea{grid-column:1/-1;min-height:100px}
@media(max-width:760px){.center-grid,.join-form{grid-template-columns:1fr}.join-form textarea{grid-column:auto}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">🔥 <b>GLOBAL SPARK</b></a><div class="version-pill">CENTERS v1.4.0</div></header>
<main class="container dir-wrap">
<section class="hero compact"><p class="eyebrow">SPARK CENTER DIRECTORY</p><h1>가까운 SPARK CENTER 찾기</h1><p class="lead">좋은 행동을 발견하고, 기록하고, 세상과 연결하는 공식 SPARK 성장센터를 찾습니다.</p></section>
<section class="section">
  <div class="searchbar"><input id="centerQuery" type="search" placeholder="센터명 · 지역 검색"><button id="centerSearchBtn" class="primary" type="button">검색</button></div>
  <div id="centerResults" class="center-grid" style="margin-top:16px"><p class="empty">센터를 불러오는 중…</p></div>
</section>
<section class="section">
  <p class="eyebrow">JOIN GLOBAL SPARK</p><h2>우리 기관도 SPARK CENTER가 될 수 있습니다</h2>
  <p>태권도장, 미술학원, 피아노학원, 공부방, 스포츠클럽, 교회, 학교, 지역아동센터 등 아이의 좋은 행동을 발견하는 곳이라면 참여할 수 있습니다.</p>
  <form id="joinForm" class="join-form">
    <input name="organization_name" placeholder="기관/센터명" required>
    <select name="center_type" required>
      <option value="">기관 유형 선택</option><option value="taekwondo">태권도장</option><option value="art">미술학원</option><option value="music">피아노/음악</option><option value="study">공부방/학원</option><option value="sports">스포츠클럽</option><option value="church">교회</option><option value="school">학교</option><option value="child_center">지역아동센터</option><option value="other">기타</option>
    </select>
    <input name="region_name" placeholder="지역 (예: 울산 남구)" required>
    <input name="contact_name" placeholder="담당자 성함" required>
    <input name="contact_phone" placeholder="연락처" required>
    <input name="contact_email" type="email" placeholder="이메일">
    <textarea name="message" placeholder="참여 목적이나 문의사항 (선택)"></textarea>
    <button class="primary" type="submit">🔥 SPARK CENTER 참여 신청</button>
  </form>
  <p id="joinMessage" class="tiny"></p>
</section>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/spark-data.js"></script><script src="assets/js/centers.js"></script>
</body></html>
