<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장 이야기</title><link rel="stylesheet" href="assets/css/style.css?v=3730"><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#173c66,#071126 42%);color:#fff}.wrap{max-width:1040px;margin:auto;padding:18px}.head,.tools,.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{margin-top:14px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff16}.hero h1{font-size:clamp(34px,6vw,60px);margin:8px 0}.muted,small{color:#9fb2ce}.tools select{padding:11px;border-radius:11px;background:#091326;color:#fff;border:1px solid #ffffff20}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.story{padding:18px;border-radius:18px;background:#091326;border:1px solid #ffffff14}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743;color:#ffd27a}.story h2{margin:10px 0}.story p{line-height:1.75}.btn{display:inline-block;padding:10px 12px;border-radius:10px;background:#172743;color:#fff;text-decoration:none}.empty{padding:24px;text-align:center;color:#9fb2ce;border:1px dashed #ffffff22;border-radius:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><small>GS-21 · v3.73.0</small></header><section class="panel hero"><small>REAL GROWTH · REAL CHANGE</small><h1>성장 이야기가<br>세계를 연결합니다.</h1><p class="muted">좋은 행동 하나, 새로운 도전 하나, 함께한 변화 하나가 사람의 성장으로 이어집니다. GLOBAL SPARK 본부가 검토·공개한 사례만 보여줍니다.</p><div class="tools"><select id="type"><option value="">전체 이야기</option><option value="child_growth">아이 성장</option><option value="growth_base">성장기지</option><option value="campaign">캠페인</option><option value="community">공동체</option></select><a class="btn" href="world-network.html">🌍 WORLD NETWORK</a></div></section><section class="panel"><div class="meta"><h2>🔥 성장 스토리</h2><small id="count"></small></div><div id="list" class="grid"><div class="empty">불러오는 중…</div></div></section></main><script src="assets/js/config.js?v=3730"></script><script>(()=>{const cfg=window.SPARK_CONFIG||{},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={child_growth:'아이 성장',growth_base:'성장기지',campaign:'캠페인',community:'공동체'},flames={GOOD:'❤️ 좋은 행동',SAFE:'🛡️ 안전',EARTH:'🌱 환경',CHALLENGE:'🚀 도전',CITIZEN:'🤝 함께'};async function rpc(name,body){const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}async function load(){try{const rows=await rpc('spark_public_growth_stories',{p_limit:60,p_story_type:$('type').value||null});$('count').textContent=`공개 ${rows.length}건`;$('list').innerHTML=rows.length?rows.map(s=>`<article class="story"><span class="tag">${esc(labels[s.story_type]||s.story_type)}${s.flame_code?' · '+esc(flames[s.flame_code]||s.flame_code):''}</span><h2>${esc(s.title)}</h2><p>${esc(s.story_body).replace(/\n/g,'<br>')}</p><div class="meta"><small>${s.center_name?`🏫 ${esc(s.center_name)} · ${esc(s.designation_code||'')}`:''}${s.campaign_title?`<br>🌍 ${esc(s.campaign_title)}`:''}</small><small>${s.published_at?new Date(s.published_at).toLocaleDateString('ko-KR'):''}</small></div></article>`).join(''):'<div class="empty">아직 공개된 성장 이야기가 없습니다. 본부 검토를 통과한 사례부터 이곳에 소개됩니다.</div>'}catch(e){console.error(e);$('list').innerHTML='<div class="empty">성장 이야기를 불러오지 못했습니다.</div>'}}$('type').onchange=load;load()})();</script></body></html>
