<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · HQ 세계 성장기지 관제 · GB-09 v3.25.0</title><link rel="stylesheet" href="assets/css/style.css?v=3250"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel,.login{margin-top:15px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.country,.center{padding:14px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat b{display:block;font-size:28px}.stat small,.country small,.center small,.muted{color:#9fb2ce}.countries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.centers{display:grid;gap:9px}.center{display:grid;grid-template-columns:1.3fr repeat(4,.7fr);gap:8px;align-items:center}.center.warn{border-color:#ff9f1c88}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;background:#172743}.tag.official{background:#173b2d;color:#8feab4}.tag.warn{background:#4a2d1c;color:#ffd0a3}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select,.login input{padding:11px;border-radius:11px;border:1px solid #ffffff1a;background:#091326;color:#fff}.tools input{flex:1;min-width:220px}.btn,.login button{padding:11px 14px;border:0;border-radius:11px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}@media(max-width:850px){.stats,.countries{grid-template-columns:repeat(2,1fr)}.center{grid-template-columns:1.4fr 1fr 1fr}.optional{display:none}}@media(max-width:520px){.stats,.countries{grid-template-columns:1fr}.center{grid-template-columns:1fr}.tools>*{max-width:100%}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ</div><div class="ver">GB-09 · v3.25.0</div></header><section class="panel"><small>WORLD GROWTH BASE COMMAND</small><h1>세계 성장기지 통합관제</h1><p class="muted">공식지정 여부와 관계없이 본부가 관리하는 파일럿·활성 성장기지의 운영상태를 국가 → 성장기지 단위로 확인합니다.</p><div class="tools"><a class="btn secondary" href="hq-command.html">← HQ COMMAND</a><a class="btn secondary" href="world-network.html">공개 세계 네트워크</a></div></section><section id="loginBox" class="login"><b>본부 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🌐 국가별 관제</h2><div id="countries" class="countries"><p class="muted">본부 관리자 로그인 후 표시됩니다.</p></div></section><section class="panel"><div class="head"><h2>🏫 성장기지 운영신호</h2><button id="refresh" class="btn secondary">새로고침</button></div><div class="tools"><input id="q" placeholder="성장기지·지역·센터코드 검색"><select id="filter"><option value="all">전체</option><option value="attention">확인 필요</option><option value="official">공식지정</option><option value="unassigned">공식 미지정</option><option value="inactive">7일 미활동</option><option value="pending">승인대기 있음</option></select></div><div id="centers" class="centers"></div></section></main><script src="assets/js/config.js?v=3250"></script><script src="assets/js/spark-data.js?v=3250"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));let data={summary:{},countries:[],centers:[]};function draw(){const s=data.summary||{};$('stats').innerHTML=[['관리 국가',s.countries],['전체 성장기지',s.centers],['공식 성장기지',s.official_centers],['활성 회원',s.members],['7일 미활동 센터',s.inactive_centers_7d],['승인대기',s.pending_submissions]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('');$('countries').innerHTML=(data.countries||[]).map(x=>`<article class="country"><b>🌍 ${esc(x.country_code||'--')}</b><small>센터 ${Number(x.centers||0)} · 공식 ${Number(x.official_centers||0)} · 회원 ${Number(x.members||0)}<br>7일 활동 ${Number(x.week_activities||0)} · 미활동센터 ${Number(x.inactive_centers||0)} · 승인대기 ${Number(x.pending_submissions||0)}</small></article>`).join('')||'<p class="muted">국가 데이터가 없습니다.</p>';const q=$('q').value.trim().toLowerCase(),f=$('filter').value,now=Date.now();const rows=(data.centers||[]).filter(x=>{if(q&&![x.name,x.region_name,x.center_code,x.designation_code,x.country_code].some(v=>String(v||'').toLowerCase().includes(q)))return false;if(f==='attention'&&!x.needs_attention)return false;if(f==='official'&&x.designation_status!=='official')return false;if(f==='unassigned'&&x.designation_status==='official')return false;if(f==='inactive'&&x.last_activity&&now-new Date(x.last_activity).getTime()<7*86400000)return false;if(f==='pending'&&Number(x.pending_submissions||0)<1)return false;return true});$('centers').innerHTML=rows.map(x=>`<article class="center ${x.needs_attention?'warn':''}"><div><b>${esc(x.name)}</b><small>${esc(x.center_code)} · ${esc(x.country_code||'--')} ${esc(x.region_name||'')}</small><span class="tag ${x.designation_status==='official'?'official':'warn'}">${x.designation_status==='official'?'✓ '+esc(x.designation_code):'공식 미지정'}</span></div><div><b>${Number(x.members||0)}</b><small>회원</small></div><div><b>${Number(x.week_activities||0)}</b><small>7일 활동</small></div><div class="optional"><b>${Number(x.pending_submissions||0)}</b><small>승인대기</small></div><div class="optional"><b>${x.level_no?'L'+Number(x.level_no):'-'}</b><small>${esc(x.level_name||'평가 미저장')}</small></div></article>`).join('')||'<p class="muted">조건에 맞는 성장기지가 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_hq_growth_base_network_command',{});$('loginBox').hidden=true;draw();$('msg').textContent=''}catch(e){console.error(e);$('msg').textContent='본부 관리자 권한을 확인해 주세요.'}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 본부 권한을 확인해 주세요.'}};$('refresh').onclick=load;$('q').oninput=draw;$('filter').onchange=draw;if(SparkData.isSignedIn())load()})();</script></body></html>
