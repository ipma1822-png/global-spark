<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 책임권역 운영센터 · GB-28 v3.44.0</title><link rel="stylesheet" href="assets/css/style.css?v=3440"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.card,.login{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.muted,small{color:#9fb2ce}.tag,.ver{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff}.risk{border-color:#ff6b6b88}.watch{border-color:#ffd16688}.grid{display:grid;gap:10px}input{padding:10px;border-radius:10px;border:1px solid #ffffff22;background:#081225;color:#fff}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · 책임권역 운영센터</div><div class="ver">GB-28 · v3.44.0</div></header><section class="panel"><small>SCOPED OPERATIONAL RESPONSIBILITY</small><h1>국가·지역 관리자 운영책임</h1><p class="muted">국가관리자는 담당 국가 전체를, 지역관리자는 담당 지역만 확인합니다. HQ는 전체를 같은 화면에서 볼 수 있습니다.</p><div class="tools"><span id="role" class="tag">권한 확인 중</span><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>운영 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📊 내 책임권역</h2><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🎯 관리가 필요한 성장기지</h2><div id="centers" class="grid"></div></section></main><script src="assets/js/config.js?v=3440"></script><script src="assets/js/spark-data.js?v=3440"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function roleText(c){if(c.role==='hq')return'HQ · 전 세계';return(c.scopes||[]).map(x=>x.role==='country_admin'?`국가관리자 · ${x.country_code}`:`지역관리자 · ${x.country_code} / ${x.region_name}`).join(' · ')}function draw(d){$('role').textContent=roleText(d.role_context||{});const s=d.summary||{};$('stats').innerHTML=[['성장기지',s.centers],['공식 성장기지',s.official_centers],['주의 필요',s.attention_centers],['미해결 알림',s.open_alerts],['진행 업무',s.open_tasks],['기한초과',s.overdue_tasks],['온보딩 신호',s.onboarding_signals]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('');const rows=(d.centers||[]).filter(c=>c.needs_attention);$('centers').innerHTML=rows.map(c=>`<article class="card ${c.health_score<50?'risk':c.health_score<65?'watch':''}"><div class="head"><div><b>${esc(c.name)}</b><small>${esc(c.country_code)} · ${esc(c.region_name||'')}</small></div><span class="tag">건강도 ${Number(c.health_score||0)}점</span></div><p>알림 ${c.open_alerts||0} · 업무 ${c.open_tasks||0} · 기한초과 ${c.overdue_tasks||0} · 온보딩신호 ${c.onboarding_signals||0}</p><small>정기평가 ${esc(c.periodic_status)} · 재인증 ${esc(c.recertification_status)} · 7일 활동 ${c.activities_7d||0}건 · 회원 ${c.members||0}명</small><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary" href="center-health.html?center=${encodeURIComponent(c.center_code)}">건강도</a><a class="btn secondary" href="operational-alerts.html">알림</a><a class="btn secondary" href="operational-tasks.html">업무</a><a class="btn secondary" href="center-onboarding.html?center=${encodeURIComponent(c.center_code)}">온보딩</a></div></article>`).join('')||'<p class="muted">현재 책임권역에서 우선 지원이 필요한 성장기지가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_scoped_operational_responsibility',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){console.error(e);$('msg').textContent='HQ·국가관리자·지역관리자 권한을 확인해 주세요.'}}$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
