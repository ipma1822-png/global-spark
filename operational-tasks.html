<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 운영업무 보드 · GB-14 v3.30.0</title><link rel="stylesheet" href="assets/css/style.css?v=3300"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools,.actions{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.task,.alertpick{margin-top:14px;padding:16px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.muted,.stat small,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.danger{background:#5d2730;color:#fff}.grid{display:grid;gap:10px}.task.overdue{border-color:#ff5c5caa}.task.high{border-color:#ff9f1c88}.task.critical{border-color:#ff5c5caa}.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:8px;margin-top:10px}.formgrid input,.formgrid select,textarea,select{padding:10px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff;box-sizing:border-box}.formgrid input,.formgrid select{width:100%}.history{margin-top:8px;font-size:13px}.assignee{word-break:break-all}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · OPERATIONS</div><div class="ver">GB-14 · v3.30.0</div></header><section class="panel"><small>OPERATIONAL TASK CENTER</small><h1>본부 운영업무 보드</h1><p class="muted">운영알림을 담당자·기한이 있는 실제 업무로 전환하고 시작·보류·완료·재배정·기한변경 이력을 관리합니다.</p><div class="tools"><div><a class="btn secondary" href="daily-briefing.html">☀️ 일일 브리핑</a> <a class="btn secondary" href="operational-alerts.html">🚨 알림센터</a></div><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>관리자 / 담당자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section id="createPanel" class="panel"><h2>➕ 알림에서 운영업무 만들기</h2><p class="muted">같은 미해결 알림에는 동시에 하나의 활성 업무만 만들 수 있습니다.</p><div id="alerts" class="grid"></div><div id="creator" hidden><div class="formgrid"><input id="taskTitle" placeholder="업무 제목"><select id="priority"><option value="medium">중요도 · 보통</option><option value="high">높음</option><option value="critical">긴급</option><option value="low">낮음</option></select><input id="due" type="datetime-local"><select id="assignee"></select></div><textarea id="desc" placeholder="업무 지시 또는 참고사항" style="width:100%;min-height:70px;margin-top:8px"></textarea><div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="secondary" id="cancelCreate">취소</button><button id="createTask">업무 배정</button></div></div></section><section class="panel"><div class="head"><h2>📋 운영업무</h2><select id="filter"><option value="active">미완료</option><option value="mine">내 담당</option><option value="overdue">기한초과</option><option value="all">전체</option><option value="done">완료</option></select></div><div id="tasks" class="grid"></div></section></main><script src="assets/js/config.js?v=3300"></script><script src="assets/js/spark-data.js?v=3300"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let board={summary:{},tasks:[]},alerts={alerts:[]},selected=null,myId=null;function fmt(d){return d?new Date(d).toLocaleString():'기한 없음'}function drawStats(){const s=board.summary||{};$('stats').innerHTML=[['대기',s.todo],['진행중',s.in_progress],['보류',s.blocked],['기한초과',s.overdue],['완료',s.done]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('')}function drawAlerts(){const rows=(alerts.alerts||[]).filter(a=>!['resolved','dismissed'].includes(a.status));$('alerts').innerHTML=rows.map(a=>`<article class="alertpick"><div><span class="tag">${esc(a.severity)}</span> <b>${esc(a.center_name)}</b> · ${esc(a.country_code)} ${esc(a.region_name||'')}</div><h3>${esc(a.title)}</h3><button onclick="chooseAlert('${a.id}')">이 알림을 업무로 배정</button></article>`).join('')||'<p class="muted">업무로 전환할 미해결 알림이 없습니다.</p>'}function drawTasks(){const f=$('filter').value;const rows=(board.tasks||[]).filter(t=>f==='all'||(f==='active'&&!['done','cancelled'].includes(t.status))||(f==='done'&&t.status==='done')||(f==='overdue'&&t.overdue)||(f==='mine'&&t.assigned_to===myId));$('tasks').innerHTML=rows.map(t=>`<article class="task ${esc(t.priority)} ${t.overdue?'overdue':''}"><div class="head"><div><span class="tag">${esc(t.priority)}</span><span class="tag">${esc(t.status)}</span>${t.overdue?'<span class="tag">기한초과</span>':''} <b>${esc(t.center_name)}</b></div><small>${esc(t.center_code)}</small></div><h3>${esc(t.title)}</h3><p>${esc(t.description||'')}</p><div class="assignee"><small>담당 ${esc(t.assignee_email)} · 기한 ${esc(fmt(t.due_at))}</small></div><div class="actions" style="justify-content:flex-start;margin-top:10px"><button onclick="taskAct('${t.id}','start')">시작</button><button class="secondary" onclick="taskAct('${t.id}','block')">보류</button><button onclick="taskAct('${t.id}','complete')">완료</button><button class="secondary" onclick="taskAct('${t.id}','reopen')">재오픈</button><button class="secondary" onclick="addNote('${t.id}')">메모</button><button class="secondary" onclick="reschedule('${t.id}')">기한변경</button>${t.alert_id?`<button class="secondary" onclick="reassign('${t.id}','${t.alert_id}')">담당변경</button>`:''}<button class="secondary" onclick="historyView('${t.id}')">이력</button></div><div id="history-${t.id}" class="history muted"></div></article>`).join('')||'<p class="muted">표시할 운영업무가 없습니다.</p>'}async function load(){try{board=await SparkData.rpc('spark_operational_task_center',{});$('loginBox').hidden=true;try{alerts=await SparkData.rpc('spark_operational_alert_center',{});$('createPanel').hidden=false}catch(e){alerts={alerts:[]};$('createPanel').hidden=true}const sess=SparkData.readSession?.();myId=sess?.user?.id||null;drawStats();drawAlerts();drawTasks()}catch(e){console.error(e);$('msg').textContent='운영업무 권한 또는 로그인을 확인해 주세요.'}}window.chooseAlert=async id=>{selected=(alerts.alerts||[]).find(a=>a.id===id);if(!selected)return;try{const people=await SparkData.rpc('spark_operational_task_assignees',{p_alert_id:id});$('taskTitle').value=selected.title;$('priority').value=['critical','high'].includes(selected.severity)?selected.severity:'medium';const dt=new Date(Date.now()+24*60*60*1000);dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());$('due').value=dt.toISOString().slice(0,16);$('assignee').innerHTML=(people||[]).map(p=>`<option value="${p.user_id}">${esc(p.role_label)} · ${esc(p.email)}</option>`).join('');$('creator').hidden=false;$('creator').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){alert('담당자 후보를 불러오지 못했습니다.')}};$('cancelCreate').onclick=()=>{$('creator').hidden=true;selected=null};$('createTask').onclick=async()=>{if(!selected)return;try{const due=$('due').value?new Date($('due').value).toISOString():null;await SparkData.rpc('spark_operational_task_create',{p_alert_id:selected.id,p_title:$('taskTitle').value.trim(),p_description:$('desc').value.trim()||null,p_assignee_user_id:$('assignee').value,p_due_at:due,p_priority:$('priority').value});$('creator').hidden=true;selected=null;$('desc').value='';await load()}catch(e){alert(String(e?.message||e).includes('ACTIVE_TASK_ALREADY_EXISTS')?'이 알림에는 이미 진행 중인 운영업무가 있습니다.':'업무 배정에 실패했습니다.')}};window.taskAct=async(id,action)=>{let note='';if(['block','complete'].includes(action))note=prompt(action==='complete'?'완료 내용을 입력해 주세요.':'보류 이유를 입력해 주세요.')||'';if(action==='complete'&&!note)return;try{await SparkData.rpc('spark_operational_task_action',{p_task_id:id,p_action:action,p_note:note||null,p_assignee_user_id:null,p_due_at:null});await load()}catch(e){alert('업무 상태 변경에 실패했습니다.')}};window.addNote=async id=>{const note=prompt('업무 메모를 입력해 주세요.');if(!note)return;try{await SparkData.rpc('spark_operational_task_action',{p_task_id:id,p_action:'note',p_note:note,p_assignee_user_id:null,p_due_at:null});await load()}catch(e){alert('메모 저장에 실패했습니다.')}};window.reschedule=async id=>{const v=prompt('새 기한을 입력해 주세요. 예: 2026-09-10 18:00');if(!v)return;const d=new Date(v);if(Number.isNaN(d.getTime())){alert('날짜 형식을 확인해 주세요.');return}try{await SparkData.rpc('spark_operational_task_action',{p_task_id:id,p_action:'reschedule',p_note:'기한 변경',p_assignee_user_id:null,p_due_at:d.toISOString()});await load()}catch(e){alert('기한 변경에 실패했습니다.')}};window.reassign=async(id,alertId)=>{try{const people=await SparkData.rpc('spark_operational_task_assignees',{p_alert_id:alertId});const text=(people||[]).map((p,i)=>`${i+1}. ${p.role_label} · ${p.email}`).join('\n');const n=Number(prompt('새 담당자 번호를 입력해 주세요.\n'+text));const p=people?.[n-1];if(!p)return;await SparkData.rpc('spark_operational_task_action',{p_task_id:id,p_action:'reassign',p_note:'담당자 변경',p_assignee_user_id:p.user_id,p_due_at:null});await load()}catch(e){alert('담당자 변경에 실패했습니다.')}};window.historyView=async id=>{try{const h=await SparkData.rpc('spark_operational_task_history',{p_task_id:id});$('history-'+id).innerHTML=(h||[]).map(x=>`<div>• ${esc(x.action_type)} · ${esc(x.actor_email)} · ${esc(x.note||'메모 없음')} · ${new Date(x.created_at).toLocaleString()}</div>`).join('')||'이력이 없습니다.'}catch(e){$('history-'+id).textContent='이력을 불러오지 못했습니다.'}};$('filter').onchange=drawTasks;$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
