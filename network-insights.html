<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 국가·지역 성장분석 · GB-11 v3.27.0</title><link rel="stylesheet" href="assets/css/style.css?v=3270"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel,.login{margin-top:15px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{padding:14px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat b{display:block;font-size:28px}.muted,.stat small,.card small{color:#9fb2ce}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:9px}.row{padding:13px;border-radius:14px;background:#0a1428;border:1px solid #ffffff12}.row.good{border-color:#54df8866}.row.warn{border-color:#ff9f1c88}.score{font-size:22px;font-weight:900}.btn,.login button{padding:11px 14px;border:0;border-radius:11px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.login input{padding:11px;border-radius:11px;border:1px solid #ffffff1a;background:#091326;color:#fff}.report{font-size:18px;line-height:1.6}.region{display:grid;grid-template-columns:1.2fr repeat(4,.7fr);gap:8px;align-items:center}.region+.region{margin-top:8px}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#172743;font-size:11px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.region{grid-template-columns:1.2fr 1fr 1fr}.optional{display:none}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.region{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · INSIGHTS</div><div class="ver">GB-11 · v3.27.0</div></header><section class="panel"><small>COUNTRY · REGION GROWTH INTELLIGENCE</small><h1>국가·지역 성장분석 · 자동보고</h1><p class="muted">HQ는 세계 전체, 국가관리자는 자기 국가, 지역관리자는 자기 지역만 분석합니다. 최근 7일 활동·참여율·증가율·LEVEL·승인상태를 함께 봅니다.</p><div class="tools"><a class="btn secondary" href="network-command.html">← 국가·지역 관제</a><button id="refresh" class="btn">보고서 새로 생성</button></div></section><section id="loginBox" class="login"><b>관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📝 자동 운영보고</h2><div id="report" class="report muted">로그인 후 자동 생성됩니다.</div></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><div class="grid"><section class="panel"><h2>🏅 우수 성장기지 후보</h2><div id="excellent" class="list"></div></section><section class="panel"><h2>🛟 지원 필요 성장기지</h2><div id="support" class="list"></div></section></div><section class="panel"><h2>🌐 국가·지역별 성장지표</h2><div id="regions"></div></section></main><script src="assets/js/config.js?v=3270"></script><script src="assets/js/spark-data.js?v=3270"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={summary:{},excellent:[],support:[],regions:[]};function centerRow(x,type){return `<article class="row ${type}"><div><b>${esc(x.name)}</b> <span class="tag">${esc(x.country_code)} ${esc(x.region_name||'')}</span></div><div class="score">운영점수 ${Number(x.operation_score||0)}</div><small>참여율 ${Number(x.participation_rate||0)}% · 7일 활동 ${Number(x.activities_7d||0)} · 전주대비 ${Number(x.growth_rate||0)}% · 승인대기 ${Number(x.pending_submissions||0)} · ${x.level_no?'LEVEL '+x.level_no:'LEVEL 평가 미저장'}</small></article>`}function draw(){const s=data.summary||{};$('report').textContent=data.report_text||'보고서가 없습니다.';$('stats').innerHTML=[['담당 국가',s.countries],['담당 지역',s.regions],['성장기지',s.centers],['활성 회원',s.members],['7일 활동',s.activities_7d],['우수 후보',s.excellent_candidates],['지원 필요',s.support_needed]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('');$('excellent').innerHTML=(data.excellent||[]).map(x=>centerRow(x,'good')).join('')||'<p class="muted">현재 기준을 충족한 후보가 없습니다.</p>';$('support').innerHTML=(data.support||[]).map(x=>centerRow(x,'warn')).join('')||'<p class="muted">지원 필요 신호가 없습니다.</p>';$('regions').innerHTML=(data.regions||[]).map(x=>`<article class="row region"><div><b>${esc(x.country_code)} · ${esc(x.region_name||'지역 미지정')}</b><small>${Number(x.centers||0)}개 성장기지 · ${Number(x.members||0)}명</small></div><div><b>${Number(x.avg_operation_score||0)}</b><small>평균 운영점수</small></div><div><b>${Number(x.avg_participation_rate||0)}%</b><small>평균 참여율</small></div><div class="optional"><b>${Number(x.excellent_centers||0)}</b><small>우수 후보</small></div><div class="optional"><b>${Number(x.support_centers||0)}</b><small>지원 필요</small></div></article>`).join('')||'<p class="muted">지역 데이터가 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_scoped_growth_insights',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='HQ·국가관리자·지역관리자 권한을 확인해 주세요.'}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 운영권한을 확인해 주세요.'}};$('refresh').onclick=load;if(SparkData.isSignedIn())load()})();</script></body></html>
