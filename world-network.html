<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 세계 성장기지 네트워크 · GB-09 v3.25.0</title><link rel="stylesheet" href="assets/css/style.css?v=3250"><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#16375e,#09152c 36%,#071126);color:#fff}.wrap{max-width:1120px;margin:auto;padding:18px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel{margin-top:15px;padding:20px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.hero h1{font-size:clamp(30px,5vw,56px);margin:8px 0}.hero p,.tiny{color:#aebfd7;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.country,.base{padding:16px;border-radius:17px;background:#0a1428;border:1px solid #ffffff12}.stat b{display:block;font-size:30px}.stat small,.base small,.country small{color:#9fb2ce}.countries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.country b,.base b{display:block;margin-bottom:6px}.official{display:inline-block;padding:5px 8px;border-radius:999px;background:#173b2d;color:#91f0bb;font-size:11px;font-weight:900}.empty{padding:28px;text-align:center;color:#aebfd7;border:1px dashed #ffffff24;border-radius:18px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:220px;padding:12px;border-radius:12px;border:1px solid #ffffff1c;background:#091326;color:#fff}.tools button,.btn{padding:11px 14px;border:0;border-radius:12px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}@media(max-width:760px){.countries{grid-template-columns:repeat(2,1fr)}.bases{grid-template-columns:1fr}}@media(max-width:480px){.countries,.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><div class="ver">GB-09 · v3.25.0</div></header><section class="panel hero"><small>WORLD OFFICIAL GROWTH BASE NETWORK</small><h1>세계 성장기지 네트워크</h1><p>GLOBAL SPARK 본부가 공식 지정한 성장기지만 공개합니다. 국가와 지역 단위의 안전한 정보만 보여주며 아이·연락처·정확한 위치는 공개하지 않습니다.</p><div class="tools"><input id="q" placeholder="국가코드·지역·성장기지 이름 검색"><button id="go">찾기</button><a class="btn secondary" href="growth-base.html">공식지정번호 조회</a></div></section><section class="panel"><div class="stats"><div class="stat"><small>공식 성장기지</small><b id="centerCount">-</b></div><div class="stat"><small>참여 국가</small><b id="countryCount">-</b></div></div></section><section class="panel"><h2>🌐 국가별 네트워크</h2><div id="countries" class="countries"><div class="empty">불러오는 중…</div></div></section><section class="panel"><h2>🏫 공식 성장기지</h2><div id="bases" class="bases"><div class="empty">불러오는 중…</div></div></section></main><script src="assets/js/config.js?v=3250"></script><script>(()=>{const cfg=window.SPARK_CONFIG||{},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={countries:[],centers:[]};async function rpc(){const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/spark_public_world_growth_base_network',{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw new Error(await r.text());return r.json()}function draw(){const q=$('q').value.trim().toLowerCase(),centers=(data.centers||[]).filter(x=>!q||[x.name,x.country_code,x.region_name,x.designation_code].some(v=>String(v||'').toLowerCase().includes(q))),countryCodes=new Set(centers.map(x=>x.country_code));$('centerCount').textContent=Number(data.official_centers||0).toLocaleString();$('countryCount').textContent=Number(data.countries_count||0).toLocaleString();$('countries').innerHTML=(data.countries||[]).filter(x=>!q||countryCodes.has(x.country_code)||String(x.country_code).toLowerCase().includes(q)).map(x=>`<article class="country"><b>🌍 ${esc(x.country_code)}</b><small>공식 성장기지 ${Number(x.centers||0)}곳${x.top_level?` · 최고 LEVEL ${Number(x.top_level)}`:''}${x.avg_quality!=null?` · 평균품질 ${Number(x.avg_quality)}`:''}</small></article>`).join('')||'<div class="empty">현재 공개 가능한 공식 성장기지가 없습니다.</div>';$('bases').innerHTML=centers.map(x=>`<article class="base"><span class="official">✓ OFFICIAL</span><h3>${esc(x.name)}</h3><b>${esc(x.designation_code)}</b><small>${esc(x.country_code)} · ${esc(x.region_name||'지역 미지정')}<br>${x.level_no?`LEVEL ${Number(x.level_no)} · `:''}${esc(x.level_name||'평가 미저장')}</small><p><a class="btn secondary" href="growth-base.html?code=${encodeURIComponent(x.designation_code)}">공식조회</a></p></article>`).join('')||'<div class="empty">검색 조건에 맞는 공식 성장기지가 없습니다.</div>'}async function load(){try{data=await rpc();draw()}catch(e){console.error(e);$('countries').innerHTML=$('bases').innerHTML='<div class="empty">세계 성장기지 네트워크를 불러오지 못했습니다.</div>'}}$('go').onclick=draw;$('q').addEventListener('input',draw);load()})();</script></body></html>
