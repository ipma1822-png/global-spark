<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 통계·보고서 · GB-31 v3.47.0</title><link rel="stylesheet" href="assets/css/style.css?v=3470"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.card,.login{margin-top:14px;padding:16px;border-radius:18px;background:#0e1930;border:1px solid #ffffff15}.ver,.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.muted,small{color:#9fb2ce}.grid{display:grid;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;border-radius:14px;background:#0a1428}.stat b{display:block;font-size:23px}.btn,button,select{padding:10px 12px;border-radius:10px;border:0}.btn,button{background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}select{background:#172743;color:#fff}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="command-center.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · 통계·보고서</div><div class="ver">GB-31 · v3.47.0</div></header><section class="panel"><small>SCOPED OPERATIONAL REPORTS</small><h1>일간·주간·월간·연간 보고서</h1><p class="muted">HQ·국가·지역·성장기지 권한범위에 따라 저장된 운영 스냅샷을 조회합니다.</p><div class="tools"><select id="period"><option value="">전체 기간</option><option value="daily">일간</option><option value="weekly">주간</option><option value="monthly">월간</option><option value="yearly">연간</option></select><button id="reload">보고서 새로고침</button></div></section><section id="loginBox" class="login"><b>운영 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📚 저장 보고서</h2><div id="reports" class="grid"><p class="muted">로그인 후 조회합니다.</p></div></section></main><script src="assets/js/config.js?v=3470"></script><script src="assets/js/spark-data.js?v=3470"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const label={daily:'일간',weekly:'주간',monthly:'월간',yearly:'연간'};function draw(rows){$('reports').innerHTML=(rows||[]).map(r=>{const m=r.metrics||{};return `<article class="card"><div class="head"><div><span class="tag">${label[r.period_type]||esc(r.period_type)}</span> <b>${esc(r.scope_label)}</b><small>${esc(r.scope_type)} · ${esc(r.scope_key)}</small></div><div>${esc(r.period_start)} ~ ${esc(r.period_end)}</div></div><div class="stats"><div class="stat"><small>성장기지</small><b>${Number(m.centers||0)}</b></div><div class="stat"><small>활동</small><b>${Number(m.activities||0).toLocaleString()}</b></div><div class="stat"><small>참여자</small><b>${Number(m.participants||0).toLocaleString()}</b></div><div class="stat"><small>XP</small><b>${Number(m.xp_net||0).toLocaleString()}</b></div><div class="stat"><small>캠페인 활동</small><b>${Number(m.campaign_actions||0)}</b></div><div class="stat"><small>운영알림</small><b>${Number(m.alerts_detected||0)}</b></div><div class="stat"><small>완료업무</small><b>${Number(m.tasks_completed||0)}</b></div><div class="stat"><small>평균 건강도</small><b>${m.avg_health_score??'-'}</b></div></div><p>${esc(r.summary_text||'')}</p><small>생성 ${new Date(r.generated_at).toLocaleString()}</small></article>`}).join('')||'<p class="muted">조회 가능한 보고서가 없습니다.</p>'}async function load(){try{const rows=await SparkData.rpc('spark_scoped_reports',{p_period_type:$('period').value||null,p_limit:80});$('loginBox').hidden=true;$('msg').textContent='';draw(rows)}catch(e){console.error(e);$('msg').textContent='HQ·국가·지역 관리자 또는 성장기지 STAFF 권한을 확인해 주세요.'}}$('reload').onclick=load;$('period').onchange=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
