<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 일일 운영 브리핑 · GB-14 v3.30.0</title><link rel="stylesheet" href="assets/css/style.css?v=3300"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 11px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a}.panel,.login{margin-top:15px;padding:18px;border-radius:22px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.brief,.priority{padding:14px;border-radius:16px;background:#0a1428;border:1px solid #ffffff12}.stat b{display:block;font-size:28px}.muted,.stat small,.brief small,.priority small{color:#9fb2ce}.briefings,.priorities{display:grid;gap:10px}.priority.critical{border-color:#ff5c5caa}.priority.high{border-color:#ff9f1c88}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;background:#172743;margin-right:5px}.btn,.login button{padding:11px 14px;border:0;border-radius:11px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:white;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · HQ BRIEFING</div><div class="ver">GB-14 · v3.30.0</div></header><section class="panel"><small>DAILY OPERATIONS BRIEFING</small><h1>본부 일일 운영 브리핑</h1><p class="muted">매일 한국시간 오전 8시에 위험신호를 갱신하고 HQ·국가·지역별 운영 브리핑을 자동 생성합니다.</p><div class="tools"><div><a class="btn secondary" href="operational-alerts.html">🚨 알림센터</a> <a class="btn secondary" href="operational-tasks.html">📋 운영업무</a> <a class="btn secondary" href="network-insights.html">📊 성장분석</a></div><button id="refreshBrief" class="btn">오늘 브리핑 다시 생성</button></div></section><section id="loginBox" class="login"><b>관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div class="head"><div><small>TODAY</small><h2 id="date">-</h2></div><span class="tag">KST 08:00 자동생성</span></div><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>📌 오늘의 우선 확인</h2><div id="priorities" class="priorities"></div></section><section class="panel"><h2>🌏 권한범위 브리핑</h2><div id="briefings" class="briefings"></div></section></main><script src="assets/js/config.js?v=3300"></script><script src="assets/js/spark-data.js?v=3300"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={briefings:[]};function label(b){return b.scope_type==='hq'?'HQ · 전 세계':b.scope_type==='country'?`국가 · ${b.country_code}`:`지역 · ${b.country_code} / ${b.region_name||'-'}`}function draw(){const rows=data.briefings||[];$('date').textContent=data.briefing_date||'-';const primary=rows[0]||{},s=primary.summary||{};$('stats').innerHTML=[['성장기지',s.centers],['활성회원',s.members],['7일 활동',s.activities_7d],['미해결 알림',s.open_alerts],['긴급',s.critical],['HIGH',s.high],['주의 센터',s.attention_centers],['24h 미해결',s.unresolved_24h]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0).toLocaleString()}</b></div>`).join('');const ps=primary.priorities||[];$('priorities').innerHTML=ps.map(p=>`<article class="priority ${esc(p.severity)}"><div><span class="tag">${esc(p.severity)}</span><b>${esc(p.center_name)}</b> · ${esc(p.country_code)} ${esc(p.region_name||'')}</div><h3>${esc(p.title)}</h3><small>${new Date(p.detected_at).toLocaleString()}</small></article>`).join('')||'<p class="muted">오늘 우선 확인할 미해결 알림이 없습니다.</p>';$('briefings').innerHTML=rows.map(b=>`<article class="brief"><div class="head"><div><span class="tag">${esc(label(b))}</span><b>${esc(b.briefing_date)}</b></div><small>${new Date(b.generated_at).toLocaleString()}</small></div><p>${esc(b.report_text)}</p></article>`).join('')||'<p class="muted">오늘 생성된 브리핑이 없습니다.</p>'}async function load(){try{data=await SparkData.rpc('spark_daily_briefing_center',{});$('loginBox').hidden=true;$('msg').textContent='';draw()}catch(e){console.error(e);$('msg').textContent='HQ·국가관리자·지역관리자 권한을 확인해 주세요.'}}$('refreshBrief').onclick=async()=>{try{await SparkData.rpc('spark_refresh_my_daily_briefing',{});await load()}catch(e){alert('브리핑 생성에 실패했습니다.')}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 또는 운영권한을 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
