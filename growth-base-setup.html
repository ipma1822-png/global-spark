<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 성장기지 개설 마법사</title><link rel="stylesheet" href="assets/css/style.css?v=3590"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel,.step{margin-top:14px;padding:18px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.muted,small{color:#9fb2ce}.btn,button{display:inline-block;padding:11px 14px;border:0;border-radius:11px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input{padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#091326;color:#fff}.centers{display:grid;gap:10px}.center{padding:15px;border-radius:15px;background:#091326;border:1px solid #ffffff14}.steps{display:grid;gap:10px}.step{margin-top:0}.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ff9f1c;color:#071126;font-weight:950}.bar{height:14px;border-radius:999px;background:#081326;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#ff9f1c,#ffd166);width:0}.done{border-color:#55d87b77}.done .num{background:#55d87b}.version{display:none}@media(max-width:650px){.login{grid-template-columns:1fr}.row{align-items:flex-start}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><a class="btn secondary" href="growth-base-status.html">신청상태 조회</a></header><section class="panel"><small>GS-07 · 5–10 MINUTE SETUP</small><h1>공식 성장기지 개설 마법사</h1><p class="muted">본부 승인을 받고 대표자 계정이 연결되었다면 여기서 운영 준비를 시작하세요. 기존 운영기능을 새로 만드는 화면이 아니라, 이미 준비된 기능을 올바른 순서로 안내합니다.</p></section><section class="panel" id="loginBox"><h2>1. 대표자 · 지도자 로그인</h2><div class="login"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel" id="choose" hidden><h2>2. 개설할 성장기지 선택</h2><div id="centers" class="centers"></div></section><section class="panel" id="wizard" hidden><div class="row"><div><small>선택된 성장기지</small><h2 id="centerName">-</h2><p id="centerCode" class="muted"></p></div><div><b id="pct" style="font-size:32px">0%</b><small>준비 진행</small></div></div><div class="bar"><div id="bar"></div></div><p class="muted" id="progress"></p><div class="steps" id="steps"></div></section><div class="version">GS-07 · v3.59.0</div></main><script src="assets/js/config.js?v=3590"></script><script src="assets/js/spark-data.js?v=3590"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected='';async function loadCenters(){try{const rows=await SparkData.getMyCenters();$('loginBox').hidden=true;$('choose').hidden=false;$('centers').innerHTML=rows.length?rows.map(c=>`<div class="center row"><div><b>${esc(c.name)}</b><br><small>${esc(c.center_code)} · ${esc(c.role)}</small></div><button data-code="${esc(c.center_code)}" data-name="${esc(c.name)}">이 성장기지 개설하기</button></div>`).join(''):'<p class="muted">현재 계정에 연결된 성장기지가 없습니다. 본부 승인 후 대표자 계정 연결이 필요합니다.</p>'}catch(e){$('msg').textContent='성장기지 정보를 불러오지 못했습니다.'}}async function openWizard(code,name){selected=code;$('centerName').textContent=name;$('centerCode').textContent=code;$('wizard').hidden=false;try{const d=await SparkData.rpc('spark_center_onboarding_status',{p_center_code:code}),p=d.progress||{},steps=d.steps||[];$('pct').textContent=(p.percent||0)+'%';$('bar').style.width=(p.percent||0)+'%';$('progress').textContent=`${p.done||0} / ${p.total||7} 단계 완료 · 실제 데이터가 생기면 자동 반영됩니다.`;$('steps').innerHTML=steps.map((s,i)=>`<article class="step ${s.done?'done':''}"><div class="row"><div style="display:flex;gap:12px"><div class="num">${s.done?'✓':i+1}</div><div><small>${s.done?'준비 완료':'다음 준비'}</small><h3>${esc(s.title)}</h3>${typeof s.count==='number'?`<small>현재 ${s.count}건</small>`:''}</div></div><div>${s.href?`<a class="btn secondary" href="${esc(s.href)}">바로 준비</a>`:''}${s.manual&&!s.done?` <button data-step="${esc(s.key)}">준비 확인</button>`:''}</div></div></article>`).join('')+'<article class="step"><div class="row"><div><small>마지막</small><h3>🔥 성장기지 모바일 HOME에서 운영 시작</h3></div><a class="btn" href="center-mobile-home.html?center='+encodeURIComponent(code)+'">운영 시작</a></div></article>';$('wizard').scrollIntoView({behavior:'smooth'})}catch(e){$('wizard').hidden=true;alert(String(e?.message||e).includes('CENTER_NOT_OFFICIAL')?'이 성장기지는 아직 공식 지정 상태가 아닙니다. 신청상태를 먼저 확인해 주세요.':'온보딩 정보를 불러오지 못했습니다.')}}$('centers').onclick=e=>{const b=e.target.closest('button[data-code]');if(b)openWizard(b.dataset.code,b.dataset.name)};$('steps').onclick=async e=>{const b=e.target.closest('button[data-step]');if(!b)return;if(!confirm('이 준비항목을 완료로 확인할까요?'))return;try{await SparkData.rpc('spark_center_onboarding_confirm',{p_center_code:selected,p_step:b.dataset.step});const name=$('centerName').textContent;await openWizard(selected,name)}catch(_){alert('확인 저장에 실패했습니다.')}};$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await loadCenters()}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())loadCenters()})();</script></body></html>
