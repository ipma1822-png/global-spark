<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 운영개선계획 · GB-19 v3.35.0</title><link rel="stylesheet" href="assets/css/style.css?v=3350"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1120px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.card,.login{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.action{padding:12px;border-radius:14px;background:#0a1428}.stat b{display:block;font-size:25px}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}.actions{display:grid;gap:8px;margin-top:12px}.action.done{opacity:.58}.score{font-size:34px;font-weight:900}.up{color:#8ef0b0}.down{color:#ff8d8d}input{padding:10px;border-radius:9px;border:1px solid #ffffff22;background:#071126;color:#fff}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="head"><div><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a> · RECOVERY</div><div class="ver">GB-19 · v3.35.0</div></header><section class="panel"><small>HEALTH RECOVERY PLAN</small><h1>운영건강도 개선계획</h1><p class="muted">낮은 운영지표를 자동으로 우선순위화하고, 30일 개선행동과 목표점수·회복폭을 추적합니다.</p><div class="tools"><div><a class="btn secondary" href="center-health.html">❤️ 운영건강도</a> <a class="btn secondary" href="operations-tasks.html">✅ 운영업무</a></div><button id="reload">새로고침</button></div></section><section id="loginBox" class="login"><b>관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🎯 개선계획</h2><div id="plans"></div></section></main><script src="assets/js/config.js?v=3350"></script><script src="assets/js/spark-data.js?v=3350"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dims={participation:'회원 참여',continuity:'활동 지속성',approval:'승인 처리',quality:'LEVEL 운영품질',admin_execution:'관리자 업무처리'};async function rpc(n,p={}){return SparkData.rpc(n,p)}function draw(d){const s=d.summary||{};$('stats').innerHTML=[['진행중',s.active],['회복중',s.improving],['기한초과',s.overdue],['완료',s.completed]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${Number(x[1]||0)}</b></div>`).join('');$('plans').innerHTML=(d.plans||[]).map(p=>{const delta=Number(p.score_delta||0),done=p.status==='completed';return `<article class="card"><div class="head"><div><b>${esc(p.center_name)}</b><small>${esc(p.center_code)} · ${esc(p.country_code)} ${esc(p.region_name||'')}</small></div><div><span class="tag">${esc(dims[p.priority_dimension]||p.priority_dimension)}</span> <span class="score">${Number(p.current_score||0)}</span> <b class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}</b></div></div><p>기준 <b>${p.baseline_score}</b> → 목표 <b>${p.target_score}</b> · 목표일 ${esc(p.target_date)} ${p.overdue?'· ⚠️ 기한초과':''}</p><div class="actions">${(p.actions||[]).map(a=>`<div class="action ${a.status==='done'?'done':''}"><div class="head"><div><b>${a.order}. ${esc(a.title)}</b><small>${esc(a.guidance||'')}</small></div><div>${a.status==='todo'?`<button onclick="act('${a.id}','start')">시작</button>`:''}${a.status==='in_progress'?`<button onclick="act('${a.id}','done')">완료</button>`:''}${a.status==='done'?`<button class="secondary" onclick="act('${a.id}','reopen')">다시 열기</button>`:''}</div></div></div>`).join('')}</div>${!done&&p.actions.every(a=>['done','skipped'].includes(a.status))?`<p><button onclick="closePlan('${p.id}')">개선계획 완료 · 회복폭 확인</button></p>`:''}</article>`}).join('')||'<p class="muted">현재 개선계획이 없습니다. 운영건강도 화면에서 개선계획을 생성할 수 있습니다.</p>'}async function load(){try{const d=await rpc('spark_scoped_improvement_plans');$('loginBox').hidden=true;draw(d)}catch(e){console.error(e);$('msg').textContent='로그인 또는 담당 권한을 확인해 주세요.'}}window.act=async(id,a)=>{try{await rpc('spark_center_improvement_action',{p_action_id:id,p_action:a,p_note:null});await load()}catch(e){alert(e.message||'처리하지 못했습니다.')}};window.closePlan=async id=>{const note=prompt('완료 메모를 입력하세요.','개선행동 완료');if(note===null)return;try{const r=await rpc('spark_center_improvement_plan_close',{p_plan_id:id,p_note:note});alert(`완료되었습니다. 기준 ${r.baseline_score}점 → 현재 ${r.current_score}점 (${r.score_delta>=0?'+':''}${r.score_delta})`);await load()}catch(e){alert(e.message||'완료 처리하지 못했습니다.')}};$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
