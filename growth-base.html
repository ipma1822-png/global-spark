<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 공식 성장기지 조회 · GB-07 v3.23.0</title><link rel="stylesheet" href="assets/css/style.css?v=3230"><style>body{background:#071126;color:#fff;margin:0}.wrap{max-width:960px;margin:auto;padding:18px}.head,.search{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ver{padding:7px 10px;border:1px solid #ffb34766;border-radius:999px;color:#ffd27a;font-size:12px}.panel{margin-top:14px;padding:18px;border:1px solid #ffffff18;border-radius:22px;background:#101a30}.search input{flex:1;min-width:240px;padding:13px;border-radius:12px;border:1px solid #ffffff20;background:#0b1528;color:#fff}.search button{border:0;border-radius:12px;padding:13px 16px;background:#ff9f1c;font-weight:900}.card{margin-top:14px;padding:18px;border-radius:18px;background:#0b1528;border:1px solid #ffffff14}.official{border-color:#6ee7a866}.revoked{border-color:#ff7b7b77}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.item{padding:12px;border-radius:14px;background:#ffffff08}.item small,.item b{display:block}.item small{color:#9fb2cb}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#183c2f;color:#8ff0bd;font-weight:900}.warn{background:#472424;color:#ffb4b4}.list{display:grid;gap:8px}.result-btn{display:block;width:100%;text-align:left;padding:13px;border-radius:14px;border:1px solid #ffffff15;background:#0b1528;color:#fff;cursor:pointer}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><small>🔥 GLOBAL SPARK · OFFICIAL VERIFICATION</small><h1>공식 성장기지 조회</h1></div><div class="ver">GB-07 · v3.23.0</div></header><section class="panel"><p>GLOBAL SPARK 본부가 공식 지정한 성장기지인지 <b>공식지정번호 GS-...</b>로 확인할 수 있습니다.</p><div class="search"><input id="q" placeholder="예: GS-KR-000001 또는 성장기지 이름"><button id="go">공식조회</button></div><div id="status"></div><div id="result"></div></section></main><script src="assets/js/config.js?v=3230"></script><script>(()=>{const $=id=>document.getElementById(id),cfg=window.SPARK_CONFIG||{},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(name,payload){const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());return r.json()}function show(d){const ok=d.designation_status==='official'&&d.certificate_status==='active';$('result').innerHTML=`<article class="card ${ok?'official':'revoked'}"><span class="badge ${ok?'':'warn'}">${ok?'✓ 공식 지정 성장기지':'⚠ 현재 공식 인증상태 확인 필요'}</span><h2>${esc(d.center_name||'')}</h2><div class="grid"><div class="item"><small>공식지정번호</small><b>${esc(d.designation_code||'-')}</b></div><div class="item"><small>공식인증서</small><b>${esc(d.certificate_no||'발급 대기')}</b></div><div class="item"><small>국가 · 지역</small><b>${esc(d.country_code||'')} · ${esc(d.region_name||'')}</b></div><div class="item"><small>지정일</small><b>${d.designated_at?new Date(d.designated_at).toLocaleDateString('ko-KR'):'-'}</b></div><div class="item"><small>현재 LEVEL</small><b>LEVEL ${Number(d.level_no||1)} · ${esc(d.level_name||'새싹 성장기지')}</b></div><div class="item"><small>운영품질</small><b>${Number(d.score||0)} / 100</b></div></div><p style="color:#9fb2cb">조회시각 ${new Date(d.verified_at).toLocaleString('ko-KR')}</p></article>`}async function exact(code){$('status').textContent='공식기록 확인 중…';$('result').innerHTML='';try{const rows=await rpc('spark_public_growth_base_lookup',{p_designation_code:code});if(!rows.length){$('status').textContent='해당 공식지정번호를 찾지 못했습니다.';return} $('status').textContent='';show(rows[0])}catch(e){console.error(e);$('status').textContent='공식조회에 실패했습니다.'}}async function search(){const q=$('q').value.trim();if(!q)return;if(/^GS-/i.test(q)){exact(q);return}try{const rows=await rpc('spark_public_growth_bases',{p_query:q});$('status').textContent=rows.length?`${rows.length}개 공식 성장기지`:'검색 결과가 없습니다.';$('result').innerHTML=`<div class="list">${rows.map(x=>`<button class="result-btn" data-code="${esc(x.designation_code)}"><b>${esc(x.center_name)}</b><br><small>${esc(x.designation_code)} · ${esc(x.country_code)} ${esc(x.region_name||'')} · LEVEL ${Number(x.level_no||1)}</small></button>`).join('')}</div>`}catch(e){$('status').textContent='검색에 실패했습니다.'}}$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('result').onclick=e=>{const b=e.target.closest('[data-code]');if(b){$('q').value=b.dataset.code;exact(b.dataset.code)}};const code=new URLSearchParams(location.search).get('code');if(code){$('q').value=code;exact(code)}})();</script></body></html>
