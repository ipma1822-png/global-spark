<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPARK CENTER · SELF RECORD · v3.11.0</title><link rel="stylesheet" href="assets/css/style.css?v=3110"><style>body{background:#070d1b;color:#fff}.wrap{max-width:1180px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.ver{font-size:12px;border:1px solid #9a6724;border-radius:999px;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.panel,.row{background:#11192b;border:1px solid #ffffff15;border-radius:16px}.stat{padding:12px}.stat small,.stat b{display:block}.stat b{font-size:22px;margin-top:4px}.panel{padding:15px;margin-top:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools input,.tools select{background:#0c1425;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:10px}.members{display:grid;gap:7px}.row{display:grid;grid-template-columns:1.2fr .7fr .7fr .8fr auto;gap:8px;align-items:center;padding:10px}.row small{display:block;opacity:.7}.ok{color:#8effbd}.off{color:#ffaeae}.btn{border:0;border-radius:11px;padding:9px 11px;font-weight:900}.issue{background:#ff9f1c}.revoke{background:#293650;color:#fff}.recent{display:grid;gap:7px}.recent .item{background:#0c1425;border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:10px}.note{padding:11px;border:1px solid #55c9ff30;border-radius:12px;background:#55c9ff0b;color:#cbeeff}.status{min-height:26px;color:#ffc56f;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.row .actions{grid-column:1/-1}.row .optional{display:none}}</style></head><body><div class="wrap"><header class="head"><div><small>🔥 GLOBAL SPARK · CENTER OPERATIONS</small><h1>아이 직접기록 운영판</h1></div><div class="ver">PHASE 3-11 · v3.11.0</div></header><div class="note">센터는 아이 대신 매일 수백 건을 입력하지 않습니다. 개인 링크를 발급하고, 아이들의 직접기록 흐름과 이상 여부만 관리합니다.</div><section id="stats" class="grid"><div class="stat"><small>불러오는 중</small><b>…</b></div></section><section class="panel"><div class="head"><div><small>PERSONAL LINK ADOPTION</small><h2>개인 링크 운영</h2></div><button id="refresh" class="btn revoke">새로고침</button></div><div class="tools"><input id="q" placeholder="아이 이름 검색"><select id="filter"><option value="all">전체</option><option value="linked">링크 있음</option><option value="unlinked">링크 없음</option><option value="used">최근 7일 사용</option><option value="self">최근 7일 직접기록</option></select></div><div id="members" class="members">불러오는 중…</div><div id="status" class="status"></div></section><section class="panel"><small>KID SELF RECORDS</small><h2>최근 아이 직접기록</h2><div id="recent" class="recent">불러오는 중…</div></section><p><a class="btn revoke" id="back" href="my-centers.html">← 나의 SPARK CENTER</a></p></div><script src="assets/js/config.js?v=3110"></script><script src="assets/js/spark-data.js?v=3110"></script><script>(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),center=new URLSearchParams(location.search).get('center')||'',fmt=v=>v?new Date(v).toLocaleString('ko-KR'):'사용 전';let data={members:[],recent:[],summary:{}};if(center)$('back').href='center.html?center='+encodeURIComponent(center);function draw(){const s=data.summary||{};$('stats').innerHTML=[['재원',s.active_members||0],['개인링크',s.active_kid_links||0],['7일 사용',s.links_used_7d||0],['오늘 직접기록',s.self_today||0],['7일 직접기록',s.self_7d||0],['7일 참여아이',s.self_members_7d||0]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');const q=$('q').value.trim(),f=$('filter').value,now=Date.now(),rows=(data.members||[]).filter(m=>{if(q&&!m.display_name.includes(q))return false;if(f==='linked'&&!m.link_active)return false;if(f==='unlinked'&&m.link_active)return false;if(f==='used'&&(!m.last_used_at||now-new Date(m.last_used_at)>7*864e5))return false;if(f==='self'&&!m.self_7d)return false;return true});$('members').innerHTML=rows.map(m=>`<div class="row"><div><b>${esc(m.display_name)}</b><small>${esc(m.member_code||'')}</small></div><div><b class="${m.link_active?'ok':'off'}">${m.link_active?'링크 있음':'링크 없음'}</b><small>${fmt(m.last_used_at)}</small></div><div><b>오늘 ${m.self_today||0}회</b><small>직접기록</small></div><div class="optional"><b>7일 ${m.self_7d||0}회</b><small>직접기록</small></div><div class="actions"><button class="btn issue" data-issue="${m.id}" data-name="${esc(m.display_name)}">${m.link_active?'링크 재발급':'링크 발급'}</button> ${m.link_active?`<button class="btn revoke" data-revoke="${m.id}">해제</button>`:''}</div></div>`).join('')||'조건에 맞는 회원이 없습니다.';$('recent').innerHTML=(data.recent||[]).map(r=>`<div class="item"><div><b>${esc(r.display_name)} · ${esc(r.label_ko)}</b><small>${esc(r.memo||'메모 없음')} · ${fmt(r.created_at)}</small></div><b>+${Number(r.xp||0)} XP</b></div>`).join('')||'아직 아이 직접기록이 없습니다.'}async function load(){if(!center){$('status').textContent='센터 코드가 없습니다.';return}try{data=await SparkData.rpc('spark_center_self_activity_monitor',{p_center_code:center});draw()}catch(e){console.error(e);$('status').textContent='센터 로그인 또는 권한을 확인해 주세요.'}}$('q').oninput=draw;$('filter').onchange=draw;$('refresh').onclick=load;$('members').onclick=async e=>{const issue=e.target.closest('[data-issue]'),rev=e.target.closest('[data-revoke]');if(issue){try{const r=await SparkData.rpc('spark_create_kid_link',{p_member_id:issue.dataset.issue}),row=Array.isArray(r)?r[0]:r;if(!row?.token)throw 0;const u=new URL('spark-room.html',location.href);u.search='';u.searchParams.set('kid',row.token);await navigator.clipboard.writeText(u.href);$('status').textContent=`${issue.dataset.name} 개인 링크 발급·복사 완료`;await load()}catch(_){$('status').textContent='개인 링크 발급 실패'}return}if(rev){try{await SparkData.rpc('spark_revoke_kid_link',{p_member_id:rev.dataset.revoke});$('status').textContent='개인 링크 해제 완료';await load()}catch(_){$('status').textContent='개인 링크 해제 실패'}}};await load()})();</script></body></html>
