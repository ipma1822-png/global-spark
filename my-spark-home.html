<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · MY SPARK</title><link rel="stylesheet" href="assets/css/style.css?v=3640"><style>:root{--bg:#071126;--panel:#0e1930;--card:#091326;--line:#ffffff16;--gold:#ff9f1c;--muted:#9fb2ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173c66,var(--bg) 42%);color:#fff;padding-bottom:80px}.wrap{max-width:760px;margin:auto;padding:14px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{color:#fff;text-decoration:none}.panel{margin-top:12px;padding:17px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}.hero{background:radial-gradient(circle at 10% 10%,#ff9f1c26,transparent 42%),var(--panel)}.muted,small{color:var(--muted)}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input,.select{padding:12px;border-radius:11px;background:var(--card);color:#fff;border:1px solid var(--line)}.btn,button{padding:11px 14px;border:0;border-radius:11px;background:var(--gold);color:#071126;font-weight:950;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.stat b{display:block;font-size:26px;margin-top:4px}.levelbar{height:14px;background:#071126;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.levelbar>div{height:100%;background:linear-gradient(90deg,#ffd166,#ff9f1c);width:0}.flames{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.flame{padding:13px 8px;border-radius:15px;background:var(--card);text-align:center;border:1px solid var(--line)}.flame b{display:block;font-size:24px}.flame strong{display:block;margin-top:3px;font-size:13px}.focus{border-color:#ffb34777;background:#ff9f1c10}.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.badge{padding:13px;border-radius:14px;background:var(--card);border:1px solid #ffd16645}.recent{display:grid;gap:8px}.recent>div{padding:13px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed #ffffff20;border-radius:14px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:#071126ee;border-top:1px solid var(--line);backdrop-filter:blur(10px)}.bottom a{text-align:center;color:#fff;text-decoration:none;padding:8px 3px;font-size:11px}.bottom b{display:block;font-size:20px}.version{display:none}@media(max-width:620px){.login{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.flames{grid-template-columns:repeat(2,1fr)}.flame:last-child{grid-column:1/-1}}@media(max-width:390px){.wrap{padding:9px}.panel{padding:14px}.stat{padding:11px}.stat b{font-size:22px}}</style></head><body><main class="wrap"><header class="head"><a class="brand" href="index.html">🔥 <b>GLOBAL SPARK</b></a><a class="btn secondary" href="family-spark.html">＋ SPARK 기록</a></header><section class="panel hero"><small>GS-12 · MY SPARK</small><h1>우리 아이의 성장이<br>한눈에 보입니다.</h1><p class="muted">점수만 보는 화면이 아니라, 어떤 좋은 행동이 쌓였고 다음에는 어떤 불꽃을 키우면 좋은지 확인합니다.</p></section><section class="panel" id="loginBox"><h2>부모 · 보호자 로그인</h2><div class="login"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel" id="picker" hidden><div class="row"><div><small>아이 선택</small><h2 style="margin:.2em 0">MY SPARK</h2></div><select id="child" class="select"></select></div></section><section id="dashboard" hidden><section class="panel"><div class="row"><div><small id="center">연결 성장기지</small><h2 id="name">-</h2></div><div style="text-align:right"><small>현재 LEVEL</small><b id="level" style="display:block;font-size:34px">1</b></div></div><div class="stats"><div class="stat"><small>총 XP</small><b id="xp">0</b></div><div class="stat"><small>좋은 행동</small><b id="actions">0</b></div><div class="stat"><small>배지</small><b id="badgeCount">0</b></div></div><p class="muted" id="nextText"></p><div class="levelbar"><div id="levelbar"></div></div></section><section class="panel"><div class="row"><div><small>5 FLAMES</small><h2>5대 불꽃</h2></div><small>균형 있게 키워요</small></div><div class="flames" id="flames"></div><p id="recommend" class="muted"></p></section><section class="panel"><h2>나의 배지</h2><div id="badges" class="badges"></div></section><section class="panel"><div class="row"><h2>최근 성장기록</h2><a class="btn secondary" href="family-spark.html">오늘 기록하기</a></div><div id="recent" class="recent"></div></section></section><div class="version">GS-12 · v3.64.0</div></main><nav class="bottom"><a href="index.html"><b>🏠</b>HOME</a><a href="my-spark-home.html"><b>🔥</b>MY SPARK</a><a href="family-spark.html"><b>✍️</b>기록</a><a href="family.html"><b>👨‍👩‍👧</b>가족</a></nav><script src="assets/js/config.js?v=3640"></script><script src="assets/js/spark-data.js?v=3640"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const flameMeta={GOOD:['❤️','착한 불꽃'],SAFE:['🛡️','안전 불꽃'],EARTH:['🌱','환경 불꽃'],CHALLENGE:['🚀','도전 불꽃'],CITIZEN:['🤝','함께 불꽃']},badgeMeta={FIRST_SPARK:'첫 SPARK',GROWING_25:'25 XP 성장',GROWING_50:'50 XP 성장',LEVEL_100:'100 XP LEVEL',ACTION_25:'좋은 행동 25회',FIVE_FLAMES:'5대 불꽃 완성',CAMPAIGN_ACTION:'캠페인 참여'};let children=[];async function loadChildren(){const h=await SparkData.rpc('spark_family_activity_home',{});children=(h.children||[]).filter(x=>x.linked);$('loginBox').hidden=true;$('picker').hidden=false;$('child').innerHTML=children.length?children.map(x=>`<option value="${x.child_id}">${esc(x.display_name)}</option>`).join(''):'<option value="">성장기지에 연결된 아이가 없습니다</option>';if(children.length)await loadDashboard()}function render(d){const g=d.growth||{},f=g.flames||{},badges=g.badges||[];$('dashboard').hidden=false;$('name').textContent=d.child?.display_name||'-';$('center').textContent='연결 성장기지 · '+(d.center?.name||'-');$('level').textContent=g.level||1;$('xp').textContent=Number(g.total_xp||0).toLocaleString();$('actions').textContent=Number(g.activity_count||0).toLocaleString();$('badgeCount').textContent=badges.length;const prev=(Number(g.level||1)-1)*100,next=Number(g.next_level_xp||100),xp=Number(g.total_xp||0),pct=Math.max(0,Math.min(100,((xp-prev)/(next-prev))*100));$('levelbar').style.width=pct+'%';$('nextText').textContent=`다음 LEVEL까지 ${Math.max(0,next-xp)} XP 남았습니다.`;$('flames').innerHTML=Object.keys(flameMeta).map(k=>`<div class="flame ${g.recommended_flame===k?'focus':''}"><b>${flameMeta[k][0]}</b><strong>${flameMeta[k][1]}</strong><small>${Number(f[k]||0)}회</small></div>`).join('');$('recommend').textContent=g.recommended_flame?`다음에는 “${flameMeta[g.recommended_flame]?.[1]||g.recommended_flame}” 활동을 하나 해보면 5대 불꽃이 더 균형 있게 자랍니다.`:'좋은 행동을 하나씩 시작해 보세요.';$('badges').innerHTML=badges.length?badges.map(b=>`<div class="badge">🏅 <b>${esc(badgeMeta[b.code]||b.code)}</b><br><small>${new Date(b.awarded_at).toLocaleDateString('ko-KR')}</small></div>`).join(''):'<div class="empty" style="grid-column:1/-1">첫 SPARK부터 배지가 시작됩니다. 🔥</div>';$('recent').innerHTML=(d.recent||[]).length?d.recent.map(r=>`<div><div class="row"><b>${esc(r.label)}</b><strong>+${Number(r.net_xp||0)} XP</strong></div><small>${new Date(r.created_at).toLocaleString('ko-KR')}</small>${r.memo?`<p class="muted">${esc(r.memo)}</p>`:''}</div>`).join(''):'<div class="empty">아직 성장기록이 없습니다.</div>'}async function loadDashboard(){const id=$('child').value;if(!id)return;$('msg').textContent='';try{const d=await SparkData.rpc('spark_family_my_spark',{p_child_id:id});render(d)}catch(e){console.error(e);$('msg').textContent='MY SPARK를 불러오지 못했습니다.'}}$('child').onchange=loadDashboard;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await loadChildren()}catch(_){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())loadChildren().catch(()=>{$('msg').textContent='가족 연결정보를 확인해 주세요.'})})();</script></body></html>
