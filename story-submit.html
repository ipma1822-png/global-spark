<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SPARK · 성장 이야기 제출</title><link rel="stylesheet" href="assets/css/style.css?v=3730"><style>body{background:#071126;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.panel{padding:18px;margin-top:12px;border-radius:20px;background:#0e1930;border:1px solid #ffffff16}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#091326;color:#fff}button{background:#ff9f1c;color:#071126;font-weight:900}.muted,small{color:#9fb2ce}.note{padding:13px;border-left:4px solid #ffd166;background:#ffd1660b;border-radius:10px;line-height:1.65}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:4px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b></a><section class="panel"><small>GS-21 · v3.73.0</small><h1>성장 이야기 제출</h1><p class="muted">성장기지가 실제 변화 사례를 본부에 제출합니다. 제출 즉시 공개되지 않으며 본부 검토 후 공개됩니다.</p><div class="note"><b>개인정보 보호</b><br>아이의 실명, 얼굴사진, 전화번호, 학교·주소처럼 개인을 특정할 수 있는 정보는 적지 마세요. 아이 성장 사례는 보호자 공개 동의가 확인되어야 제출할 수 있습니다.</div></section><section class="panel" id="loginBox"><div class="grid"><input id="email" type="email" placeholder="지도자 이메일"><input id="pw" type="password" placeholder="비밀번호"></div><button id="login" style="margin-top:8px">로그인</button><p id="msg" class="muted"></p></section><section class="panel" id="formBox" hidden><div class="grid"><select id="center"></select><select id="type"><option value="child_growth">아이 성장 이야기</option><option value="growth_base">성장기지 사례</option><option value="campaign">캠페인 성과</option><option value="community">공동체 변화</option></select><select id="flame"><option value="">불꽃 선택 안 함</option><option value="GOOD">GOOD · 좋은 행동</option><option value="SAFE">SAFE · 안전</option><option value="EARTH">EARTH · 환경</option><option value="CHALLENGE">CHALLENGE · 도전</option><option value="CITIZEN">CITIZEN · 함께</option></select><input id="campaign" placeholder="캠페인 UUID(선택)"></div><input id="title" maxlength="120" placeholder="제목" style="margin-top:8px"><textarea id="body" rows="10" maxlength="3000" placeholder="어떤 변화가 있었는지 20자 이상 적어 주세요." style="margin-top:8px"></textarea><label class="check" style="margin:12px 0"><input id="consent" type="checkbox"><span>아이 성장 이야기인 경우 보호자에게 공개 동의를 확인했습니다.</span></label><button id="submit">본부 검토 요청</button><p id="result" class="muted"></p></section></main><script src="assets/js/config.js?v=3730"></script><script src="assets/js/spark-data.js?v=3730"></script><script>(()=>{const $=id=>document.getElementById(id);async function loadCenters(){const rows=await SparkData.getMyCenters();$('loginBox').hidden=true;$('formBox').hidden=false;$('center').innerHTML=rows.map(c=>`<option value="${String(c.center_code).replace(/"/g,'&quot;')}">${String(c.name)} · ${String(c.center_code)}</option>`).join('');if(!rows.length){$('result').textContent='연결된 성장기지가 없습니다.';$('submit').disabled=true}}$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('pw').value);await loadCenters()}catch(e){$('msg').textContent='로그인 또는 성장기지 권한을 확인해 주세요.'}};$('submit').onclick=async()=>{const type=$('type').value,title=$('title').value.trim(),body=$('body').value.trim();if(title.length<3||body.length<20)return alert('제목 3자 이상, 내용 20자 이상 입력해 주세요.');if(type==='child_growth'&&!$('consent').checked)return alert('아이 성장 이야기는 보호자 공개 동의 확인이 필요합니다.');$('submit').disabled=true;try{const id=await SparkData.rpc('spark_center_submit_story',{p_center_code:$('center').value,p_story_type:type,p_title:title,p_story_body:body,p_flame_code:$('flame').value||null,p_campaign_id:$('campaign').value.trim()||null,p_consent_confirmed:$('consent').checked});$('result').textContent='✓ 본부 검토 요청이 접수되었습니다. 공개 전까지 외부에는 보이지 않습니다.';$('title').value='';$('body').value='';$('campaign').value='';$('consent').checked=false}catch(e){console.error(e);$('result').textContent='제출하지 못했습니다. 입력값·권한·동의 여부를 확인해 주세요.'}finally{$('submit').disabled=false}};if(SparkData.isSignedIn())loadCenters().catch(()=>{$('msg').textContent='성장기지 정보를 확인해 주세요.'})})();</script></body></html>
