<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071126"><title>GLOBAL SPARK · 온보딩 관제 · GB-23 v3.39.0</title><link rel="stylesheet" href="assets/css/style.css?v=3390"><style>body{margin:0;background:#071126;color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.head,.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel,.login,.card{margin-top:14px;padding:17px;border-radius:20px;background:#0e1930;border:1px solid #ffffff15}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border-radius:15px;background:#0a1428}.stat b{display:block;font-size:26px}.grid{display:grid;gap:10px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.meta div{padding:9px;border-radius:10px;background:#0a1428}.muted,small{color:#9fb2ce}.ver,.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#172743}.ver{color:#ffd27a;border:1px solid #ffb34766}.high{border-left:4px solid #ff6b6b}.medium{border-left:4px solid #ffd166}.btn,button{padding:10px 12px;border:0;border-radius:10px;background:#ff9f1c;color:#071126;font-weight:900;text-decoration:none}.secondary{background:#172743;color:#fff;border:1px solid #ffffff18}@media(max-width:850px){.stats,.meta{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats,.meta{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><a href="index.html" style="color:#fff;text-decoration:none">🔥 <b>GLOBAL SPARK</b> · HQ</a><span class="ver">GB-23 · v3.39.0</span></header><section class="panel"><small>OFFICIAL GROWTH BASE ONBOARDING WATCH</small><h1>HQ 온보딩 관제센터</h1><p class="muted">공식 성장기지가 지정된 뒤 STAFF·회원·첫 활동·승인센터·LEVEL·공식 프로필 단계가 어디에서 멈췄는지 자동 감지합니다.</p><div class="tools"><div><a class="btn secondary" href="command-center.html">🌍 COMMAND CENTER</a> <a class="btn secondary" href="official-growth-base-admin.html">🏫 공식 성장기지 지정</a></div><button id="reload">지금 다시 감지</button></div></section><section id="loginBox" class="login"><b>HQ 관리자 로그인</b><div><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><p id="msg" class="muted"></p></section><section class="panel"><h2>📊 온보딩 현황</h2><div id="stats" class="stats"><div class="stat"><small>로그인 필요</small><b>-</b></div></div></section><section class="panel"><h2>🚨 지원 필요 신호</h2><div id="signals" class="grid"></div></section><section class="panel"><h2>🏫 공식 성장기지 진행상태</h2><div id="centers" class="grid"></div></section></main><script src="assets/js/config.js?v=3390"></script><script src="assets/js/spark-data.js?v=3390"></script><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(d){const s=d.summary||{};$('stats').innerHTML=[['공식 성장기지',s.official_centers],['미해결 신호',s.open_signals],['높은 우선순위',s.high_or_critical],['자동점검','08:45']].map(x=>`<div class="stat"><small>${x[0]}</small><b>${typeof x[1]==='number'?x[1]:x[1]||0}</b></div>`).join('');$('signals').innerHTML=(d.signals||[]).map(x=>`<article class="card ${esc(x.severity)}"><div class="head"><div><span class="tag">${esc(x.severity)}</span> <b>${esc(x.center_name)}</b><small>${esc(x.center_code)}</small></div><small>${new Date(x.detected_at).toLocaleString('ko-KR')}</small></div><h3>${esc(x.title)}</h3><p>${esc(x.message)}</p><a class="btn secondary" href="center-onboarding.html?center=${encodeURIComponent(x.center_code)}">온보딩 열기</a></article>`).join('')||'<p class="muted">현재 지원이 필요한 온보딩 신호가 없습니다.</p>';$('centers').innerHTML=(d.centers||[]).map(c=>`<article class="card"><div class="head"><div><b>${esc(c.center_name)}</b><small>${esc(c.designation_code||'')}</small></div><span class="tag">지정 후 ${Number(c.days_since_designation||0)}일</span></div><div class="meta"><div><small>STAFF</small><br><b>${Number(c.staff_count||0)}</b></div><div><small>회원</small><br><b>${Number(c.member_count||0)}</b></div><div><small>활동</small><br><b>${Number(c.activity_count||0)}</b></div><div><small>LEVEL 이력</small><br><b>${Number(c.level_count||0)}</b></div></div><p>승인센터 ${c.approval_confirmed?'✅':'⬜'} · 공식 프로필 ${c.profile_confirmed?'✅':'⬜'} · 미해결 신호 ${Number(c.open_signal_count||0)}건</p><a class="btn secondary" href="center-onboarding.html?center=${encodeURIComponent(c.center_code)}">온보딩 상세</a></article>`).join('')||'<p class="muted">현재 공식 지정된 성장기지가 없습니다.</p>'}async function load(){try{const d=await SparkData.rpc('spark_hq_onboarding_watch',{});$('loginBox').hidden=true;$('msg').textContent='';draw(d)}catch(e){console.error(e);$('msg').textContent='HQ 관리자 권한을 확인해 주세요.'}}$('reload').onclick=load;$('login').onclick=async()=>{try{await SparkData.signIn($('email').value.trim(),$('password').value);await load()}catch(e){$('msg').textContent='로그인 정보를 확인해 주세요.'}};if(SparkData.isSignedIn())load()})();</script></body></html>
