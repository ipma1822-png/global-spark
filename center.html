<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPARK CENTER · v1.9.0</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.wrap{max-width:1100px;margin:auto}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:18px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.member-btn,.rule-btn{padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#111827;color:#fff;text-align:left}.member-btn.active,.rule-btn.active{outline:2px solid #ff9f1c}
.rule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.recent{display:grid;gap:9px}.recent-item{padding:12px;border-radius:12px;background:rgba(255,255,255,.035);display:flex;justify-content:space-between;gap:10px}.memo{width:100%;padding:12px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid rgba(255,255,255,.14);box-sizing:border-box}
.flash{font-size:1.5rem;font-weight:800;color:#ffb347;min-height:32px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.member-grid,.rule-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.member-grid,.rule-grid{grid-template-columns:1fr}}
</style></head><body>
<header class="site-header"><a class="brand" href="my-centers.html">🔥 <b>SPARK CENTER</b></a><div class="version-pill">v1.9.0</div></header>
<main class="container wrap">
<section class="hero compact"><div class="topbar"><div><p class="eyebrow">MULTI-CENTER REAL OPERATION</p><h1 id="centerTitle">센터 운영</h1><p class="lead">아이의 좋은 행동을 발견하고 공식 SPARK XP로 기록합니다.</p></div><a class="btn secondary" id="manageMembersLink" href="#">아이 관리</a></div></section>
<section class="grid">
 <div class="panel">
   <h2>1. 아이 선택</h2><div id="memberGrid" class="member-grid"><p class="empty">불러오는 중…</p></div>
   <h2 style="margin-top:18px">2. 좋은 행동</h2><div id="ruleGrid" class="rule-grid"><p class="empty">불러오는 중…</p></div>
   <h2 style="margin-top:18px">3. 메모 (선택)</h2><input id="activityMemo" class="memo" maxlength="200" placeholder="예: 친구 신발 정리를 도와줌">
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="registerBtn" class="primary" type="button">🔥 SPARK 등록</button><button id="undoBtn" class="secondary" type="button">UNDO</button></div>
   <div id="flashMsg" class="flash"></div>
 </div>
 <div class="panel">
   <h2>센터 최근 SPARK</h2><div id="recentList" class="recent"><p class="empty">불러오는 중…</p></div>
 </div>
</section>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/spark-data.js"></script><script src="assets/js/center.js"></script></body></html>
